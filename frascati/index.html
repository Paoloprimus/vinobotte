<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Frascati e Castelli Romani — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Frascati e Castelli Romani</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Frascati e Castelli Romani</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Borgo del Cedro","s":"borgo-del-cedro","c":"Monte Porzio Catone","d":["Frascati e Castelli Romani"]},{"n":"Cantina Raparelli","s":"cantina-raparelli","c":"Marino","d":["Frascati e Castelli Romani"]},{"n":"Cantina Villafranca","s":"cantina-villafranca","c":"Albano Laziale","d":["Frascati e Castelli Romani"]},{"n":"Cantinamena","s":"cantinamena","c":"Lanuvio","d":["Frascati e Castelli Romani"]},{"n":"Cantine Fabi","s":"cantine-fabi","c":"Marino","d":["Frascati e Castelli Romani"]},{"n":"Cantine San Marco","s":"cantine-san-marco","c":"Frascati","d":["Frascati e Castelli Romani"]},{"n":"Cantine Silvestri","s":"cantine-silvestri","c":"Lanuvio","d":["Frascati e Castelli Romani"]},{"n":"Carlo Noro","s":"carlo-noro","c":"Labico","d":["Frascati e Castelli Romani"]},{"n":"Casale Mattia","s":"casale-mattia","c":"Frascati","d":["Frascati e Castelli Romani"]},{"n":"Casale Vallechiesa","s":"casale-vallechiesa","c":"Frascati","d":["Frascati e Castelli Romani"]},{"n":"Castel de Paolis","s":"castel-de-paolis","c":"Grottaferrata","d":["Frascati e Castelli Romani"]},{"n":"Colleformica","s":"colleformica","c":"Velletri","d":["Frascati e Castelli Romani"]},{"n":"Di Palma Riccardo","s":"di-palma-riccardo","c":"Velletri","d":["Frascati e Castelli Romani"]},{"n":"Dino Limiti","s":"dino-limiti","c":"Marino","d":["Frascati e Castelli Romani"]},{"n":"Emilio Marconi","s":"emilio-marconi","c":"Ariccia","d":["Frascati e Castelli Romani"]},{"n":"Eredi dei Papi","s":"eredi-dei-papi","c":"Monte Compatri","d":["Frascati e Castelli Romani"]},{"n":"Fontana Candida","s":"fontana-candida","c":"Monte Porzio Catone","d":["Frascati e Castelli Romani"]},{"n":"Gotto d’Oro","s":"gotto-doro","c":"Marino","d":["Frascati e Castelli Romani"]},{"n":"l'Olivella","s":"l-olivella","c":"Frascati","d":["Frascati e Castelli Romani"]},{"n":"La Tognazza","s":"la-tognazza","c":"Velletri","d":["Frascati e Castelli Romani"]},{"n":"Luna del Casale","s":"luna-del-casale","c":"Lanuvio","d":["Frascati e Castelli Romani"]},{"n":"Maliar","s":"maliar","c":"Albano Laziale","d":["Frascati e Castelli Romani"]},{"n":"Mentiroso","s":"mentiroso","c":"Marino","d":["Frascati e Castelli Romani"]},{"n":"Merumalia","s":"merumalia","c":"Frascati","d":["Frascati e Castelli Romani"]},{"n":"Nina Trinca","s":"nina-trinca","c":"Zagarolo","d":["Frascati e Castelli Romani"]},{"n":"Pietra Porzia","s":"pietra-porzia","c":"Frascati","d":["Frascati e Castelli Romani"]},{"n":"Poggio Le Volpi","s":"poggio-le-volpi","c":"Monte Porzio Catone","d":["Frascati e Castelli Romani"]},{"n":"Principe Pallavicini","s":"principe-pallavicini","c":"Colonna","d":["Frascati e Castelli Romani"]},{"n":"Tenimenti Leone","s":"tenimenti-leone","c":"Lanuvio","d":["Frascati e Castelli Romani"]},{"n":"Tenuta Iacoangeli","s":"tenuta-iacoangeli","c":"Genzano di Roma","d":["Frascati e Castelli Romani"]},{"n":"Tufaio","s":"tufaio","c":"Zagarolo","d":["Frascati e Castelli Romani"]},{"n":"Villa Simone","s":"villa-simone","c":"Monte Porzio Catone","d":["Frascati e Castelli Romani"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
