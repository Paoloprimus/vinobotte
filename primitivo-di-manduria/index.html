<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Primitivo di Manduria — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Primitivo di Manduria</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Primitivo di Manduria</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Agricola Erario","s":"agricola-erario","c":"Manduria","d":["Primitivo di Manduria"]},{"n":"Agricola Fabiana","s":"agricola-fabiana","c":"San Giorgio Ionico","d":["Primitivo di Manduria"]},{"n":"Agricola Pliniana","s":"agricola-pliniana","c":"Manduria","d":["Primitivo di Manduria"]},{"n":"Anastasia Tommasino","s":"anastasia-tommasino","c":"Manduria","d":["Primitivo di Manduria"]},{"n":"Antica Masseria Jorche","s":"antica-masseria-jorche","c":"Torricella","d":["Primitivo di Manduria"]},{"n":"Apollonio 1870","s":"apollonio-1870","c":"Monteroni di Lecce","d":["Primitivo di Manduria"]},{"n":"Bosco Società Cooperativa Agricola","s":"bosco-societ-cooperativa-agricola","c":"Avetrana","d":["Primitivo di Manduria"]},{"n":"Calitro","s":"calitro","c":"Martina Franca","d":["Primitivo di Manduria"]},{"n":"Cantina Cooperativa Madonna Delle Grazie Di Torricella","s":"cantina-cooperativa-madonna-delle-grazie-di-torricella","c":"Torricella","d":["Primitivo di Manduria"]},{"n":"Cantina e Oleificio Sociale di Fragagnano","s":"cantina-e-oleificio-sociale-di-fragagnano","c":"Fragagnano","d":["Primitivo di Manduria"]},{"n":"Cantine di Marco","s":"cantine-di-marco","c":"Martina Franca","d":["Primitivo di Manduria"]},{"n":"Cantine Due Palme","s":"cantine-due-palme","c":"Cellino San Marco","d":["Primitivo di Manduria"]},{"n":"Cantine Harmonia","s":"cantine-harmonia","c":"Sava","d":["Primitivo di Manduria"]},{"n":"Cantine Lizzano","s":"cantine-lizzano","c":"Lizzano","d":["Primitivo di Manduria"]},{"n":"Cantine Paolo Leo","s":"cantine-paolo-leo","c":"San Donaci","d":["Primitivo di Manduria"]},{"n":"Cantine San Marzano","s":"cantine-san-marzano","c":"San Marzano di San Giuseppe","d":["Primitivo di Manduria"]},{"n":"Cantine Soloperto","s":"cantine-soloperto","c":"Manduria","d":["Primitivo di Manduria"]},{"n":"Cantolio Manduria","s":"cantolio-manduria","c":"Manduria","d":["Primitivo di Manduria"]},{"n":"Cantore Di Castelforte","s":"cantore-di-castelforte","c":"Manduria","d":["Primitivo di Manduria"]},{"n":"Capuzzimati","s":"capuzzimati","c":"San Marzano di San Giuseppe","d":["Primitivo di Manduria"]},{"n":"Commenda Magistrale","s":"commenda-magistrale","c":"Maruggio","d":["Primitivo di Manduria"]},{"n":"Contrada li Vecchi","s":"contrada-li-vecchi","c":"Cellino San Marco","d":["Primitivo di Manduria"]},{"n":"Dimaggio","s":"dimaggio","c":"Fragagnano","d":["Primitivo di Manduria"]},{"n":"Erminio Campa Viticoltore","s":"erminio-campa-viticoltore","c":"Torricella","d":["Primitivo di Manduria"]},{"n":"Feudi Salentini","s":"feudi-salentini","c":"Leporano","d":["Primitivo di Manduria"]},{"n":"Giai","s":"giai","c":"Carosino","d":["Primitivo di Manduria"]},{"n":"Girolamo","s":"girolamo","c":"Martina Franca","d":["Primitivo di Manduria"]},{"n":"La Pruina","s":"la-pruina","c":"Torre Santa Susanna","d":["Primitivo di Manduria"]},{"n":"Le Fiatte","s":"le-fiatte","c":"Sava","d":["Primitivo di Manduria"]},{"n":"Leone De Castris","s":"leone-de-castris","c":"Salice Salentino","d":["Primitivo di Manduria"]},{"n":"Lomartire","s":"lomartire","c":"Torricella","d":["Primitivo di Manduria"]},{"n":"Luca Attanasio","s":"luca-attanasio","c":"Sava","d":["Primitivo di Manduria"]},{"n":"Masca Del Tacco","s":"masca-del-tacco","c":"Erchie","d":["Primitivo di Manduria"]},{"n":"Masseria Altemura","s":"masseria-altemura","c":"Torre Santa Susanna","d":["Primitivo di Manduria"]},{"n":"Masseria Borgo Dei Trulli","s":"masseria-borgo-dei-trulli","c":"Maruggio","d":["Primitivo di Manduria"]},{"n":"Masseria Cicella","s":"masseria-cicella","c":"Torricella","d":["Primitivo di Manduria"]},{"n":"Masseria Cuturi","s":"masseria-cuturi","c":"Manduria","d":["Primitivo di Manduria"]},{"n":"Masseria Pietrosa","s":"masseria-pietrosa","c":"San Marzano di San Giuseppe","d":["Primitivo di Manduria"]},{"n":"Monte Tessa","s":"monte-tessa","c":"Locorotondo","d":["Primitivo di Manduria"]},{"n":"Mottura Vini Del Salento","s":"mottura-vini-del-salento","c":"Tuglie","d":["Primitivo di Manduria"]},{"n":"Pazzia","s":"pazzia","c":"Fragagnano","d":["Primitivo di Manduria"]},{"n":"Pezzaviva","s":"pezzaviva","c":"Torre Santa Susanna","d":["Primitivo di Manduria"]},{"n":"Podere Angelini","s":"podere-angelini","c":"Manduria","d":["Primitivo di Manduria"]},{"n":"Produttori Di Manduria","s":"produttori-di-manduria","c":"Manduria","d":["Primitivo di Manduria"]},{"n":"Puglia Pop","s":"puglia-pop","c":"Martina Franca","d":["Primitivo di Manduria"]},{"n":"San Giorgio – Tinazzi","s":"san-giorgio-tinazzi","c":"Faggiano","d":["Primitivo di Manduria"]},{"n":"Schiena","s":"schiena","c":"Villa Castelli","d":["Primitivo di Manduria"]},{"n":"Tenuta Giustini","s":"tenuta-giustini","c":"San Giorgio Jonico","d":["Primitivo di Manduria"]},{"n":"Tenute Bellamarina","s":"tenute-bellamarina","c":"Torre Santa Susanna","d":["Primitivo di Manduria"]},{"n":"Tenute Cerfeda dell'Elba","s":"tenute-cerfeda-dellelba","c":"Taranto","d":["Primitivo di Manduria"]},{"n":"Tenute Eméra Di Claudio Quarta Vignaiolo","s":"tenute-emera-di-claudio-quarta-vignaiolo","c":"Lizzano","d":["Primitivo di Manduria"]},{"n":"Terracalò","s":"terracalo","c":"Sava","d":["Primitivo di Manduria"]},{"n":"Terre Auree","s":"terre-auree","c":"Grottaglie","d":["Primitivo di Manduria"]},{"n":"Terre del Palmento","s":"terre-del-palmento","c":"Locorotondo","d":["Primitivo di Manduria"]},{"n":"Trullo Di Pezza","s":"trullo-di-pezza","c":"Torricella","d":["Primitivo di Manduria"]},{"n":"Varvaglione 1921","s":"varvaglione-1921","c":"Leporano","d":["Primitivo di Manduria"]},{"n":"Vespa Vignaioli per Passione","s":"vespa-vignaioli-per-passione","c":"Manduria","d":["Primitivo di Manduria"]},{"n":"Vigne Monache","s":"vigne-monache","c":"Manduria","d":["Primitivo di Manduria"]},{"n":"Vigneti Reale","s":"vigneti-reale","c":"Cellino San Marco","d":["Primitivo di Manduria"]},{"n":"Vineka","s":"vineka","c":"Martina Franca","d":["Primitivo di Manduria"]},{"n":"Vinicola Savese Pichierri","s":"vinicola-savese-pichierri","c":"Sava","d":["Primitivo di Manduria"]},{"n":"Vitivinicoltori De Quarto","s":"vitivinicoltori-de-quarto","c":"Leporano","d":["Primitivo di Manduria"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
