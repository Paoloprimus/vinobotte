<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Etna — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Etna</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Etna</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Ammura","s":"ammura","c":"Linguaglossa","d":["Etna"]},{"n":"Antichi Vinai","s":"antichi-vinai","c":"Castiglione di Sicilia","d":["Etna"]},{"n":"Antichi Vini Di Sicilia","s":"antichi-vini-di-sicilia","c":"Piedimonte Etneo","d":["Etna"]},{"n":"Azienda Agricola Filippo Grasso","s":"azienda-agricola-filippo-grasso","c":"Randazzo","d":["Etna"]},{"n":"Azienda Agricola Francesco Modica","s":"azienda-agricola-francesco-modica","c":"Randazzo","d":["Etna"]},{"n":"Barone Beneventano","s":"barone-beneventano","c":"Trecastagni","d":["Etna"]},{"n":"Barone Di Miceli","s":"barone-di-miceli","c":"Castiglione di Sicilia","d":["Etna"]},{"n":"Barone di Villagrande","s":"barone-di-villagrande","c":"Milo","d":["Etna"]},{"n":"Benanti","s":"benanti","c":"Viagrande","d":["Etna"]},{"n":"Camporè","s":"campore","c":"Randazzo","d":["Etna"]},{"n":"Cantina Maugeri","s":"cantina-maugeri","c":"Acireale","d":["Etna"]},{"n":"Cantine Di Nessuno","s":"cantine-di-nessuno","c":"Catania","d":["Etna"]},{"n":"Cantine Iuppa","s":"cantine-iuppa","c":"Milo","d":["Etna"]},{"n":"Cantine La Contea","s":"cantine-la-contea","c":"Mascali","d":["Etna"]},{"n":"Cantine Nicosia","s":"cantine-nicosia","c":"Trecastagni","d":["Etna"]},{"n":"Cantine Russo","s":"cantine-russo","c":"Castiglione di Sicilia","d":["Etna"]},{"n":"Castello Solicchiata","s":"castello-solicchiata","c":"Adrano","d":["Etna"]},{"n":"Cottanera","s":"cottanera","c":"Messina","d":["Etna"]},{"n":"Destro","s":"destro","c":"Randazzo","d":["Etna"]},{"n":"Eduardo Torres Acosta","s":"eduardo-torres-acosta","c":"Castiglione di Sicilia","d":["Etna"]},{"n":"Eudes","s":"eudes","c":"Trecastagni","d":["Etna"]},{"n":"Fattorie Romeo Del Castello","s":"fattorie-romeo-del-castello","c":"Randazzo","d":["Etna"]},{"n":"Fischetti","s":"fischetti","c":"Castiglione di Sicilia","d":["Etna"]},{"n":"Frank Cornelissen","s":"frank-cornelissen","c":"Castiglione di Sicilia","d":["Etna"]},{"n":"Gambino","s":"gambino","c":"Linguaglossa","d":["Etna"]},{"n":"Generazione Alessandro","s":"generazione-alessandro","c":"Linguaglossa","d":["Etna"]},{"n":"Girolamo Russo","s":"girolamo-russo","c":"Castiglione di Sicilia","d":["Etna"]},{"n":"Graci","s":"graci","c":"Giarre","d":["Etna"]},{"n":"I Custodi delle vigne dell’Etna","s":"i-custodi-delle-vigne-delletna","c":"Castiglione di Sicilia","d":["Etna"]},{"n":"I Vigneri","s":"i-vigneri","c":"Milo","d":["Etna"]},{"n":"Irene Badalà","s":"irene-badala","c":"Castiglione di Sicilia","d":["Etna"]},{"n":"Masseria Del Pino","s":"masseria-del-pino","c":"Randazzo","d":["Etna"]},{"n":"Massimo Lentsch","s":"massimo-lentsch","c":"Randazzo","d":["Etna"]},{"n":"Monaci delle Terre Nere","s":"monaci-delle-terre-nere","c":"Zafferana Etnea","d":["Etna"]},{"n":"Murgo","s":"murgo","c":"Santa Venerina","d":["Etna"]},{"n":"Oro D’Etna","s":"oro-detna","c":"Zafferana Etnea","d":["Etna"]},{"n":"Palmento Carranco","s":"palmento-carranco","c":"Castiglione di Sicilia","d":["Etna"]},{"n":"Palmento Costanzo","s":"palmento-costanzo","c":"Castiglione di Sicilia","d":["Etna"]},{"n":"Palmento La Rosa","s":"palmento-la-rosa","c":"Pedara","d":["Etna"]},{"n":"Pietradolce","s":"pietradolce","c":"Giarre","d":["Etna"]},{"n":"Platania Giuseppe","s":"platania-giuseppe","c":"Pedara","d":["Etna"]},{"n":"Puglisi","s":"puglisi","c":"Zafferana Etnea","d":["Etna"]},{"n":"Romeo","s":"romeo","c":"Santa Venerina","d":["Etna"]},{"n":"Serafica","s":"serafica","c":"Nicolosi","d":["Etna"]},{"n":"Tenuta di Fessina","s":"tenuta-di-fessina","c":"Castiglione di Sicilia","d":["Etna"]},{"n":"Tenuta Ferrata","s":"tenuta-ferrata","c":"Castiglione di Sicilia","d":["Etna"]},{"n":"Tenuta Incarrozza","s":"tenuta-incarrozza","c":"Misterbianco","d":["Etna"]},{"n":"Tenuta Papale","s":"tenuta-papale","c":"Belpasso","d":["Etna"]},{"n":"Tenute Bosco","s":"tenute-bosco","c":"Santa Venerina","d":["Etna"]},{"n":"Tenute Mannino di Plachi","s":"tenute-mannino-di-plachi","c":"Viagrande","d":["Etna"]},{"n":"Terra Costantino","s":"terra-costantino","c":"Viagrande","d":["Etna"]},{"n":"Valcerasa","s":"valcerasa","c":"Randazzo","d":["Etna"]},{"n":"Vini Franchetti","s":"vini-franchetti","c":"Castiglione di Sicilia","d":["Etna"]},{"n":"Vivera","s":"vivera","c":"Linguaglossa","d":["Etna"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
