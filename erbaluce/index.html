<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Erbaluce di Caluso e Carema — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Erbaluce di Caluso e Carema</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Erbaluce di Caluso e Carema</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Alberand","s":"alberand","c":"Salassa","d":["Erbaluce di Caluso e Carema"]},{"n":"Azienda Agricola Donnalia","s":"azienda-agricola-donnalia","c":"Salussola","d":["Erbaluce di Caluso e Carema"]},{"n":"Buemi Vini Azienda Agricola","s":"buemi-vini-azienda-agricola","c":"Piverone","d":["Erbaluce di Caluso e Carema"]},{"n":"Cantina dei Produttori Nebbiolo di Carema","s":"cantina-dei-produttori-nebbiolo-di-carema","c":"Carema","d":["Erbaluce di Caluso e Carema"]},{"n":"Cantina della Serra","s":"cantina-della-serra","c":"Piverone","d":["Erbaluce di Caluso e Carema"]},{"n":"Cantina Gnavi Carlo","s":"cantina-gnavi-carlo","c":"Caluso","d":["Erbaluce di Caluso e Carema"]},{"n":"Cantine Crosio","s":"cantine-crosio","c":"Candia Canavese","d":["Erbaluce di Caluso e Carema"]},{"n":"Caretto Loris Livio Azienda Agricola","s":"caretto-loris-livio-azienda-agricola","c":"San Giorgio C.Se","d":["Erbaluce di Caluso e Carema"]},{"n":"Castello di Azeglio","s":"castello-di-azeglio","c":"Azeglio","d":["Erbaluce di Caluso e Carema"]},{"n":"CellaGrande","s":"cellagrande","c":"Viverone","d":["Erbaluce di Caluso e Carema"]},{"n":"Centovigne","s":"centovigne","c":"Cossato","d":["Erbaluce di Caluso e Carema"]},{"n":"Cieck Azienda Agricola","s":"cieck-azienda-agricola","c":"San Giorgio Canavese","d":["Erbaluce di Caluso e Carema"]},{"n":"Cooperativa Produttori Erbaluce di Caluso","s":"cooperativa-produttori-erbaluce-di-caluso","c":"Caluso","d":["Erbaluce di Caluso e Carema"]},{"n":"Ferrando Azienda Vitivinicola","s":"ferrando-azienda-vitivinicola","c":"Ivrea","d":["Erbaluce di Caluso e Carema"]},{"n":"Fontecuore Azienda Agricola","s":"fontecuore-azienda-agricola","c":"San Giorgio Canavese","d":["Erbaluce di Caluso e Carema"]},{"n":"Fratelli Picco Società Semplice Agricola","s":"fratelli-picco-societa-semplice-agricola","c":"Caluso","d":["Erbaluce di Caluso e Carema"]},{"n":"Il Tarassaco","s":"il-tarassaco","c":"Cuceglio","d":["Erbaluce di Caluso e Carema"]},{"n":"Kalamass","s":"kalamass","c":"Palazzo Canavese","d":["Erbaluce di Caluso e Carema"]},{"n":"la Masera","s":"la-masera","c":"Piverone","d":["Erbaluce di Caluso e Carema"]},{"n":"Le Masche","s":"le-masche","c":"Levone","d":["Erbaluce di Caluso e Carema"]},{"n":"Longo Antonio","s":"longo-antonio","c":"Rivarolo Canavese","d":["Erbaluce di Caluso e Carema"]},{"n":"L’erm di Aimino Jyothi","s":"lerm-di-aimino-jyothi","c":"Borgomasino","d":["Erbaluce di Caluso e Carema"]},{"n":"Pietro Cassina","s":"pietro-cassina","c":"Ratina-Fiora","d":["Erbaluce di Caluso e Carema"]},{"n":"Pozzo Azienda Agricola","s":"pozzo-azienda-agricola","c":"Viverone","d":["Erbaluce di Caluso e Carema"]},{"n":"Rostagno","s":"rostagno","c":"Forno Canavese","d":["Erbaluce di Caluso e Carema"]},{"n":"Tappero Merlo","s":"tappero-merlo","c":"Loranzè","d":["Erbaluce di Caluso e Carema"]},{"n":"Tenuta Roletto","s":"tenuta-roletto","c":"Cuceglio","d":["Erbaluce di Caluso e Carema"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
