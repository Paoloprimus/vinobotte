<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Alta Langa — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Alta Langa</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Alta Langa</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Abrigo Fratelli","s":"abrigo-fratelli","c":"Diano D’Alba","d":["Alta Langa"]},{"n":"Araldica Vini – Boutinot International","s":"araldica-vini-boutinot-international","c":"Castel Boglione","d":["Alta Langa"]},{"n":"Beppe Marino","s":"beppe-marino","c":"Santo Stefano Belbo","d":["Alta Langa"]},{"n":"Bera Di Bera Valter Az. Agricola","s":"bera-di-bera-valter-az-agricola","c":"Neviglie","d":["Alta Langa"]},{"n":"Borgo Maragliano","s":"borgo-maragliano","c":"Loazzolo -","d":["Alta Langa"]},{"n":"Bosca","s":"bosca","c":"Canelli","d":["Alta Langa"]},{"n":"Cantina Clavesana","s":"cantina-clavesana","c":"Clavesana","d":["Alta Langa"]},{"n":"Cascina Bretta Rossa","s":"cascina-bretta-rossa","c":"Tagliolo Monferrato","d":["Alta Langa"]},{"n":"Cascina Fonda","s":"cascina-fonda","c":"Neive","d":["Alta Langa"]},{"n":"Colombo","s":"colombo","c":"Bubbio","d":["Alta Langa"]},{"n":"Coppo","s":"coppo","c":"Canelli","d":["Alta Langa"]},{"n":"Cuvage","s":"cuvage","c":"Acqui Terme","d":["Alta Langa"]},{"n":"Enrico Serafino","s":"enrico-serafino","c":"Canale d’Alba","d":["Alta Langa"]},{"n":"Fratelli Grimaldi","s":"fratelli-grimaldi","c":"Santo Stefano Belbo","d":["Alta Langa"]},{"n":"Garbarino Roberto","s":"garbarino-roberto","c":"Neviglie","d":["Alta Langa"]},{"n":"Garesio","s":"garesio","c":"Serralunga D'Alba","d":["Alta Langa"]},{"n":"Germano Ettore","s":"germano-ettore","c":"Serralunga D'Alba","d":["Alta Langa"]},{"n":"Giulio Cocchi Spumanti","s":"giulio-cocchi-spumanti","c":"Cocconato","d":["Alta Langa"]},{"n":"La Fusina","s":"la-fusina","c":"Dogliani","d":["Alta Langa"]},{"n":"LHV S.R.L. Ag","s":"lhv-s-r-l-ag","c":"Calamandrana","d":["Alta Langa"]},{"n":"Marcalberto","s":"marcalberto","c":"S. Stefano Belbo","d":["Alta Langa"]},{"n":"Massimo Rivetti","s":"massimo-rivetti","c":"Neive","d":["Alta Langa"]},{"n":"Matteo Correggia","s":"matteo-correggia","c":"Canale D'Alba","d":["Alta Langa"]},{"n":"Mauro Sebaste","s":"mauro-sebaste","c":"Alba","d":["Alta Langa"]},{"n":"Monsignore","s":"monsignore","c":"Vicoforte","d":["Alta Langa"]},{"n":"Oriolo","s":"oriolo","c":"Montelupo Albese","d":["Alta Langa"]},{"n":"Pasquale Pelissero","s":"pasquale-pelissero","c":"Neive","d":["Alta Langa"]},{"n":"Pianbello","s":"pianbello","c":"Loazzolo","d":["Alta Langa"]},{"n":"Podere Gagliassi","s":"podere-gagliassi","c":"Monforte D Alba","d":["Alta Langa"]},{"n":"Poderi Cusmano","s":"poderi-cusmano","c":"San Marzano Oliveto","d":["Alta Langa"]},{"n":"San Silvestro","s":"san-silvestro","c":"Novello","d":["Alta Langa"]},{"n":"Tenuta Carretta","s":"tenuta-carretta","c":"Piobesi D'Alba","d":["Alta Langa"]},{"n":"Tenuta del Garino","s":"tenuta-del-garino","c":"Clavesana","d":["Alta Langa"]},{"n":"Terre del Barolo – Vinum Vita Est","s":"terre-del-barolo-vinum-vita-est","c":"Castiglione Falletto","d":["Alta Langa"]},{"n":"Vallebelbo","s":"vallebelbo","c":"Santo Stefano Belbo","d":["Alta Langa"]},{"n":"Vite Colte","s":"vite-colte","c":"Barolo","d":["Alta Langa"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
