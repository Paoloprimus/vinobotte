<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini d’Acqui — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini d’Acqui</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Brachetto d’Acqui, Acqui e Dolcetto d’Acqui</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Araldica Vini – Boutinot International","s":"araldica-vini-boutinot-international","c":"Castel Boglione","d":["Vini d’Acqui"]},{"n":"Arione","s":"arione","c":"Canelli","d":["Vini d’Acqui"]},{"n":"Arnera Giulio Az. Agr. Di Arnera Matteo","s":"arnera-giulio-az-agr-di-arnera-matteo","c":"Strevi","d":["Vini d’Acqui"]},{"n":"Azienda Agricola Alessandro Motta","s":"azienda-agricola-alessandro-motta","c":"Castel Rocchero","d":["Vini d’Acqui"]},{"n":"Azienda Agricola Botto Pier Luigi","s":"azienda-agricola-botto-pier-luigi","c":"Ricaldone","d":["Vini d’Acqui"]},{"n":"Azienda Agricola Cascina Pian d’Or di Barbero Valter","s":"azienda-agricola-cascina-pian-dor-di-barbero-valter","c":"Mango","d":["Vini d’Acqui"]},{"n":"Azienda Agricola Ca’ di Cicul di Salina Carla Cristina","s":"azienda-agricola-ca-di-cicul-di-salina-carla-cristina","c":"Strevi","d":["Vini d’Acqui"]},{"n":"Bera Di Bera Valter Az. Agricola","s":"bera-di-bera-valter-az-agricola","c":"Neviglie","d":["Vini d’Acqui"]},{"n":"Bersano Vini","s":"bersano-vini","c":"Nizza Monferrato","d":["Vini d’Acqui"]},{"n":"Borgo Isolabella","s":"borgo-isolabella","c":"Loazzolo","d":["Vini d’Acqui"]},{"n":"Bragagnolo Vini Passiti di Silvio Bragagnolo","s":"bragagnolo-vini-passiti-di-silvio-bragagnolo","c":"Strevi","d":["Vini d’Acqui"]},{"n":"Braida Di Bologna Giacomo","s":"braida-di-bologna-giacomo","c":"Rocchetta Tanaro","d":["Vini d’Acqui"]},{"n":"Cantina Alice Bel Colle","s":"cantina-alice-bel-colle","c":"Alice Bel Colle","d":["Vini d’Acqui"]},{"n":"Cantina Di Nizza Monferrato","s":"cantina-di-nizza-monferrato","c":"Nizza Monferrato","d":["Vini d’Acqui"]},{"n":"Cantina Sant’Evasio Di Lacqua Pier Franco & C.","s":"cantina-santevasio-di-lacqua-pier-franco-c","c":"Nizza Monferrato","d":["Vini d’Acqui"]},{"n":"Cantina Sociale Barbera dei Sei Castelli","s":"cantina-sociale-barbera-dei-sei-castelli","c":"Agliano Terme","d":["Vini d’Acqui"]},{"n":"Cantina Sociale di Fontanile","s":"cantina-sociale-di-fontanile","c":"Fontanile","d":["Vini d’Acqui"]},{"n":"Cantina Sociale di Mombercelli","s":"cantina-sociale-di-mombercelli","c":"Mombercelli","d":["Vini d’Acqui"]},{"n":"Cantina Sociale di Rivalta Bormida","s":"cantina-sociale-di-rivalta-bormida","c":"Rivalta Bormida","d":["Vini d’Acqui"]},{"n":"Cantina Sociale Vinchio-Vaglio Serra","s":"cantina-sociale-vinchio-vaglio-serra","c":"Vinchio","d":["Vini d’Acqui"]},{"n":"Capetta Ivip","s":"capetta-ivip","c":"Santo Stefano Belbo","d":["Vini d’Acqui"]},{"n":"Casa Vinicola Morando","s":"casa-vinicola-morando","c":"Costigliole d’Asti","d":["Vini d’Acqui"]},{"n":"Cavallero Lorenzo Az. Agr.","s":"cavallero-lorenzo-az-agr","c":"Vesime","d":["Vini d’Acqui"]},{"n":"Corte Dei Balbi Soprani","s":"corte-dei-balbi-soprani","c":"Santo Stefano Belbo","d":["Vini d’Acqui"]},{"n":"Cuvage","s":"cuvage","c":"Acqui Terme","d":["Vini d’Acqui"]},{"n":"Dezzani","s":"dezzani","c":"Cocconato","d":["Vini d’Acqui"]},{"n":"Duchessa Lia","s":"duchessa-lia","c":"Santo Stefano Belbo","d":["Vini d’Acqui"]},{"n":"F.Lli Gancia & C.","s":"f-lli-gancia-c","c":"Canelli","d":["Vini d’Acqui"]},{"n":"Fratelli Grimaldi","s":"fratelli-grimaldi","c":"Santo Stefano Belbo","d":["Vini d’Acqui"]},{"n":"Fratelli Martini Secondo Luigi","s":"fratelli-martini-secondo-luigi","c":"Cossano Belbo","d":["Vini d’Acqui"]},{"n":"Gaglione Simone Az.Agr.","s":"gaglione-simone-az-agr","c":"Ricaldone","d":["Vini d’Acqui"]},{"n":"Giulio Cocchi Spumanti","s":"giulio-cocchi-spumanti","c":"Cocconato","d":["Vini d’Acqui"]},{"n":"Ivaldi Dario Az.Agricola Di Ivaldi En. Andrea","s":"ivaldi-dario-az-agricola-di-ivaldi-en-andrea","c":"Nizza Monferrato","d":["Vini d’Acqui"]},{"n":"La Torre Di Castel Rocchero-Viticoltori Assoc.","s":"la-torre-di-castel-rocchero-viticoltori-assoc","c":"Castel Rocchero","d":["Vini d’Acqui"]},{"n":"Manfredi Aldo Azienda Vinicola","s":"manfredi-aldo-azienda-vinicola","c":"Farigliano","d":["Vini d’Acqui"]},{"n":"Preli","s":"preli","c":"Acqui Terme","d":["Vini d’Acqui"]},{"n":"Santero F.Lli & C.","s":"santero-f-lli-c","c":"Santo Stefano Belbo","d":["Vini d’Acqui"]},{"n":"So.Vi.Pi. Di Lovisolo Massimo & C.","s":"so-vi-pi-di-lovisolo-massimo-c","c":"Calamandrana","d":["Vini d’Acqui"]},{"n":"Tenute Damiano – Castello di Mombaruzzo","s":"tenute-damiano","c":"Mombaruzzo","d":["Vini d’Acqui"]},{"n":"Tre Secoli","s":"tre-secoli","c":"Mombaruzzo","d":["Vini d’Acqui"]},{"n":"Vite Colte","s":"vite-colte","c":"Barolo","d":["Vini d’Acqui"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
