<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Gallura e Vermentino di Gallura — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Gallura e Vermentino di Gallura</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Gallura e Vermentino di Gallura</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Animas","s":"animas","c":"Olbia","d":["Gallura e Vermentino di Gallura"]},{"n":"Atlantis","s":"atlantis","c":"Berchidda","d":["Gallura e Vermentino di Gallura"]},{"n":"Cantina Manconi","s":"cantina-manconi","c":"Tempio Pausania","d":["Gallura e Vermentino di Gallura"]},{"n":"Cantina Tani","s":"cantina-tani","c":"Monti","d":["Gallura e Vermentino di Gallura"]},{"n":"Cantina Vermentino di Monti","s":"cantina-vermentino-di-monti","c":"Monti","d":["Gallura e Vermentino di Gallura"]},{"n":"Capichera","s":"capichera","c":"Arzachena","d":["Gallura e Vermentino di Gallura"]},{"n":"Consorzio San Michele","s":"consorzio-san-michele","c":"Berchidda","d":["Gallura e Vermentino di Gallura"]},{"n":"Demuru","s":"demuru","c":"Berchidda","d":["Gallura e Vermentino di Gallura"]},{"n":"Depperu","s":"depperu","c":"Luras","d":["Gallura e Vermentino di Gallura"]},{"n":"Giogantinu","s":"giogantinu","c":"Berchidda","d":["Gallura e Vermentino di Gallura"]},{"n":"Il Muto di Gallura","s":"il-muto-di-gallura","c":"Aggius","d":["Gallura e Vermentino di Gallura"]},{"n":"La Contralta","s":"la-contralta","c":"Loiri Porto San Paolo","d":["Gallura e Vermentino di Gallura"]},{"n":"La Neula","s":"la-neula","c":"Telti","d":["Gallura e Vermentino di Gallura"]},{"n":"Lu Beddu","s":"lu-beddu","c":"Arzachena","d":["Gallura e Vermentino di Gallura"]},{"n":"Murales","s":"murales","c":"Olbia","d":["Gallura e Vermentino di Gallura"]},{"n":"Muscazega","s":"muscazega","c":"Luras","d":["Gallura e Vermentino di Gallura"]},{"n":"Pedra Majore","s":"pedra-majore","c":"Monti","d":["Gallura e Vermentino di Gallura"]},{"n":"Pedres","s":"pedres","c":"Olbia","d":["Gallura e Vermentino di Gallura"]},{"n":"Petra Bianca","s":"petra-bianca","c":"Palau","d":["Gallura e Vermentino di Gallura"]},{"n":"Piero Mancini","s":"piero-mancini","c":"Olbia","d":["Gallura e Vermentino di Gallura"]},{"n":"Siddùra","s":"siddura","c":"Luogosanto","d":["Gallura e Vermentino di Gallura"]},{"n":"Tanca Raina","s":"tanca-raina","c":"Monti","d":["Gallura e Vermentino di Gallura"]},{"n":"Tenuta Paltusa","s":"tenuta-paltusa","c":"Calangianus","d":["Gallura e Vermentino di Gallura"]},{"n":"Tenuta Teo d'Oro","s":"tenuta-teo-d-oro","c":"Tempio Pausania","d":["Gallura e Vermentino di Gallura"]},{"n":"Tenute Faladas","s":"tenute-faladas","c":"Luras","d":["Gallura e Vermentino di Gallura"]},{"n":"Tenute Filigheddu","s":"tenute-filigheddu","c":"Palau","d":["Gallura e Vermentino di Gallura"]},{"n":"Tenute Gregu","s":"tenute-gregu","c":"Olbia","d":["Gallura e Vermentino di Gallura"]},{"n":"Tenute Olbios","s":"tenute-olbios","c":"Olbia","d":["Gallura e Vermentino di Gallura"]},{"n":"Tenute Vignola","s":"tenute-vignola","c":"Trinità d’Agultu e Vignola","d":["Gallura e Vermentino di Gallura"]},{"n":"Tondini","s":"tondini","c":"Calangianus","d":["Gallura e Vermentino di Gallura"]},{"n":"Un Mare di Vino","s":"un-mare-di-vino","c":"Berchidda","d":["Gallura e Vermentino di Gallura"]},{"n":"Vigneti Zanatta","s":"vigneti-zanatta","c":"Olbia","d":["Gallura e Vermentino di Gallura"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
