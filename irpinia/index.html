<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Irpinia — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Irpinia</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Irpinia</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Adelina Molettieri","s":"adelina-molettieri","c":"Montemarano","d":["Irpinia"]},{"n":"Alabastra","s":"alabastra","c":"Cesinali","d":["Irpinia"]},{"n":"Antica Hirpinia","s":"antica-hirpinia","c":"Taurasi","d":["Irpinia"]},{"n":"Azienda Agricola di Meo","s":"azienda-agricola-di-meo","c":"Salza Irpina","d":["Irpinia"]},{"n":"Boccella Rosa","s":"boccella-rosa","c":"Montemarano","d":["Irpinia"]},{"n":"Cantine Catena","s":"cantine-catena","c":"Montefalcione","d":["Irpinia"]},{"n":"Cantine de Palma","s":"cantine-de-palma","c":"Pratola Serra","d":["Irpinia"]},{"n":"Cantine di Marzo","s":"cantine-di-marzo","c":"Tufo","d":["Irpinia"]},{"n":"Cantine Nesta","s":"cantine-nesta","c":"Caposele","d":["Irpinia"]},{"n":"Cantine Ruggiero","s":"cantine-ruggiero","c":"Melito Irpino","d":["Irpinia"]},{"n":"Case d'Alto","s":"case-d-alto","c":"Grottaminarda","d":["Irpinia"]},{"n":"Ciro Picariello","s":"ciro-picariello","c":"Summonte","d":["Irpinia"]},{"n":"Colli di Castelfranci","s":"colli-di-castelfranci","c":"Castel Baronia","d":["Irpinia"]},{"n":"Colline del Sole","s":"colline-del-sole","c":"Torrioni","d":["Irpinia"]},{"n":"Contea dé Altavilla","s":"contea-de-altavilla","c":"Altavilla Irpina","d":["Irpinia"]},{"n":"Contrada","s":"contrada","c":"Candida","d":["Irpinia"]},{"n":"Corte dei Roberto","s":"corte-dei-roberto","c":"Greci","d":["Irpinia"]},{"n":"Crypta Castagnara Cantine","s":"crypta-castagnara-cantine","c":"Grottolella","d":["Irpinia"]},{"n":"De Lisio","s":"de-lisio","c":"Montemarano","d":["Irpinia"]},{"n":"De' Gaeta","s":"de-gaeta","c":"Castel Baronia","d":["Irpinia"]},{"n":"Donnachiara","s":"donnachiara","c":"Avellino","d":["Irpinia"]},{"n":"F.Lli Romano","s":"f-lli-romano","c":"Lapio","d":["Irpinia"]},{"n":"Fiorentino","s":"fiorentino","c":"Paternopoli","d":["Irpinia"]},{"n":"Fonzone","s":"fonzone","c":"Paternopoli","d":["Irpinia"]},{"n":"Guastaferro","s":"guastaferro","c":"Taurasi","d":["Irpinia"]},{"n":"Guerriero","s":"guerriero","c":"Taurasi","d":["Irpinia"]},{"n":"Guido Marsella","s":"guido-marsella","c":"Summonte","d":["Irpinia"]},{"n":"I Favati","s":"i-favati","c":"Cesinali","d":["Irpinia"]},{"n":"I Gaudi","s":"i-gaudi","c":"Candida","d":["Irpinia"]},{"n":"Il Cortiglio","s":"il-cortiglio","c":"Fontanarosa","d":["Irpinia"]},{"n":"Joaquin","s":"joaquin","c":"Lapio","d":["Irpinia"]},{"n":"La Molara","s":"la-molara","c":"Summonte","d":["Irpinia"]},{"n":"Le Masciare","s":"le-masciare","c":"Paternopoli","d":["Irpinia"]},{"n":"Macchie S Maria","s":"macchie-s-maria","c":"Montemiletto","d":["Irpinia"]},{"n":"Mastroberardino","s":"mastroberardino","c":"Atripalda","d":["Irpinia"]},{"n":"Montesole","s":"montesole","c":"Montefalcione","d":["Irpinia"]},{"n":"Ponterotto","s":"ponterotto","c":"Avellino","d":["Irpinia"]},{"n":"Quintodecimo","s":"quintodecimo","c":"Mirabella Eclano","d":["Irpinia"]},{"n":"Rocca del Principe","s":"rocca-del-principe","c":"Lapio","d":["Irpinia"]},{"n":"Santa Fosca","s":"santa-fosca","c":"Venticano","d":["Irpinia"]},{"n":"Sella delle Spine","s":"sella-delle-spine","c":"Taurasi","d":["Irpinia"]},{"n":"Sertura","s":"sertura","c":"Avellino","d":["Irpinia"]},{"n":"Tenuta de Gregorio","s":"tenuta-de-gregorio","c":"Taurasi","d":["Irpinia"]},{"n":"Tenute Casoli","s":"tenute-casoli","c":"Candida","d":["Irpinia"]},{"n":"Terre d'Aione","s":"terre-d-aione","c":"Tufo","d":["Irpinia"]},{"n":"Terre di Valter","s":"terre-di-valter","c":"Torre Le Nocelle","d":["Irpinia"]},{"n":"Terre Irpine","s":"terre-irpine","c":"Sturno","d":["Irpinia"]},{"n":"Torrevigne","s":"torrevigne","c":"Montefalcione","d":["Irpinia"]},{"n":"Tralci Hirpini","s":"tralci-hirpini","c":"San Michele di Serino","d":["Irpinia"]},{"n":"Villa Diamante","s":"villa-diamante","c":"Montefalcione","d":["Irpinia"]},{"n":"Vini Benelli","s":"vini-benelli","c":"Sturno","d":["Irpinia"]},{"n":"Vitagliano","s":"vitagliano","c":"San Martino Valle Caudina","d":["Irpinia"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
