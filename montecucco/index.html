<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Montecucco — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Montecucco</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Montecucco</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Albaluce","s":"albaluce","c":"Campagnatico","d":["Montecucco"]},{"n":"Amantis","s":"amantis","c":"Castel del Piano","d":["Montecucco"]},{"n":"Amiata","s":"amiata","c":"Castel del Piano","d":["Montecucco","Montecucco Sangiovese"]},{"n":"Assolati (Podere Assolati)","s":"assolati","c":"Castel del Piano","d":["Montecucco","Montecucco Sangiovese"]},{"n":"Basile","s":"basile","c":"Cinigiano","d":["Montecucco Sangiovese"]},{"n":"Basile - Az.Ienda Agricola Biologica","s":"basile-az-ienda-agricola-biologica","c":"Cinigiano","d":["Montecucco"]},{"n":"Begnardi – Sapori di Monteantico","s":"begnardi","c":"Civitella Paganico","d":["Montecucco","Montecucco Sangiovese"]},{"n":"BERRETTA di Curzio Renaioli","s":"berretta-di-curzio-renaioli","c":"Cinigiano","d":["Montecucco"]},{"n":"Campinuovi","s":"campinuovi","c":"Cinigiano","d":["Montecucco","Montecucco Sangiovese"]},{"n":"Casale Pozzuolo","s":"casale-pozzuolo","c":"Cinigiano","d":["Montecucco"]},{"n":"Castello ColleMassari","s":"castello-collemassari","c":"Cinigiano","d":["Montecucco"]},{"n":"Castello di Potentino","s":"castello-di-potentino","c":"Seggiano","d":["Montecucco"]},{"n":"Civettaio","s":"civettaio","c":"Civitella Paganico","d":["Montecucco"]},{"n":"De Vinosalvo Vignaioli","s":"de-vinosalvo-vignaioli","c":"Cinigiano","d":["Montecucco"]},{"n":"Fabiani","s":"fabiani","c":"Cinigiano","d":["Montecucco"]},{"n":"La Banditaccia","s":"la-banditaccia","c":"Cinigiano","d":["Montecucco Sangiovese"]},{"n":"Le Pianore","s":"le-pianore","c":"Grosseto","d":["Montecucco"]},{"n":"Maciarine","s":"maciarine","c":"Seggiano","d":["Montecucco"]},{"n":"Montenero","s":"montenero","c":"Castel del Piano","d":["Montecucco","Montecucco Sangiovese"]},{"n":"Montesalario","s":"montesalario","c":"Castel del Piano","d":["Montecucco","Montecucco Sangiovese"]},{"n":"Muschi Alti","s":"muschi-alti","c":"Campagnatico","d":["Montecucco"]},{"n":"Orciaverde","s":"orciaverde","c":"Castel del Piano","d":["Montecucco Sangiovese"]},{"n":"Parmoleto","s":"parmoleto","c":"Castel del Piano","d":["Montecucco","Montecucco Sangiovese"]},{"n":"Perazzeta","s":"perazzeta","c":"Castel del Piano","d":["Montecucco"]},{"n":"Peteglia","s":"peteglia","c":"Castel del Piano","d":["Montecucco"]},{"n":"Pianirossi","s":"pianirossi","c":"Cinigiano","d":["Montecucco"]},{"n":"Pierini e Brugi","s":"pierini-e-brugi","c":"Campagnatico","d":["Montecucco"]},{"n":"Podere Montale","s":"podere-montale","c":"Seggiano","d":["Montecucco"]},{"n":"Poggio L'Apparita","s":"poggio-lapparita","c":"Civitella Paganico","d":["Montecucco"]},{"n":"Poggio Mandorlo","s":"poggio-mandorlo","c":"Seggiano","d":["Montecucco","Montecucco Sangiovese"]},{"n":"Poggio Stenti","s":"poggio-stenti","c":"Castel del Piano","d":["Montecucco","Montecucco Sangiovese"]},{"n":"Poggio Trevvalle","s":"poggio-trevvalle","c":"","d":["Montecucco"]},{"n":"Prato Al Pozzo","s":"prato-al-pozzo","c":"Cinigiano","d":["Montecucco"]},{"n":"Ribusieri","s":"ribusieri","c":"Cinigiano","d":["Montecucco"]},{"n":"Salustri (Tenuta Salustri)","s":"salustri","c":"Cinigiano","d":["Montecucco","Montecucco Sangiovese"]},{"n":"Tenuta L'Impostino","s":"tenuta-limpostino","c":"Grosseto","d":["Montecucco"]},{"n":"Tenute Bruni","s":"tenute-bruni","c":"Grosseto","d":["Montecucco"]},{"n":"Vegni Medaglini Giannetti","s":"vegni-medaglini-giannetti","c":"Cinigiano","d":["Montecucco"]},{"n":"Vignacci","s":"vignacci","c":"Castel del Piano","d":["Montecucco"]},{"n":"Villa Patrizia","s":"villa-patrizia","c":"Roccalbegna","d":["Montecucco"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
