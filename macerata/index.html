<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Macerata, Serrapetrona e Colli Maceratesi — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Macerata, Serrapetrona e Colli Maceratesi</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Macerata, Serrapetrona e Colli Maceratesi</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Boccadigabbia","s":"boccadigabbia","c":"Civitanova Marche","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"Cantina Fattoria Duri","s":"cantina-fattoria-duri","c":"San Severino Marche","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"Cantina Santori","s":"cantina-santori","c":"Corridonia","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"Capinera","s":"capinera","c":"Morrovalle","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"Colleluce","s":"colleluce","c":"Serrapetrona","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"Collemara","s":"collemara","c":"Monte San Giusto","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"Conti Degli Azzoni","s":"conti-degli-azzoni","c":"Montefano","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"Conti Leopardi di San Leopardo","s":"conti-leopardi-di-san-leopardo","c":"Recanati","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"Fattoria Nannì","s":"fattoria-nanni","c":"Apiro","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"Fontezoppa","s":"fontezoppa","c":"Civitanova Marche","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"I Tre Filari","s":"i-tre-filari","c":"Recanati","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"Il Pollenza","s":"il-pollenza","c":"Tolentino","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"La Quercia Scarlatta","s":"la-quercia-scarlatta","c":"Monte San Giusto","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"Mochi","s":"mochi","c":"Corridonia","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"Muròla","s":"murola","c":"Urbisaglia","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"Podere Sul Lago","s":"podere-sul-lago","c":"Serrapetrona","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"Santa Cassella","s":"santa-cassella","c":"Potenza Picena","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"Saputi","s":"saputi","c":"Colmurano","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"Tenuta di Tavignano","s":"tenuta-di-tavignano","c":"Cingoli","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"Terre di San Ginesio","s":"terre-di-san-ginesio","c":"Ripe San Ginesio","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"Terre di Serrapetrona","s":"terre-di-serrapetrona","c":"Serrapetrona","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"VerSer","s":"verser","c":"Serrapetrona","d":["Macerata, Serrapetrona e Colli Maceratesi"]},{"n":"Villa Lazzarini","s":"villa-lazzarini","c":"Treia","d":["Macerata, Serrapetrona e Colli Maceratesi"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
