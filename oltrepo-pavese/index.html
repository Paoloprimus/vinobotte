<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Oltrepò Pavese — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Oltrepò Pavese</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Oltrepò Pavese</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Alziati Annibale","s":"alziati-annibale","c":"Rovescala","d":["Oltrepò Pavese"]},{"n":"Ca' del Gè","s":"ca-del-ge","c":"Montalto Pavese","d":["Buttafuoco","Sangue di Giuda"]},{"n":"Cantina Scuropasso","s":"cantina-scuropasso","c":"Pietra dè Giorgi","d":["Buttafuoco Storico"]},{"n":"Cantine Cavallotti","s":"cantine-cavallotti","c":"Cigognola","d":["Buttafuoco","Cruasè","Oltrepò Pavese","Oltrepò Pavese Metodo Classico"]},{"n":"Casarini Valentino e Rosanna","s":"casarini-valentino-e-rosanna","c":"Broni","d":["Buttafuoco","Oltrepò Pavese"]},{"n":"Castello di Cigognola","s":"castello-di-cigognola","c":"Cigognola","d":["Oltrepò Pavese"]},{"n":"Cavallini 1919","s":"cavallini-1919","c":"Corvino San Quirico","d":["Oltrepò Pavese"]},{"n":"Conte Vistarino","s":"conte-vistarino","c":"Rocca De' Giorgi","d":["Cruasè","Oltrepò Pavese","Oltrepò Pavese Metodo Classico","Pinot Nero dell’Oltrepò","Sangue di Giuda"]},{"n":"Cordero","s":"cordero","c":"Santa Giuletta","d":["Oltrepò Pavese"]},{"n":"Corte Fabbri","s":"corte-fabbri","c":"Broni","d":["Buttafuoco","Oltrepò Pavese","Oltrepò Pavese Metodo Classico"]},{"n":"Crosio Angelo","s":"crosio-angelo","c":"Stradella","d":["Buttafuoco","Sangue di Giuda"]},{"n":"Dal Verme (Torre degli Alberi)","s":"dal-verme-torre-degli-alberi","c":"Colli Verdi","d":["Cruasè","Oltrepò Pavese","Oltrepò Pavese Metodo Classico"]},{"n":"Doria","s":"doria","c":"Montalto Pavese","d":["Oltrepò Pavese"]},{"n":"Fattoria Fratelli Massara","s":"fattoria-fratelli-massara","c":"Redavalle","d":["Sangue di Giuda"]},{"n":"La Travaglina","s":"la-travaglina","c":"Santa Giuletta","d":["Oltrepò Pavese","Pinot Nero dell’Oltrepò"]},{"n":"Malpaga","s":"malpaga","c":"Canneto Pavese","d":["Buttafuoco","Oltrepò Pavese","Oltrepò Pavese Metodo Classico"]},{"n":"Monterucco","s":"monterucco","c":"Cigognola","d":["Buttafuoco","Oltrepò Pavese","Sangue di Giuda"]},{"n":"Picchioni Andrea","s":"picchioni-andrea","c":"Canneto Pavese","d":["Buttafuoco","Sangue di Giuda"]},{"n":"Piccolo Bacco dei Quaroni","s":"piccolo-bacco-dei-quaroni","c":"Montù Beccaria","d":["Buttafuoco Storico","Oltrepò Pavese"]},{"n":"Quaquarini Francesco","s":"quaquarini-francesco","c":"Canneto Pavese","d":["Buttafuoco Storico","Oltrepò Pavese","Sangue di Giuda"]},{"n":"Roveda Ernestino","s":"roveda-ernestino","c":"Montù Beccaria","d":["Oltrepò Pavese"]},{"n":"Ruinello","s":"ruinello","c":"Santa Maria della Versa","d":["Buttafuoco","Sangue di Giuda"]},{"n":"Sabaghina","s":"sabaghina","c":"Montalto Pavese","d":["Buttafuoco","Oltrepò Pavese","Sangue di Giuda"]},{"n":"Sartieri 1931","s":"sartieri-1931","c":"Casteggio","d":["Oltrepò Pavese","Oltrepò Pavese Metodo Classico"]},{"n":"Sclavi Davide","s":"sclavi-davide","c":"Montescano","d":["Buttafuoco","Oltrepò Pavese"]},{"n":"Tenuta Isimbarda","s":"tenuta-isimbarda","c":"Santa Giuletta","d":["Cruasè"]},{"n":"Tenuta La Costa","s":"tenuta-la-costa","c":"Castana","d":["Buttafuoco Storico","Oltrepò Pavese","Oltrepò Pavese Metodo Classico","Sangue di Giuda"]},{"n":"Tenuta Percivalle","s":"tenuta-percivalle","c":"Borgo Priolo","d":["Oltrepò Pavese","Pinot Nero dell’Oltrepò"]},{"n":"Tenuta Travaglino","s":"tenuta-travaglino","c":"Calvignano","d":["Pinot Nero dell’Oltrepò"]},{"n":"Torrevilla Viticoltori Associati","s":"torrevilla-viticoltori-associati","c":"Torrazza Coste","d":["Sangue di Giuda"]},{"n":"Vanzini","s":"vanzini","c":"San Damiano Al Colle","d":["Oltrepò Pavese","Sangue di Giuda"]},{"n":"Verdi Paolo","s":"verdi-paolo","c":"Canneto Pavese","d":["Buttafuoco","Oltrepò Pavese","Sangue di Giuda"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
