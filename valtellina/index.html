<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Valtellina — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Valtellina</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Valtellina</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Agrilu","s":"agrilu","c":"Poggiridenti","d":["Valtellina"]},{"n":"Alberto Marsetti","s":"alberto-marsetti","c":"Sondrio","d":["Valtellina"]},{"n":"Aldo Rainoldi","s":"aldo-rainoldi","c":"Chiuro","d":["Valtellina"]},{"n":"Alessio Magi","s":"alessio-magi","c":"Teglio","d":["Valtellina"]},{"n":"Alfio Mozzi","s":"alfio-mozzi","c":"Castione Andevenno","d":["Valtellina"]},{"n":"Andreoli","s":"andreoli","c":"Berbenno di Valtellina","d":["Valtellina"]},{"n":"Arpepe","s":"arpepe","c":"Sondrio","d":["Valtellina"]},{"n":"Ascesa","s":"ascesa","c":"Tresivio","d":["Valtellina"]},{"n":"Assoviuno","s":"assoviuno","c":"Berbenno","d":["Valtellina"]},{"n":"Balgera Vini","s":"balgera-vini","c":"Chiuro","d":["Valtellina"]},{"n":"BastiànCuntràri","s":"bastiancuntrari","c":"Albosaggia","d":["Valtellina"]},{"n":"Bruno Leusciatti","s":"bruno-leusciatti","c":"Sondrio","d":["Valtellina"]},{"n":"Cantina Riter","s":"cantina-riter","c":"Poggiridenti","d":["Valtellina"]},{"n":"Contadi Gasparotti","s":"contadi-gasparotti","c":"Tirano","d":["Valtellina"]},{"n":"Conti Sertoli Salis","s":"conti-sertoli-salis","c":"Tirano","d":["Valtellina"]},{"n":"Coop. Agricola Triasso e Sassella","s":"coop-agricola-triasso-e-sassella","c":"Sondrio","d":["Valtellina"]},{"n":"Dirupi","s":"dirupi","c":"Ponte in Valtellina","d":["Valtellina"]},{"n":"F.lli Bettini","s":"f-lli-bettini","c":"S. Giacomo di","d":["Valtellina"]},{"n":"Folini","s":"folini","c":"Chiuro","d":["Valtellina"]},{"n":"Fondazione Fojanini","s":"fondazione-fojanini","c":"Sondrio","d":["Valtellina"]},{"n":"Fratelli Cerasa - Le Case dei Baff","s":"fratelli-cerasa-le-case-dei-baff","c":"Ardenno","d":["Valtellina"]},{"n":"I Muretti","s":"i-muretti","c":"Rovagnate","d":["Valtellina"]},{"n":"Involt Agnelot","s":"involt-agnelot","c":"Villa di","d":["Valtellina"]},{"n":"La Trama","s":"la-trama","c":"Tresivio","d":["Valtellina"]},{"n":"Le Strie","s":"le-strie","c":"Ponte in Valtellina","d":["Valtellina"]},{"n":"Luca Faccinelli","s":"luca-faccinelli","c":"Chiuro","d":["Valtellina"]},{"n":"Mamete Prevostini / Convento San Lorenzo","s":"mamete-prevostini-convento-san-lorenzo","c":"Mese","d":["Valtellina"]},{"n":"Marcel Zanolari","s":"marcel-zanolari","c":"Bianzone","d":["Valtellina"]},{"n":"Marco Ferrari","s":"marco-ferrari","c":"Montagna in Valtellina","d":["Valtellina"]},{"n":"Marino Lanzini","s":"marino-lanzini","c":"Ponte in Valtellina","d":["Valtellina"]},{"n":"Nicola Nobili","s":"nicola-nobili","c":"Poggiridenti","d":["Valtellina"]},{"n":"Nino Negri","s":"nino-negri","c":"Chiuro","d":["Valtellina"]},{"n":"Pizzo Coca","s":"pizzo-coca","c":"Ponte in Valtellina","d":["Valtellina"]},{"n":"Plozza","s":"plozza","c":"Tirano","d":["Valtellina"]},{"n":"Radìs","s":"radis","c":"Tirano","d":["Valtellina"]},{"n":"Renato Motalli","s":"renato-motalli","c":"S. Giacomo di","d":["Valtellina"]},{"n":"Retica Vini","s":"retica-vini","c":"Sondrio","d":["Valtellina"]},{"n":"Rivetti & L'Orco","s":"rivetti-l-orco","c":"Villa di","d":["Valtellina"]},{"n":"Sandro Fay","s":"sandro-fay","c":"S. Giacomo di","d":["Valtellina"]},{"n":"Sesterzio","s":"sesterzio","c":"Berbenno di Valtellina","d":["Valtellina"]},{"n":"Tenuta Scerscé","s":"tenuta-scersce","c":"Tirano","d":["Valtellina"]},{"n":"Vita Nova","s":"vita-nova","c":"Berbenno di Valtellina","d":["Valtellina"]},{"n":"Walter Menegola","s":"walter-menegola","c":"Castione Andevenno","d":["Valtellina"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
