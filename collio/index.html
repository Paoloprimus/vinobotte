<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Collio — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Collio</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Collio</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Anzelin","s":"anzelin","c":"Cormons","d":["Collio"]},{"n":"Ascevi Luwa","s":"ascevi-luwa","c":"San Floriano del Collio","d":["Collio"]},{"n":"Attems","s":"attems","c":"Capriva del Friuli","d":["Collio"]},{"n":"Azienda Agricola Sgubin Renzo","s":"azienda-agricola-sgubin-renzo","c":"Cormons","d":["Collio"]},{"n":"Azienda Agricola Silvano Ferlat","s":"azienda-agricola-silvano-ferlat","c":"Cormons","d":["Collio"]},{"n":"Battistutta","s":"battistutta","c":"Cormons","d":["Collio"]},{"n":"Blazic","s":"blazic","c":"Cormons","d":["Collio"]},{"n":"Bolzicco","s":"bolzicco","c":"Cormons","d":["Collio"]},{"n":"Borgo del Tiglio","s":"borgo-del-tiglio","c":"Cormons","d":["Collio"]},{"n":"Borgo Savaian","s":"borgo-savaian","c":"Cormons","d":["Collio"]},{"n":"Bortoluzzi Borgo Tintor","s":"bortoluzzi-borgo-tintor","c":"Gradisca D'Isonzo","d":["Collio"]},{"n":"BRACCO","s":"bracco","c":"Cormons","d":["Collio"]},{"n":"Branko Wines","s":"branko-wines","c":"Cormons","d":["Collio"]},{"n":"Bressan Wines","s":"bressan-wines","c":"Farra d'Isonzo","d":["Collio"]},{"n":"Budignac","s":"budignac","c":"Capriva del Friuli","d":["Collio"]},{"n":"Buzzinelli","s":"buzzinelli","c":"Cormons","d":["Collio"]},{"n":"Cadibon","s":"cadibon","c":"Corno di Rosazzo","d":["Collio"]},{"n":"Cantina Produttori Cormons","s":"cantina-produttori-cormons","c":"Cormons","d":["Collio"]},{"n":"Carlo di Pradis","s":"carlo-di-pradis","c":"Cormons","d":["Collio"]},{"n":"Casa delle Rose","s":"casa-delle-rose","c":"Dolegna del Collio","d":["Collio"]},{"n":"Castel San Mauro","s":"castel-san-mauro","c":"Gorizia","d":["Collio"]},{"n":"Castello di Spessa","s":"castello-di-spessa","c":"Capriva del Friuli","d":["Collio"]},{"n":"Ca’Ronesca","s":"caronesca","c":"Dolegna del Collio","d":["Collio"]},{"n":"Cociancig","s":"cociancig","c":"Cormons","d":["Collio"]},{"n":"Codelli","s":"codelli","c":"Cormons","d":["Collio"]},{"n":"Collavini","s":"collavini","c":"Corno di Rosazzo","d":["Collio"]},{"n":"Colle Duga","s":"colle Cormons","d":["Collio"]},{"n":"Kurtin","s":"kurtin","c":"Cormons","d":["Collio"]},{"n":"La Bella Notte","s":"la-bella-notte","c":"Farra d'Isonzo","d":["Collio"]},{"n":"La Castellada","s":"la-castellada","c":"Gorizia","d":["Collio"]},{"n":"La Ginestra","s":"la-ginestra","c":"Mossa","d":["Collio"]},{"n":"La Rajade","s":"la-rajade","c":"Dolegna del Collio","d":["Collio"]},{"n":"Livio Felluga","s":"livio-felluga","c":"Cormons","d":["Collio"]},{"n":"Livon","s":"livon","c":"San Giovanni al Natisone","d":["Collio"]},{"n":"Magnàs","s":"magnas","c":"Cormons","d":["Collio"]},{"n":"Mania’","s":"mania","c":"San Floriano del Collio","d":["Collio"]},{"n":"Marco Felluga","s":"marco-felluga","c":"Gradisca d'Isonzo","d":["Collio"]},{"n":"Marcuzzi Viticola","s":"marcuzzi-viticola","c":"San Floriano del Collio","d":["Collio"]},{"n":"martissima wine farm","s":"martissima-wine-farm","c":"Cormons","d":["Collio"]},{"n":"Muzic","s":"muzic","c":"San Floriano del Collio","d":["Collio"]},{"n":"Norina Pez","s":"norina-pez","c":"Dolegna del Collio","d":["Collio"]},{"n":"Orzan","s":"orzan","c":"Capriva del Friuli","d":["Collio"]},{"n":"Paolo Caccese","s":"paolo-caccese","c":"Cormons","d":["Collio"]},{"n":"Paraschos","s":"paraschos","c":"San Floriano del Collio","d":["Collio"]},{"n":"Pascolo Alessandro","s":"pascolo-alessandro","c":"Dolegna del Collio","d":["Collio"]},{"n":"Picéch","s":"picech","c":"Cormons","d":["Collio"]},{"n":"Pighin","s":"pighin","c":"Pavia di Udine","d":["Collio"]},{"n":"Pizzutti","s":"pizzutti","c":"Dolegna del Collio","d":["Collio"]},{"n":"Podversic Damijan","s":"podversic-damijan","c":"Gorizia","d":["Collio"]},{"n":"Polencic Isidoro","s":"polencic-isidoro","c":"Cormons","d":["Collio"]},{"n":"Polje","s":"polje","c":"Cormons","d":["Collio"]},{"n":"Primosic","s":"primosic","c":"Gorizia","d":["Collio"]},{"n":"Raccaro","s":"raccaro","c":"Cormons","d":["Collio"]},{"n":"Radikon","s":"radikon","c":"Gorizia","d":["Collio"]},{"n":"Reguta","s":"reguta","c":"Pocenia","d":["Collio"]},{"n":"Renato Keber","s":"renato-keber","c":"Cormons","d":["Collio"]},{"n":"Riz","s":"riz","c":"Cormons","d":["Collio"]},{"n":"Ronchi Rò","s":"ronchi-ro","c":"Dolegna del Collio","d":["Collio"]},{"n":"Ronco Blanchis","s":"ronco-blanchis","c":"Mossa","d":["Collio"]},{"n":"Ronco dei Tassi","s":"ronco-dei-tassi","c":"Cormons","d":["Collio"]},{"n":"Ronco Scagnet","s":"ronco-scagnet","c":"Dolegna del Collio","d":["Collio"]},{"n":"Roncus","s":"roncus","c":"Cormons","d":["Collio"]},{"n":"Russian","s":"russian","c":"Cormons","d":["Collio"]},{"n":"Russiz Superiore","s":"russiz-superiore","c":"Capriva del Friuli","d":["Collio"]},{"n":"Schiopetto","s":"schiopetto","c":"Capriva del Friuli","d":["Collio"]},{"n":"Scolaris","s":"scolaris","c":"San Lorenzo Isontino","d":["Collio"]},{"n":"Skok","s":"skok","c":"San Floriano del Collio","d":["Collio"]},{"n":"Sosol","s":"sosol","c":"Gorizia","d":["Collio"]},{"n":"Sturm","s":"sturm","c":"Cormons","d":["Collio"]},{"n":"Subida di Monte","s":"subida-di-monte","c":"Cormons","d":["Collio"]},{"n":"Tenuta Baroni del Mestri","s":"tenuta-baroni-del-mestri","c":"Cormons","d":["Collio"]},{"n":"Tenuta Borgo Conventi","s":"tenuta-borgo-conventi","c":"Farra d'Isonzo","d":["Collio"]},{"n":"Tenuta Della Casa","s":"tenuta-della-casa","c":"Cormons","d":["Collio"]},{"n":"Tenuta di Angoris","s":"tenuta-di-angoris","c":"Cormons","d":["Collio"]},{"n":"Tenuta La Ponca","s":"tenuta-la-ponca","c":"Dolegna del Collio","d":["Collio"]},{"n":"Tenuta Sant’Helena","s":"tenuta-santhelena","c":"Dolegna del Collio","d":["Collio"]},{"n":"Tenuta Stella","s":"tenuta-stella","c":"Dolegna del Collio","d":["Collio"]},{"n":"Tenuta Villanova","s":"tenuta-villanova","c":"Farra d'Isonzo","d":["Collio"]},{"n":"Tercic","s":"tercic","c":"San Floriano del Collio","d":["Collio"]},{"n":"Terre del Faet","s":"terre-del-faet","c":"Cormons","d":["Collio"]},{"n":"Tiare","s":"tiare","c":"Dolegna del Collio","d":["Collio"]},{"n":"Tonut","s":"tonut","c":"Cormons","d":["Collio"]},{"n":"Venica di Venica Giovanni","s":"venica-di-venica-giovanni","c":"Prepotto","d":["Collio"]},{"n":"Vidussi","s":"vidussi","c":"Capriva del Friuli","d":["Collio"]},{"n":"Villa Russiz","s":"villa-russiz","c":"Capriva del Friuli","d":["Collio"]},{"n":"Villa Vasi","s":"villa-vasi","c":"Gorizia","d":["Collio"]},{"n":"Vini Kitzmüller","s":"vini-kitzmuller","c":"Cormons","d":["Collio"]},{"n":"Vini Manzocco","s":"vini-manzocco","c":"Cormons","d":["Collio"]},{"n":"Vini Toros","s":"vini-toros","c":"Cormons","d":["Collio"]},{"n":"Visintini","s":"visintini","c":"Corno di Rosazzo","d":["Collio"]},{"n":"Vosca","s":"vosca","c":"Cormons","d":["Collio"]},{"n":"Zorutti","s":"zorutti","c":"Dolegna del Collio","d":["Collio"]},{"n":"Zorzon","s":"zorzon","c":"Cormons","d":["Collio"]},{"n":"Zuani","s":"zuani","c":"San Floriano del Collio","d":["Collio"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
