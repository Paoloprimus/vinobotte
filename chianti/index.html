<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Chianti — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Chianti</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Chianti</option><option>Chianti Superiore</option><option>Chianti Rufina</option><option>Chianti Colli Fiorentini</option><option>Chianti Colline Pisane</option><option>Chianti Montalbano</option><option>Vin Santo del Chianti</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Aglioni","s":"aglioni","c":"San Miniato","d":["Chianti"]},{"n":"Badia di Morrona","s":"badia-di-morrona","c":"Terricciola","d":["Chianti","Vin Santo del Chianti"]},{"n":"Borgo Divino","s":"borgo-divino","c":"Montespertoli","d":["Chianti"]},{"n":"Borgo Macereto","s":"borgo-macereto","c":"Dicomano","d":["Chianti Rufina"]},{"n":"Buccia Nera","s":"buccia-nera","c":"Arezzo","d":["Chianti"]},{"n":"Camperchi","s":"camperchi","c":"Civitella in Val di Chiana","d":["Chianti"]},{"n":"Cantina delle Colline Pisane","s":"cantina-delle-colline-pisane","c":"","d":["Chianti Colline Pisane"]},{"n":"Cantine Leonardo da Vinci","s":"cantine-leonardo-da-vinci","c":"Vinci","d":["Chianti"]},{"n":"Cantine Terredagoli","s":"cantine-terredagoli","c":"Laterina Pergine Valdarno","d":["Chianti"]},{"n":"Casalvento","s":"casalvento","c":"Cerreto Guidi","d":["Chianti"]},{"n":"Castello del Trebbio","s":"castello-del-trebbio","c":"Pontassieve","d":["Chianti"]},{"n":"Castello Sonnino","s":"castello-sonnino","c":"Montespertoli","d":["Chianti"]},{"n":"Cecconi","s":"cecconi","c":"Montespertoli","d":["Chianti"]},{"n":"Cei Fratelli","s":"cei-fratelli","c":"","d":["Chianti"]},{"n":"Colognole","s":"colognole","c":"Rufina","d":["Chianti Rufina"]},{"n":"Conte di Castignano","s":"conte-di-castignano","c":"Barberino Tavarnelle","d":["Chianti"]},{"n":"Conte Guicciardini","s":"conte-guicciardini","c":"","d":["Chianti"]},{"n":"Corbucci","s":"corbucci","c":"San Gimignano","d":["Chianti"]},{"n":"Dreolino","s":"dreolino","c":"Rufina","d":["Chianti","Chianti Rufina"]},{"n":"Fattoria Bacìo","s":"fattoria-bacio","c":"Certaldo","d":["Chianti"]},{"n":"Fattoria Bibbiani","s":"fattoria-bibbiani","c":"","d":["Chianti"]},{"n":"Fattoria Bini","s":"fattoria-bini","c":"","d":["Chianti"]},{"n":"Fattoria Corzano Paterno","s":"fattoria-corzano-paterno","c":"San Casciano in Val di Pesa","d":["Chianti"]},{"n":"Fattoria del Cantuccio","s":"fattoria-del-cantuccio","c":"","d":["Chianti"]},{"n":"Fattoria di Bagnolo Bart Parri","s":"fattorie-parri","c":"Montespertoli","d":["Chianti"]},{"n":"Galasso Antonio","s":"galasso-antonio","c":"","d":["Chianti"]},{"n":"I Balzini","s":"i-balzini","c":"","d":["Chianti"]},{"n":"I Selvatici","s":"i-selvatici","c":"Montevarchi","d":["Chianti"]},{"n":"Il Calamaio","s":"il-calamaio","c":"Lucca","d":["Chianti"]},{"n":"Il Casariccio","s":"il-casariccio","c":"Bucine","d":["Chianti"]},{"n":"Il Lago","s":"il-lago","c":"Dicomano","d":["Chianti"]},{"n":"Il Sosso","s":"il-sosso","c":"Sinalunga","d":["Chianti","Vin Santo del Chianti"]},{"n":"Inalbi","s":"inalbi","c":"Impruneta","d":["Chianti"]},{"n":"La Guardiola","s":"la-guardiola","c":"","d":["Chianti"]},{"n":"La Piana","s":"la-piana","c":"Palaia","d":["Chianti Superiore","Vin Santo del Chianti"]},{"n":"La Tancia","s":"la-tancia","c":"Barberino Tavarnelle","d":["Chianti","Vin Santo del Chianti"]},{"n":"Le Coste","s":"le-coste","c":"Rufina","d":["Chianti","Chianti Rufina","Vin Santo del Chianti"]},{"n":"Le Fonti a San Giorgio","s":"le-fonti-a-san-giorgio","c":"Montespertoli","d":["Chianti"]},{"n":"Le Torri","s":"le-torri","c":"","d":["Chianti"]},{"n":"Marzocchi","s":"marzocchi","c":"","d":["Chianti"]},{"n":"Montaioncino","s":"montaioncino","c":"Empoli","d":["Chianti"]},{"n":"MonteRosola","s":"monterosola","c":"","d":["Chianti"]},{"n":"Palagetto","s":"palagetto","c":"San Gimignano","d":["Chianti"]},{"n":"Palazzo Massaini","s":"palazzo-massaini","c":"Pienza","d":["Chianti","Vin Santo del Chianti"]},{"n":"Pasqualetti Viticoltori","s":"pasqualetti-viticoltori","c":"Peccioli","d":["Chianti"]},{"n":"Piandaccoli","s":"piandaccoli","c":"Calenzano","d":["Chianti","Vin Santo del Chianti"]},{"n":"Pietro Beconcini","s":"pietro-beconcini","c":"San Miniato","d":["Chianti","Vin Santo del Chianti"]},{"n":"Pieve di Spaltenna","s":"pieve-di-spaltenna","c":"Gaiole in Chianti","d":["Vin Santo del Chianti"]},{"n":"Pieve Vecchia","s":"pieve-vecchia","c":"Cerreto Guidi","d":["Chianti"]},{"n":"Podere dell'Anselmo","s":"podere-dell- ni Strozzi","s":"tenute-guicciardini-strozzi","c":"San Gimignano","d":["Chianti"]},{"n":"Terre del Bruno","s":"terre-del-bruno","c":"Certaldo","d":["Chianti"]},{"n":"Terre di Argillaia","s":"terre-di-argillaia","c":"Greve in Chianti","d":["Chianti"]},{"n":"Torre A Decima","s":"torre-a-decima","c":"Rignano sull'Arno","d":["Chianti"]},{"n":"Travignoli","s":"travignoli","c":"Pelago","d":["Chianti"]},{"n":"Trequanda","s":"trequanda","c":"Trequanda","d":["Chianti"]},{"n":"Tunia","s":"tunia","c":"Civitella in Val di Chiana","d":["Chianti"]},{"n":"Uggiano","s":"uggiano","c":"","d":["Chianti","Vin Santo del Chianti"]},{"n":"Villa Corliano","s":"villa-corliano","c":"Lastra A Signa","d":["Chianti"]},{"n":"Villa da Filicaja","s":"villa-da-filicaja","c":"","d":["Chianti"]},{"n":"Villa di Vetrice","s":"villa-di-vetrice","c":"Pontassieve","d":["Chianti"]},{"n":"Villa Pillo","s":"villa-pillo","c":"Gambassi Terme","d":["Chianti"]},{"n":"Villa Saletta","s":"villa-saletta","c":"","d":["Chianti"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
