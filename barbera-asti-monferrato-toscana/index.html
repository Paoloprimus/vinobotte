<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Barbera d’Asti e Monferrato — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Barbera d’Asti e Monferrato</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Barbera d’Asti e Monferrato</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Agricola Bes","s":"agricola-bes","c":"Vercelli","d":["Barbera d’Asti e Monferrato"]},{"n":"Bertolino","s":"bertolino","c":"Nizza Monferrato","d":["Barbera d’Asti e Monferrato"]},{"n":"Ca dei Boschi","s":"ca-dei-boschi","c":"San Marzano Oliveto","d":["Barbera d’Asti e Monferrato"]},{"n":"Cantina Graglia","s":"cantina-graglia","c":"Castelnuovo Don Bosco","d":["Barbera d’Asti e Monferrato"]},{"n":"Cantina Tre Castelli","s":"cantina-tre-castelli","c":"Montaldo Bormida","d":["Barbera d’Asti e Monferrato"]},{"n":"Cantina Zanello","s":"cantina-zanello","c":"Rosignano Monferrato","d":["Barbera d’Asti e Monferrato"]},{"n":"Casa lia Sole","s":"casa-lia-sole","c":"Visone Pro","d":["Barbera d’Asti e Monferrato"]},{"n":"Casalone","s":"casalone","c":"Lu e Cuccaro Monferrato","d":["Barbera d’Asti e Monferrato"]},{"n":"Cascina Coppa","s":"cascina-coppa","c":"Lu e Cuccaro Monferrato","d":["Barbera d’Asti e Monferrato"]},{"n":"Cascina Nuova","s":"cascina-nuova","c":"Valenza","d":["Barbera d’Asti e Monferrato"]},{"n":"Cascina Val Liberata","s":"cascina-val-liberata","c":"Villamiroglio","d":["Barbera d’Asti e Monferrato"]},{"n":"Castello di Uviglie","s":"castello-di-uviglie","c":"Rosignano Monferrato","d":["Barbera d’Asti e Monferrato"]},{"n":"Cave di Moleto","s":"cave-di-moleto","c":"Ottiglio","d":["Barbera d’Asti e Monferrato"]},{"n":"Everto","s":"everto","c":"Nizza Monferrato","d":["Barbera d’Asti e Monferrato"]},{"n":"Gatto Pierfrancesco","s":"gatto-pierfrancesco","c":"Castagnole Monferrato","d":["Barbera d’Asti e Monferrato"]},{"n":"I Vicini di Cesare","s":"i-vicini-di-cesare","c":"Castelnuovo Calcea","d":["Barbera d’Asti e Monferrato"]},{"n":"Iuli","s":"iuli","c":"Montaldo di Cerrina","d":["Barbera d’Asti e Monferrato"]},{"n":"La Tommasina","s":"la-tommasina","c":"Frassinello M.To","d":["Barbera d’Asti e Monferrato"]},{"n":"Lanze","s":"lanze","c":"Castagnole delle Lanze","d":["Barbera d’Asti e Monferrato"]},{"n":"Massimo Abbate","s":"massimo-abbate","c":"Castagnole Lanze","d":["Barbera d’Asti e Monferrato"]},{"n":"Monroè","s":"monroe","c":"Canale","d":["Barbera d’Asti e Monferrato"]},{"n":"Montefiorito","s":"montefiorito","c":"Asti","d":["Barbera d’Asti e Monferrato"]},{"n":"Morando Silvio","s":"morando-silvio","c":"Vignale Monferrato","d":["Barbera d’Asti e Monferrato"]},{"n":"Tenuta Foresto","s":"tenuta-foresto","c":"Nizza Monferrato","d":["Barbera d’Asti e Monferrato"]},{"n":"Tenuta IO","s":"tenuta-io","c":"Ponzano Monferrato","d":["Barbera d’Asti e Monferrato"]},{"n":"Tenuta Vallone","s":"tenuta-vallone","c":"Conzano","d":["Barbera d’Asti e Monferrato"]},{"n":"Uvamatris","s":"uvamatris","c":"Italy Inf","d":["Barbera d’Asti e Monferrato"]},{"n":"Vigneti Brichet","s":"vigneti-brichet","c":"Isola D'Asti","d":["Barbera d’Asti e Monferrato"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
