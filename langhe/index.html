<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Barolo, Barbaresco e Langhe — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Barolo, Barbaresco e Langhe</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Barolo, Barbaresco e Langhe</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Ada Nada","s":"ada-nada","c":"Treiso","d":["Barolo, Barbaresco e Langhe"]},{"n":"Agnelli Viassone","s":"agnelli-viassone","c":"Alba","d":["Barolo, Barbaresco e Langhe"]},{"n":"Agricola Paola Oberto","s":"agricola-paola-oberto","c":"Cherasco","d":["Barolo, Barbaresco e Langhe"]},{"n":"Alberto Ballarin","s":"alberto-ballarin","c":"La Morra","d":["Barolo, Barbaresco e Langhe"]},{"n":"Albino Rocca","s":"albino-rocca","c":"Barbaresco","d":["Barolo, Barbaresco e Langhe"]},{"n":"Altare","s":"altare","c":"Murazzano","d":["Barolo, Barbaresco e Langhe"]},{"n":"Angelo Pastura","s":"angelo-pastura","c":"Neive","d":["Barolo, Barbaresco e Langhe"]},{"n":"Antico Monastero","s":"antico-monastero","c":"Lu Monferrato","d":["Barolo, Barbaresco e Langhe"]},{"n":"Azelia","s":"azelia","c":"Castiglione Falletto","d":["Barolo, Barbaresco e Langhe"]},{"n":"Azienda Agricola Baldissero","s":"azienda-agricola-baldissero","c":"Treiso","d":["Barolo, Barbaresco e Langhe"]},{"n":"Azienda Agricola Ca'Mpian","s":"azienda-agricola-ca-mpian","c":"Castellinaldo D’Alba","d":["Barolo, Barbaresco e Langhe"]},{"n":"Azienda Agricola Pugnane","s":"azienda-agricola-pugnane","c":"Castiglione Falletto","d":["Barolo, Barbaresco e Langhe"]},{"n":"Brangero","s":"brangero","c":"Diano D’Alba","d":["Barolo, Barbaresco e Langhe"]},{"n":"Brezza","s":"brezza","c":"Barolo","d":["Barolo, Barbaresco e Langhe"]},{"n":"Bricco del Cucù","s":"bricco-del-cucu","c":"Bastia Mondovì","d":["Barolo, Barbaresco e Langhe"]},{"n":"Bricco Fiore","s":"bricco-fiore","c":"Briaglia","d":["Barolo, Barbaresco e Langhe"]},{"n":"Bruno Rocca","s":"bruno-rocca","c":"Barbaresco","d":["Barolo, Barbaresco e Langhe"]},{"n":"Ca'Barun","s":"ca-barun","c":"Santo Stefano Belbo","d":["Barolo, Barbaresco e Langhe"]},{"n":"Cagliero","s":"cagliero","c":"Barolo","d":["Barolo, Barbaresco e Langhe"]},{"n":"Cantina del Ciabot","s":"cantina-del-ciabot","c":"Farigliano","d":["Barolo, Barbaresco e Langhe"]},{"n":"Casa Baricalino","s":"casa-baricalino","c":"Novello","d":["Barolo, Barbaresco e Langhe"]},{"n":"Cascina Adelaide","s":"cascina-adelaide","c":"Barolo","d":["Barolo, Barbaresco e Langhe"]},{"n":"Cascina Fontanette","s":"cascina-fontanette","c":"Santo Stefano Belbo","d":["Barolo, Barbaresco e Langhe"]},{"n":"Cascina Ghercina","s":"cascina-ghercina","c":"Novello","d":["Barolo, Barbaresco e Langhe"]},{"n":"Cascina Luisin","s":"cascina-luisin","c":"Barbaresco","d":["Barolo, Barbaresco e Langhe"]},{"n":"Cascina Rovelli","s":"cascina-rovelli","c":"Cissone","d":["Barolo, Barbaresco e Langhe"]},{"n":"Cavo Valentino","s":"cavo-valentino","c":"Tortona","d":["Barolo, Barbaresco e Langhe"]},{"n":"Ca’ Boschi","s":"ca-boschi","c":"Mango","d":["Barolo, Barbaresco e Langhe"]},{"n":"Càdipò","s":"cadipo","c":"Cisterna D'Asti","d":["Barolo, Barbaresco e Langhe"]},{"n":"del Tufo","s":"del-tufo","c":"Dogliani","d":["Barolo, Barbaresco e Langhe"]},{"n":"Elvio Cogno","s":"elvio-cogno","c":"Novello","d":["Barolo, Barbaresco e Langhe"]},{"n":"F.lli Bianco","s":"f-lli-bianco","c":"Costigliole D'","d":["Barolo, Barbaresco e Langhe"]},{"n":"Fattoria San Giuliano","s":"fattoria-san-giuliano","c":"Neive","d":["Barolo, Barbaresco e Langhe"]},{"n":"Fortemasso","s":"fortemasso","c":"Monforte D’Alba","d":["Barolo, Barbaresco e Langhe"]},{"n":"Fratelli Aimasso","s":"fratelli-aimasso","c":"Diano D'Alba","d":["Barolo, Barbaresco e Langhe"]},{"n":"Fratelli Alessandria","s":"fratelli-alessandria","c":"Verduno","d":["Barolo, Barbaresco e Langhe"]},{"n":"Ghëddo","s":"gheddo","c":"La Morra","d":["Barolo, Barbaresco e Langhe"]},{"n":"Giacomo Grimaldi","s":"giacomo-grimaldi","c":"Barolo","d":["Barolo, Barbaresco e Langhe"]},{"n":"Gigi Rosso","s":"gigi-rosso","c":"Castiglione Falletto","d":["Barolo, Barbaresco e Langhe"]},{"n":"Gillardi","s":"gillardi","c":"Farigliano","d":["Barolo, Barbaresco e Langhe"]},{"n":"Gioso","s":"gioso","c":"Castiglione Falletto","d":["Barolo, Barbaresco e Langhe"]},{"n":"Giovanni Rosso","s":"giovanni-rosso","c":"Serralunga D'Alba","d":["Barolo, Barbaresco e Langhe"]},{"n":"Grasso Fratelli","s":"grasso-fratelli","c":"Treiso","d":["Barolo, Barbaresco e Langhe"]},{"n":"Hilberg-Pasquero","s":"hilberg-pasquero","c":"Priocca","d":["Barolo, Barbaresco e Langhe"]},{"n":"La Briccola","s":"la-briccola","c":"Diano D’Alba","d":["Barolo, Barbaresco e Langhe"]},{"n":"La Ca' Növa","s":"la-ca-nova","c":"Calosso","d":["Barolo, Barbaresco e Langhe"]},{"n":"La Roncaglia","s":"la-roncaglia","c":"Fraz","d":["Barolo, Barbaresco e Langhe"]},{"n":"Le Cecche","s":"le-cecche","c":"Diano D’Alba","d":["Barolo, Barbaresco e Langhe"]},{"n":"Luigi Baudana","s":"luigi-baudana","c":"Barolo","d":["Barolo, Barbaresco e Langhe"]},{"n":"Margherita Otto","s":"margherita-otto","c":"Monforte D’Alba","d":["Barolo, Barbaresco e Langhe"]},{"n":"Montemiglietto","s":"montemiglietto","c":"Verduno","d":["Barolo, Barbaresco e Langhe"]},{"n":"Morra Gabriele","s":"morra-gabriele","c":"Alba","d":["Barolo, Barbaresco e Langhe"]},{"n":"Morra Stefanino","s":"morra-stefanino","c":"Castellinaldo D’Alba","d":["Barolo, Barbaresco e Langhe"]},{"n":"Mossio","s":"mossio","c":"Rodello","d":["Barolo, Barbaresco e Langhe"]},{"n":"Olivero Mario","s":"olivero-mario","c":"Roddi","d":["Barolo, Barbaresco e Langhe"]},{"n":"Paola Massa","s":"paola-massa","c":"Piobesi D’Alba","d":["Barolo, Barbaresco e Langhe"]},{"n":"Pier","s":"pier","c":"Treiso","d":["Barolo, Barbaresco e Langhe"]},{"n":"Piercarlo Culasso","s":"piercarlo-culasso","c":"Barbaresco","d":["Barolo, Barbaresco e Langhe"]},{"n":"Pittatore","s":"pittatore","c":"Barolo","d":["Barolo, Barbaresco e Langhe"]},{"n":"Poderi Moretti","s":"poderi-moretti","c":"Monteu Roero","d":["Barolo, Barbaresco e Langhe"]},{"n":"Produttori del Barbaresco","s":"produttori-del-barbaresco","c":"Barbaresco","d":["Barolo, Barbaresco e Langhe"]},{"n":"Rivetti Gino","s":"rivetti-gino","c":"Alba","d":["Barolo, Barbaresco e Langhe"]},{"n":"Rivetto","s":"rivetto","c":"Serralunga D'Alba","d":["Barolo, Barbaresco e Langhe"]},{"n":"Rocche Costamagna","s":"rocche-costamagna","c":"La Morra","d":["Barolo, Barbaresco e Langhe"]},{"n":"Schiavenza","s":"schiavenza","c":"Serralunga D’Alba","d":["Barolo, Barbaresco e Langhe"]},{"n":"Sylla Sebaste","s":"sylla-sebaste","c":"Barolo","d":["Barolo, Barbaresco e Langhe"]},{"n":"Tenuta Cucco","s":"tenuta-cucco","c":"Serralunga D’Alba","d":["Barolo, Barbaresco e Langhe"]},{"n":"Teo Costa","s":"teo-costa","c":"Castellinaldo D","d":["Barolo, Barbaresco e Langhe"]},{"n":"Trattoria Nelle Vigne","s":"trattoria-nelle-vigne","c":"Diano D’Alba","d":["Barolo, Barbaresco e Langhe"]},{"n":"Tre Donne","s":"tre-donne","c":"Neive","d":["Barolo, Barbaresco e Langhe"]},{"n":"Ugo Lequio","s":"ugo-lequio","c":"Neive","d":["Barolo, Barbaresco e Langhe"]},{"n":"Valletti Roberta","s":"valletti-roberta","c":"Novello","d":["Barolo, Barbaresco e Langhe"]},{"n":"Vietti","s":"vietti","c":"Castiglione Falletto","d":["Barolo, Barbaresco e Langhe"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
