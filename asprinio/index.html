<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Asprinio d’Aversa, Galluccio e Falerno — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Asprinio d’Aversa, Galluccio e Falerno</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Asprinio d’Aversa, Galluccio e Falerno</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"A Life Agricola Societa' Agricola","s":"a-life-agricola-societa-agricola","c":"Piedimonte Matese","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"Caputo 1890","s":"caputo-1890","c":"Carinaro","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"Casa Vinicola La Masseria Sas di di Maio Giuseppe & C.","s":"casa-vinicola-la-masseria-sas-di-di-maio-giuseppe-c","c":"San Marco Evangelista Ce, 81020 San Marco Evangelista","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"Fattoria Alois","s":"fattoria-alois","c":"Pontelatone","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"Gennaro Papa","s":"gennaro-papa","c":"Falciano Del Massico","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"I Borboni","s":"i-borboni","c":"Lusciano","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"Il Casolare Divino","s":"il-casolare-divino","c":"Alvignano","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"La Masseria di Sessa","s":"la-masseria-di-sessa","c":"Sessa Aurunca","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"La Masserie","s":"la-masserie","c":"Bellona","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"Lavoro e Salute Vini Telaro","s":"lavoro-e-salute-vini-telaro","c":"Galluccio","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"Le Cantine di Hesperia","s":"le-cantine-di-hesperia","c":"Castel Campagnano","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"Masseria Campito Societa' Agricola delle Cugine di Martino","s":"masseria-campito-societa-agricola-delle-cugine-di-martino","c":"Gricignano Di Aversa","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"Masseria Felicia","s":"masseria-felicia","c":"Carano Di Sessa Aurunca","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"Migliozzi","s":"migliozzi","c":"Carinola","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"Moio Michele Fu Luigi","s":"moio-michele-fu-luigi","c":"Mondragone","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"Porto di Mola","s":"porto-di-mola","c":"Galluccio","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"Regina Viarum","s":"regina-viarum","c":"Falciano Del Massico","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"S.S.A. San Teodoro di Santoro Giuseppe","s":"s-s-a-san-teodoro-di-santoro-giuseppe","c":"– San Prisco","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"Sclavia","s":"sclavia","c":"Liberi","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"Soc. Agr. Magliulo","s":"soc-agr-magliulo","c":"Frignano","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"Tenuta Ievoli","s":"tenuta-ievoli","c":"Squille","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"Tenuta Santa Monica di Matano Mario","s":"tenuta-santa-monica-di-matano-mario","c":"Castel Campagnano","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"Vigne Chigi","s":"vigne-chigi","c":"Pontelatone","d":["Asprinio d’Aversa, Galluccio e Falerno"]},{"n":"Villa Sorbo","s":"villa-sorbo","c":"Galluccio","d":["Asprinio d’Aversa, Galluccio e Falerno"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
