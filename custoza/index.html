<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Custoza — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Custoza</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Custoza</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Albino Piona","s":"albino-piona","c":"Villafranca di Verona","d":["Custoza"]},{"n":"Aldo Adami","s":"aldo-adami","c":"Sommacampagna","d":["Custoza"]},{"n":"Antica Corte Bagolina","s":"antica-corte-bagolina","c":"Sommacampagna","d":["Custoza"]},{"n":"Azienda Agricola Falconi di Michele Montresor","s":"azienda-agricola-falconi-di-michele-montresor","c":"Villafranca di Verona","d":["Custoza"]},{"n":"Azienda Agricola Le Tende di Fortuna e Lucillini S.S.","s":"azienda-agricola-le-tende-di-fortuna-e-lucillini-s-s","c":"Lazise","d":["Custoza"]},{"n":"Bergamini Vini","s":"bergamini-vini","c":"Lazise","d":["Custoza"]},{"n":"Cadis 1898","s":"cadis-1898","c":"Soave","d":["Custoza"]},{"n":"Cantina Caorsa","s":"cantina-caorsa","c":"Affi","d":["Custoza"]},{"n":"Cantina Cà Fiosse","s":"cantina-ca-fiosse","c":"Villafranca di Verona","d":["Custoza"]},{"n":"Cantina di Custoza","s":"cantina-di-custoza","c":"Sommacampagna","d":["Custoza"]},{"n":"Cantina di Valpantena","s":"cantina-di-valpantena","c":"Quinto","d":["Custoza"]},{"n":"Cantina Sociale Valpolicella","s":"cantina-sociale","c":"Negrar","d":["Custoza"]},{"n":"Cantina Valpolicella Negrar","s":"cantina-valpolicella-negrar","c":"Negrar di Valpolicella","d":["Custoza"]},{"n":"Cantine Aldegheri","s":"cantine-aldegheri","c":"Sant'Ambrogio di Valpolicella","d":["Custoza"]},{"n":"Cantine Bertoldi","s":"cantine-bertoldi","c":"Bussolengo","d":["Custoza"]},{"n":"Cantine di Verona","s":"cantine-di-verona","c":"Quinto","d":["Custoza"]},{"n":"Cantine Lenotti","s":"cantine-lenotti","c":"Bardolino","d":["Custoza"]},{"n":"Casa Tione","s":"casa-tione","c":"Valeggio sul Mincio","d":["Custoza"]},{"n":"Cascina Mondator","s":"cascina-mondator","c":"Sommacampagna","d":["Custoza"]},{"n":"Casetta Fornel","s":"casetta-fornel","c":"Sona","d":["Custoza"]},{"n":"Cavalchina (Tenute di Famiglia)","s":"cavalchina","c":"Sommacampagna","d":["Custoza"]},{"n":"Corte Fornello","s":"corte-fornello","c":"Valeggio sul Mincio","d":["Custoza"]},{"n":"Corte Gardoni","s":"corte-gardoni","c":"Valeggio sul Mincio","d":["Custoza"]},{"n":"Corte Gioliare","s":"corte-gioliare","c":"Lazise","d":["Custoza"]},{"n":"Corte Mamaor","s":"corte-mamaor","c":"Valeggio sul Mincio","d":["Custoza"]},{"n":"Corte Sant’Arcadio","s":"corte-sant-arcadio","c":"Castelnuovo del Garda","d":["Custoza"]},{"n":"Cottini 1925","s":"cottini-1925","c":"San Pietro in Cariano","d":["Custoza"]},{"n":"Famiglia dalla Bernardina","s":"famiglia-dalla-bernardina","c":"Sommacampagna","d":["Custoza"]},{"n":"Giarola","s":"giarola","c":"Sona","d":["Custoza"]},{"n":"Giovanna Tantini","s":"giovanna-tantini","c":"Castelnuovo del Garda","d":["Custoza"]},{"n":"Gorgo","s":"gorgo","c":"Custoza","d":["Custoza"]},{"n":"Il Pignetto","s":"il-pignetto","c":"Bussolengo","d":["Custoza"]},{"n":"Le Muraglie","s":"le-muraglie","c":"Valeggio sul Mincio","d":["Custoza"]},{"n":"Meneghello","s":"meneghello","c":"Lazise","d":["Custoza"]},{"n":"Menegotti","s":"menegotti","c":"Villafranca di Verona","d":["Custoza"]},{"n":"Monte dei Roari","s":"monte-dei-roari","c":"Valeggio S/M","d":["Custoza"]},{"n":"Monte del Frà","s":"monte-del-fra","c":"Sommacampagna","d":["Custoza"]},{"n":"Monte Zovo","s":"monte-zovo","c":"Caprino Veronese","d":["Custoza"]},{"n":"Morando Lorenzo","s":"morando-lorenzo","c":"Bussolengo","d":["Custoza"]},{"n":"Pasqua Vigneti e Cantine","s":"pasqua","c":"Verona","d":["Custoza"]},{"n":"Pigno","s":"pigno","c":"Villafranca di Verona","d":["Custoza"]},{"n":"Poggio delle Grazie","s":"poggio-delle-grazie","c":"Castelnuovo del Garda","d":["Custoza"]},{"n":"Recchia","s":"recchia","c":"Negrar di Valpolicella","d":["Custoza"]},{"n":"Roccolo del Lago","s":"roccolo-del-lago","c":"Lazise","d":["Custoza"]},{"n":"Scriani","s":"scriani","c":"Fumane","d":["Custoza"]},{"n":"Seiterre","s":"seiterre","c":"Salionze di Valeggio sul Mincio","d":["Custoza"]},{"n":"Simone e Federico Righetti","s":"simone-e-federico-righetti","c":"Valeggio sul Mincio","d":["Custoza"]},{"n":"Tabarini","s":"tabarini","c":"Sommacampagna","d":["Custoza"]},{"n":"Tamburino Sardo","s":"tamburino-sardo","c":"Custoza di Sommacampagna","d":["Custoza"]},{"n":"Tommasi Viticoltori","s":"tommasi-viticoltori","c":"Pedemonte","d":["Custoza"]},{"n":"Valbusa","s":"valbusa","c":"Valeggio sul Mincio","d":["Custoza"]},{"n":"Vigneti Villabella","s":"vigneti-villabella","c":"Bardolino","d":["Custoza"]},{"n":"Villa Medici","s":"villa-medici","c":"Sommacampagna","d":["Custoza"]},{"n":"Villa Merighi","s":"villa-merighi","c":"Sona","d":["Custoza"]},{"n":"Vinicola Napoleone","s":"vinicola-napoleone","c":"Caprino Veronese","d":["Custoza"]},{"n":"Vitevis","s":"vitevis","c":"Montecchio Maggiore","d":["Custoza"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
