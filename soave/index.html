<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Soave e Recioto di Soave — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Soave e Recioto di Soave</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Soave</option><option>Soave Classico</option><option>Soave Superiore</option><option>Recioto di Soave</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Alba","s":"alba-soave","c":"Soave","d":[]},{"n":"Antica Corte","s":"antica-corte-soave","c":"Soave","d":["Soave"]},{"n":"Avogaro","s":"avogaro-soave","c":"Colognola ai Colli","d":[]},{"n":"Balestri Valda","s":"balestri-valda-soave","c":"Soave","d":["Recioto di Soave","Soave Classico"]},{"n":"Benini Alessandro","s":"benini-alessandro-soave","c":"Lavagno","d":[]},{"n":"Beretta Cecilia","s":"beretta-cecilia-soave","c":"San Felice Extra","d":["Soave Classico"]},{"n":"Bernard","s":"bernard-soave","c":"Sona","d":[]},{"n":"Bettili","s":"bettili-soave","c":"Soave","d":[]},{"n":"Biscardo Vini","s":"biscardo-vini-soave","c":"San Bonifacio","d":["Soave Classico"]},{"n":"Bolla","s":"bolla-soave","c":"San Pietro in Cariano","d":["Soave Classico","Soave Superiore"]},{"n":"Bruno Tasoniero","s":"bruno-tasoniero-soave","c":"Roncà","d":[]},{"n":"Ca' Rugate","s":"ca-rugate-soave","c":"Montecchia di Crosara","d":["Recioto di Soave","Soave Classico","Soave Superiore"]},{"n":"Cadis 1898","s":"cadis-1898-soave","c":"Soave","d":["Recioto di Soave","Soave","Soave Classico"]},{"n":"Cambrago Casa Vinicola","s":"cambrago-casa-vinicola-soave","c":"Colognola ai Colli","d":[]},{"n":"Canoso","s":"canoso-soave","c":"Monteforte d'Alpone","d":["Recioto di Soave","Soave Classico","Soave Superiore"]},{"n":"Cantina Danese","s":"cantina-danese-soave","c":"Roncà","d":["Soave Classico"]},{"n":"Cantina di Colognola ai Colli","s":"cantina-di-colognola-ai-colli-soave","c":"Colognola ai Colli","d":[]},{"n":"Cantina di Gambellara","s":"cantina-di-gambellara-soave","c":"Gambellara","d":[]},{"n":"Cantina di Monteforte","s":"cantina-di-monteforte-soave","c":"Monteforte d'Alpone","d":["Soave","Soave Classico","Soave Superiore"]},{"n":"Cantina Marti","s":"cantina-marti-soave","c":"Montecchia di Crosara","d":[]},{"n":"Cantina Martinelli","s":"cantina-martinelli-soave","c":"Verona","d":[]},{"n":"Cantina Sabaini","s":"cantina-sabaini-soave","c":"Illasi","d":["Soave"]},{"n":"Cantina Sociale Gambellara","s":"cantina-sociale-gambellara-soave","c":"Gambellara","d":["Soave Classico"]},{"n":"Cantina Sociale Valpolicella","s":"cantina-sociale-valpolicella-soave","c":"Negrar","d":["Soave Classico"]},{"n":"Casa Vinicola Bennati","s":"casa-vinicola-bennati-soave","c":"Cazzano di Tramigna","d":[]},{"n":"Casarotto","s":"casarotto-soave","c":"Montecchia di Crosara","d":["Recioto di Soave","Soave","Soave Classico"]},{"n":"Cavaggioni Lino","s":"cavaggioni-lino-soave","c":"Roncà","d":[]},{"n":"Coffele","s":"coffele-soave","c":"Soave","d":["Recioto di Soave","Soave Classico"]},{"n":"Collis Veneto Wine Group","s":"collis-veneto-wine-group-soave","c":"Monteforte d'Alpone","d":[]},{"n":"Corte Adami","s":"corte-adami-soave","c":"Soave","d":["Soave","Soave Classico","Soave Superiore"]},{"n":"Corte Canella","s":"corte-canella-soave","c":"Illasi","d":["Soave"]},{"n":"Corte Mainente","s":"corte-mainente-soave","c":"Soave","d":[]},{"n":"Corte Moschina","s":"corte-moschina-soave","c":"Roncà","d":["Recioto di Soave","Soave","Soave Superiore"]},{"n":"Cà Frigo","s":"ca-frigo-soave","c":"Monteforte d'Alpone","d":[]},{"n":"Cà Prearo","s":"ca-prearo-soave","c":"Monteforte d'Alpone","d":[]},{"n":"Dal Cero Family","s":"dal-cero-family-soave","c":"Roncà","d":["Soave","Soave Superiore"]},{"n":"El Vegro","s":"el-vegro-soave","c":"Monteforte d'Alpone","d":["Recioto di Soave","Soave Classico"]},{"n":"Enoitalia","s":"enoitalia-soave","c":"San Martino Buon Albergo","d":[]},{"n":"Equipe","s":"equipe-soave","c":"Soave","d":[]},{"n":"Fasoli Gino","s":"fasoli-gino-soave","c":"Colognola ai Colli","d":[]},{"n":"Fattori","s":"fattori-soave","c":"Roncà","d":["Recioto di Soave","Soave","Soave Classico"]},{"n":"Filippi wines","s":"filippi-wines-soave","c":"Soave","d":[]},{"n":"Fornaro","s":"fornaro-soave","c":"Soave","d":[]},{"n":"Franchetto","s":"franchetto-soave","c":"Roncà","d":["Soave","Soave Superiore"]},{"n":"Fratelli Giuliari Vini","s":"fratelli-giuliari-vini-soave","c":"Illasi","d":[]},{"n":"Giannitessari","s":"giannitessari-soave","c":"Roncà","d":["Soave","Soave Classico"]},{"n":"Gini","s":"gini-soave","c":"Monteforte d'Alpone","d":["Recioto di Soave","Soave Classico"]},{"n":"Graziano Prà","s":"graziano-pra-soave","c":"Monteforte d'Alpone","d":["Soave Classico"]},{"n":"I Stefanini","s":"i-stefanini-soave","c":"Monteforte d'Alpone","d":["Soave","Soave Classico","Soave Superiore"]},{"n":"Ilatium Morini","s":"ilatium-morini-soave","c":"Mezzane di Sotto","d":["Soave"]},{"n":"Inama","s":"inama-soave","c":"San Bonifacio","d":["Soave"]},{"n":"La Cappuccina","s":"la-cappuccina-soave","c":"Monteforte d'Alpone","d":["Recioto di Soave","Soave","Soave Classico"]},{"n":"La Formica","s":"la-formica-soave","c":"Illasi","d":["Soave"]},{"n":"Lamberti","s":"lamberti-soave","c":"Pastrengo","d":["Soave","Soave Classico"]},{"n":"Le Albare","s":"le-albare-soave","c":"Montecchia di Crosara","d":["Recioto di Soave","Soave","Soave Classico"]},{"n":"Le Battistelle","s":"le-battistelle-soave","c":"Monteforte d'Alpone","d":["Soave","Soave Classico"]},{"n":"Le Chiarelle","s":"le-chiarelle-soave","c":"Monteforte d'Alpone","d":[]},{"n":"Le Mandolare","s":"le-mandolare-soave","c":"Monteforte d'Alpone","d":["Soave Classico"]},{"n":"Marcato Family","s":"marcato-family-soave","c":"Roncà","d":[]},{"n":"Marco Mosconi","s":"marco-mosconi-soave","c":"Illasi","d":[]},{"n":"Martinelli Gabriele","s":"martinelli-gabriele-soave","c":"Monteforte d'Alpone","d":[]},{"n":"Mondello Wines","s":"mondello-wines-soave","c":"San Bonifacio","d":[]},{"n":"Monte Tondo","s":"monte-tondo-soave","c":"Soave","d":["Recioto di Soave","Soave","Soave Classico","Soave Superiore"]},{"n":"Montezan","s":"montezan-soave","c":"Roncà","d":[]},{"n":"Nardello","s":"nardello-soave","c":"Monteforte d'Alpone","d":["Soave Classico"]},{"n":"Pagani","s":"pagani-soave","c":"Cazzano di Tramigna","d":[]},{"n":"Pelosato Alberto","s":"pelosato-alberto-soave","c":"Monteforte d'Alpone","d":[]},{"n":"Pieropan","s":"pieropan-soave","c":"Soave","d":["Recioto di Soave","Soave Classico"]},{"n":"Poia","s":"poia-soave","c":"Montecchia di Crosara","d":[]},{"n":"Portinari","s":"portinari-soave","c":"Monteforte d'Alpone","d":["Recioto di Soave","Soave","Soave Superiore"]},{"n":"Posenato Carlo Alberto","s":"posenato-carlo-alberto-soave","c":"Montecchia di Crosara","d":[]},{"n":"Quargentan","s":"quargentan-soave","c":"Roncà","d":[]},{"n":"Quargentan David","s":"quargentan-david-soave","c":"Roncà","d":[]},{"n":"Rizzotto Spumanti","s":"rizzotto-spumanti-soave","c":"Soave","d":[]},{"n":"Roccolo Grassi","s":"roccolo-grassi-soave","c":"Mezzane di Sotto","d":["Recioto di Soave","Soave"]},{"n":"Roncolato Antonio","s":"roncolato-antonio-soave","c":"Soave","d":[]},{"n":"Sandro De Bruno","s":"sandro-de-bruno-soave","c":"Montecchia di Crosara","d":[]},{"n":"Santi","s":"santi-soave","c":"Illasi","d":["Soave Classico"]},{"n":"Strele","s":"strele-soave","c":"Soave","d":[]},{"n":"Suavia","s":"suavia-soave","c":"Soave","d":["Recioto di Soave","Soave Classico"]},{"n":"Tamellini","s":"tamellini-soave","c":"Soave","d":[]},{"n":"Tenuta Grimani","s":"tenuta-grimani-soave","c":"","d":[]},{"n":"Tenuta S. Antonio","s":"tenuta-s-antonio-soave","c":"Colognola ai Colli","d":["Soave"]},{"n":"Tenuta Santa Maria","s":"tenuta-santa-maria-soave","c":"Negrar di Valpolicella","d":["Soave"]},{"n":"Tenuta Solar","s":"tenuta-solar-soave","c":"Monteforte d'Alpone","d":["Recioto di Soave","Soave","Soave Classico"]},{"n":"Tessari","s":"tessari-soave","c":"Monteforte d'Alpone","d":["Recioto di Soave","Soave","Soave Classico","Soave Superiore"]},{"n":"Tirapelle","s":"tirapelle-soave","c":"Roncà","d":[]},{"n":"Trabucchi d’Illasi","s":"trabucchi-dillasi-soave","c":"Illasi","d":["Recioto di Soave"]},{"n":"Valpantena Wines","s":"valpantena-wines-soave","c":"Verona","d":[]},{"n":"Vicentini Agostino","s":"vicentini-agostino-soave","c":"Colognola ai Colli","d":["Recioto di Soave","Soave","Soave Superiore"]},{"n":"Villa Canestrari","s":"villa-canestrari-soave","c":"Colognola ai Colli","d":[]},{"n":"Villa Erbice","s":"villa-erbice-soave","c":"Mezzane di Sotto","d":["Soave Superiore"]},{"n":"Villa Mattielli","s":"villa-mattielli-soave","c":"Soave","d":[]},{"n":"Vini SCIC","s":"vini-scic-soave","c":"Roncà","d":[]},{"n":"Vitevis","s":"vitevis-soave","c":"Montecchio Maggiore","d":[]},{"n":"Viticultori d'Italia","s":"viticultori-d-italia-soave","c":"","d":[]},{"n":"Zambon","s":"zambon-soave","c":"Roncà","d":[]},{"n":"Zambon Claudio","s":"zambon-claudio-soave","c":"","d":[]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
