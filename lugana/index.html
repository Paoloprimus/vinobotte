<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Lugana — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Lugana</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Lugana</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Abate","s":"abate","c":"Lonato del Garda","d":["Lugana"]},{"n":"Armea","s":"armea","c":"Desenzano del Garda","d":["Lugana"]},{"n":"Bertagna","s":"bertagna","c":"Cavriana","d":["Lugana"]},{"n":"Borgo La Caccia","s":"borgo-la-caccia","c":"Pozzolengo","d":["Lugana"]},{"n":"Bosco","s":"bosco","c":"Pozzolengo","d":["Lugana"]},{"n":"Brunello","s":"brunello","c":"Pozzolengo","d":["Lugana"]},{"n":"Ca' Lojera","s":"ca-lojera","c":"Sirmione","d":["Lugana"]},{"n":"Cadore Patrizia","s":"cadore-patrizia","c":"Pozzolengo","d":["Lugana"]},{"n":"Cantina Cattani","s":"cantina-cattani","c":"Cavriana","d":["Lugana"]},{"n":"Cascina Le Preseglie","s":"cascina-le-preseglie","c":"Desenzano del Garda","d":["Lugana"]},{"n":"Casello Bondoni","s":"casello-bondoni","c":"Desenzano del Garda","d":["Garda Marzemino","Lugana"]},{"n":"Castrini","s":"castrini","c":"Pozzolengo","d":["Lugana"]},{"n":"Ceresa","s":"ceresa","c":"Pozzolengo","d":["Lugana"]},{"n":"Citari","s":"citari","c":"Desenzano del Garda","d":["Lugana"]},{"n":"Cobue","s":"cobue","c":"Pozzolengo","d":["Lugana"]},{"n":"Colli Vaibò","s":"colli-vaibo","c":"Pozzolengo","d":["Lugana"]},{"n":"Corte Anna","s":"corte-anna","c":"Sirmione","d":["Lugana","Lugana Riserva"]},{"n":"Costaripa","s":"costaripa","c":"Moniga del Garda","d":["Lugana"]},{"n":"Cà dei Frati","s":"ca-dei-frati","c":"Lugana di Sirmione","d":["Lugana"]},{"n":"Cà Maiol","s":"ca-maiol","c":"Desenzano del Garda","d":["Lugana"]},{"n":"Cò De Fer","s":"co-de-fer","c":"Pozzolengo","d":["Lugana"]},{"n":"Dal Biondo","s":"dal-biondo","c":"Pozzolengo","d":["Lugana"]},{"n":"De Tomi Cristian","s":"de-tomi-cristian","c":"Sirmione","d":["Lugana"]},{"n":"Decordi del Borgo Imperiale Vinicola – Cortesole Spa","s":"decordi-del-borgo-imperiale-vinicola-cortesole-spa","c":"Motta Baluffi","d":["Lugana"]},{"n":"Don Lorenzo della Grillaia","s":"don-lorenzo-della-grillaia","c":"Sirmione","d":["Lugana"]},{"n":"Feliciana","s":"feliciana","c":"Pozzolengo","d":["Lugana"]},{"n":"Franzosi","s":"franzosi","c":"Puegnago del Garda","d":["Lugana"]},{"n":"La Rifra","s":"la-rifra","c":"Desenzano del Garda","d":["Lugana"]},{"n":"Loda","s":"loda","c":"Pozzolengo","d":["Lugana"]},{"n":"Malavasi","s":"malavasi","c":"Pozzolengo","d":["Lugana"]},{"n":"Marangona","s":"marangona","c":"Pozzolengo","d":["Lugana"]},{"n":"Marida Benedetti","s":"marida-benedetti","c":"Desenzano del Garda","d":["Lugana"]},{"n":"Marotti Daniela","s":"marotti-daniela","c":"Desenzano del Garda","d":["Lugana"]},{"n":"Menadel","s":"menadel","c":"Inverigo","d":["Lugana"]},{"n":"Milan Bordignon","s":"milan-bordignon","c":"Desenzano del Garda","d":["Lugana"]},{"n":"Monte Cicogna","s":"monte-cicogna","c":"Moniga del Garda","d":["Lugana"]},{"n":"Montefluno","s":"montefluno","c":"Pozzolengo","d":["Lugana"]},{"n":"Montonale","s":"montonale","c":"Desenzano del Garda","d":["Lugana"]},{"n":"Nunzio Ghiraldi","s":"nunzio-ghiraldi","c":"Sirmione","d":["Lugana"]},{"n":"One Piò","s":"one-pio","c":"Desenzano del Garda","d":["Lugana"]},{"n":"Palvarini Anna","s":"palvarini-anna","c":"Sirmione","d":["Lugana"]},{"n":"Pasetto Emilio","s":"pasetto-emilio","c":"Sirmione","d":["Lugana"]},{"n":"Pellizzari di San Girolamo","s":"pellizzari-di-san-girolamo","c":"Desenzano del Garda","d":["Lugana"]},{"n":"Perla del Garda","s":"perla-del-garda","c":"Lonato del Garda","d":["Lugana"]},{"n":"Pilandro","s":"pilandro","c":"Desenzano del Garda","d":["Lugana"]},{"n":"Pirenei","s":"pirenei","c":"Pozzolengo","d":["Lugana"]},{"n":"Poggio al Garda","s":"poggio-al-garda","c":"Pozzolengo","d":["Lugana"]},{"n":"Pratello","s":"pratello","c":"Padenghe sul Garda","d":["Lugana"]},{"n":"Primo Campo","s":"primo-campo","c":"Desenzano del Garda","d":["Lugana","Lugana Spumante","Lugana Superiore"]},{"n":"Quattro Pini","s":"quattro-pini","c":"Desenzano del Garda","d":["Lugana"]},{"n":"Scarpari Felice","s":"scarpari-felice","c":"Botticino","d":["Lugana"]},{"n":"Scolari","s":"scolari","c":"Puegnago del Garda","d":["Lugana"]},{"n":"Selva Capuzza","s":"selva-capuzza","c":"Desenzano del Garda","d":["Lugana"]},{"n":"Seriati","s":"seriati","c":"Pozzolengo","d":["Lugana"]},{"n":"Sgreva","s":"sgreva","c":"Sirmione","d":["Lugana"]},{"n":"Tenuta Corbari","s":"tenuta-corbari","c":"Desenzano del Garda","d":["Lugana"]},{"n":"Tenuta Roveglia","s":"tenuta-roveglia","c":"Pozzolengo","d":["Lugana"]},{"n":"Turina","s":"turina","c":"Moniga del Garda","d":["Lugana"]},{"n":"Viticoltori del Garda","s":"viticoltori-del-garda","c":"Moniga del Garda","d":["Lugana"]},{"n":"Zamichele","s":"zamichele","c":"Pozzolengo","d":["Garda Cabernet Sauvignon","Garda Merlot","Lugana","Lugana Spumante"]},{"n":"Zappaglia","s":"zappaglia","c":"Pozzolengo","d":["Lugana"]},{"n":"Zenegaglia","s":"zenegaglia","c":"Pozzolengo","d":["Lugana","Lugana Riserva"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
