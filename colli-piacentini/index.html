<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Colli Piacentini — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Colli Piacentini</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Colli Piacentini</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Albertini Carlo","s":"albertini-carlo","c":"Pianello Val Tidone","d":["Colli Piacentini"]},{"n":"Borgofulvia","s":"borgofulvia","c":"Piacenza","d":["Colli Piacentini"]},{"n":"Bulli","s":"bulli","c":"Castell'Arquato","d":["Colli Piacentini"]},{"n":"Camorali","s":"camorali","c":"Lugagnano Val d’Arda","d":["Colli Piacentini"]},{"n":"Cantina Manzini","s":"cantina-manzini","c":"Pontenure","d":["Colli Piacentini"]},{"n":"Cantina Valtidone","s":"cantina-valtidone","c":"Borgonovo Val Tidone","d":["Colli Piacentini"]},{"n":"Casa Benna","s":"casa-benna","c":"Castell'Arquato","d":["Colli Piacentini"]},{"n":"Civardi Racemus","s":"civardi-racemus","c":"Ziano Piacentino","d":["Colli Piacentini"]},{"n":"Croci","s":"croci","c":"Castell'Arquato","d":["Colli Piacentini"]},{"n":"Formaggini Peveri","s":"formaggini-peveri","c":"Ziano Piacentino","d":["Colli Piacentini"]},{"n":"Fratelli Piacentini","s":"fratelli-piacentini","c":"Ziano Piacentino","d":["Colli Piacentini"]},{"n":"Gaiaschi","s":"gaiaschi","c":"Ziano Piacentino","d":["Colli Piacentini"]},{"n":"Il Ghizzo","s":"il-ghizzo","c":"Ponte dell'Olio","d":["Colli Piacentini"]},{"n":"Il Rintocco","s":"il-rintocco","c":"Vernasca","d":["Colli Piacentini"]},{"n":"La Ciocca","s":"la-ciocca","c":"Carpaneto Piacentino","d":["Colli Piacentini"]},{"n":"La Poiesa","s":"la-poiesa","c":"Carpaneto Piacentino","d":["Colli Piacentini"]},{"n":"La Stoppa","s":"la-stoppa","c":"Rivergaro","d":["Colli Piacentini"]},{"n":"La Tosa","s":"la-tosa","c":"Vigolzone","d":["Colli Piacentini"]},{"n":"Loschi","s":"loschi","c":"Castell'Arquato","d":["Colli Piacentini"]},{"n":"Lusenti","s":"lusenti","c":"Ziano Piacentino","d":["Colli Piacentini"]},{"n":"Montesissa","s":"montesissa","c":"Carpaneto Piacentino","d":["Colli Piacentini"]},{"n":"Oppizzi","s":"oppizzi","c":"Pianello Val Tidone","d":["Colli Piacentini"]},{"n":"Perini & Perini","s":"perini-perini","c":"Piacenza","d":["Colli Piacentini"]},{"n":"Pietro Gazzola","s":"pietro-gazzola","c":"Travo","d":["Colli Piacentini"]},{"n":"Podere Gaiaschi","s":"podere-gaiaschi","c":"Alta Val Tidone","d":["Colli Piacentini"]},{"n":"Savini","s":"savini","c":"Ziano Piacentino","d":["Colli Piacentini"]},{"n":"Schiavetto","s":"schiavetto","c":"Carpaneto Piacentino","d":["Colli Piacentini"]},{"n":"Tenuta la Bertuzza","s":"tenuta-la-bertuzza","c":"Castell'Arquato","d":["Colli Piacentini"]},{"n":"Tollara","s":"tollara","c":"Alseno","d":["Colli Piacentini"]},{"n":"Zerioli","s":"zerioli","c":"Ziano Piacentino","d":["Colli Piacentini"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
