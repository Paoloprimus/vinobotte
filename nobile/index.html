<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Nobile di Montepulciano — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Nobile di Montepulciano</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Vino Nobile di Montepulciano</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Antichi Benefizi","s":"antichi-benefizi","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Antico Colle","s":"antico-colle","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Avignonesi","s":"avignonesi","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Barbanera","s":"barbanera","c":"Cetona","d":["Vino Nobile di Montepulciano"]},{"n":"Barbicaia","s":"barbicaia","c":"","d":["Vino Nobile di Montepulciano"]},{"n":"Bindella","s":"bindella","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Bindi Sergardi – Tenuta Marcianella","s":"bindi-sergardi-tenuta-marcianella","c":"","d":["Vino Nobile di Montepulciano"]},{"n":"Boscarelli","s":"boscarelli","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Canneto","s":"canneto","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Cantina del Giusto","s":"cantina-del-giusto","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Cantina la Nicchia","s":"cantina-la-nicchia","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Cantina Priorino","s":"cantina-priorino","c":"","d":["Vino Nobile di Montepulciano"]},{"n":"Carpineto","s":"carpineto","c":"Chianciano Terme","d":["Vino Nobile di Montepulciano"]},{"n":"Casale Daviddi","s":"casale-daviddi","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Cecchi","s":"cecchi","c":"Siena","d":["Vino Nobile di Montepulciano"]},{"n":"Chiacchiera","s":"chiacchiera","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Contucci","s":"contucci","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Croce di Febo","s":"croce-di-febo","c":"Siena","d":["Vino Nobile di Montepulciano"]},{"n":"Crociani","s":"crociani","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"D&D","s":"d-e-d","c":"","d":["Vino Nobile di Montepulciano"]},{"n":"DEI","s":"dei","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"De’ Ricci","s":"de-ricci","c":"Mon pulciano"]},{"n":"La Ciarliana","s":"la-ciarliana","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"La Combarbia","s":"la-combarbia","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"La Piccola Cantina","s":"la-piccola-cantina","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Le Berne","s":"le-berne","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Le Bertille","s":"le-bertille","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Lombardo","s":"lombardo","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Lunadoro","s":"lunadoro","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Luteraia","s":"luteraia","c":"","d":["Vino Nobile di Montepulciano"]},{"n":"Manvi","s":"manvi","c":"","d":["Vino Nobile di Montepulciano"]},{"n":"Marchesi Frescobaldi","s":"marchesi-frescobaldi","c":"Siena","d":["Vino Nobile di Montepulciano"]},{"n":"Metinella","s":"metinella","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Montemercurio","s":"montemercurio","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Nottola","s":"nottola","c":"","d":["Vino Nobile di Montepulciano"]},{"n":"Palazzo Bandino","s":"palazzo-bandino","c":"Chianciano Terme","d":["Vino Nobile di Montepulciano"]},{"n":"Palazzo Vecchio","s":"palazzo-vecchio","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Podere Casa al Vento","s":"podere-casa-al-vento","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Podere Casanova","s":"podere-casanova","c":"– loc. Tre Berte","d":["Vino Nobile di Montepulciano"]},{"n":"Podere Casanova Guidotti Societa Semplice","s":"podere-casanova-guidotti-societa-semplice","c":"Siena","d":["Vino Nobile di Montepulciano"]},{"n":"Podere della Bruciata","s":"podere-della-bruciata","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Podere Lamberto","s":"podere-lamberto","c":"","d":["Vino Nobile di Montepulciano"]},{"n":"Podere Paradisino","s":"podere-paradisino","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Poderi Sanguineto","s":"poderi-sanguineto","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Poggio alla Sala","s":"poggio-alla-sala","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Poliziano","s":"poliziano","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Raspanti","s":"raspanti","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Ruffino","s":"ruffino","c":"Montalcino","d":["Vino Nobile di Montepulciano"]},{"n":"Salcheto","s":"salcheto","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"San Salvagio","s":"san-salvagio","c":"","d":["Vino Nobile di Montepulciano"]},{"n":"Shona","s":"shona","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Tanagatta","s":"tanagatta","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Tenuta Abbadia Vecchia","s":"tenuta-abbadia-vecchia","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Tenuta Aliotti","s":"tenuta-aliotti","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Tenuta di Gracciano della Seta","s":"tenuta-di-gracciano-della-seta","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Tenuta di Poggio Uliveto","s":"tenuta-di-poggio-uliveto","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Tenuta Fontenuova","s":"tenuta-fontenuova","c":"","d":["Vino Nobile di Montepulciano"]},{"n":"Tenuta la Calonica Società Agricola","s":"tenuta-la-calonica-societa-agricola","c":"","d":["Vino Nobile di Montepulciano"]},{"n":"Tenuta Trerose","s":"tenuta-trerose","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Tenuta Valdipiatta","s":"tenuta-valdipiatta","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Terra Antica","s":"terra-antica","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Tiberini","s":"tiberini","c":"","d":["Vino Nobile di Montepulciano"]},{"n":"Triacca Tenuta Santavenere","s":"triacca-tenuta-santavenere","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Vecchia Cantina di Montepulciano","s":"vecchia-cantina-di-montepulciano","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]},{"n":"Villa Santanna","s":"villa-santanna","c":"Montepulciano","d":["Vino Nobile di Montepulciano"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
