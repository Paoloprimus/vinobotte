<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Trentino — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Trentino</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Trentino</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Abate Nero","s":"abate-nero","c":"Trento","d":["Trentino"]},{"n":"Agraria Riva del Garda","s":"agraria-riva-del-garda","c":"Riva del Garda","d":["Trentino"]},{"n":"Altemasi","s":"altemasi","c":"Trento","d":["Trentino"]},{"n":"Ambre","s":"ambre","c":"Mezzolombardo","d":["Trentino"]},{"n":"Andrea Forti Wines","s":"andrea-forti-wines","c":"Trento","d":["Trentino"]},{"n":"Azienda Agricola Lunelli","s":"azienda-agricola-lunelli","c":"Madruzzo","d":["Trentino"]},{"n":"Azienda Agricola Mattè","s":"azienda-agricola-matte","c":"Volano","d":["Trentino"]},{"n":"Baldessari Marco","s":"baldessari-marco","c":"Trento","d":["Trentino"]},{"n":"Balter","s":"balter","c":"Rovereto","d":["Trentino"]},{"n":"Barone a Prato","s":"barone-a-prato","c":"Segonzano","d":["Trentino"]},{"n":"Bellaveder","s":"bellaveder","c":"Faedo","d":["Trentino"]},{"n":"Bertagnolli","s":"bertagnolli","c":"Mezzocorona","d":["Trentino"]},{"n":"Betta Luigino","s":"betta-luigino","c":"Mezzocorona","d":["Trentino"]},{"n":"Bollini","s":"bollini","c":"Volano","d":["Trentino"]},{"n":"Bolognani","s":"bolognani","c":"Lavis","d":["Trentino"]},{"n":"Borgo dei Posseri","s":"borgo-dei-posseri","c":"Ala","d":["Trentino"]},{"n":"Brugnara","s":"brugnara","c":"Trento","d":["Trentino"]},{"n":"Bruno Pilzer","s":"bruno-pilzer","c":"Altavalle","d":["Trentino"]},{"n":"Cantina Aldeno","s":"cantina-aldeno","c":"Aldeno","d":["Trentino"]},{"n":"Cantina Bailoni","s":"cantina-bailoni","c":"Trento","d":["Trentino"]},{"n":"Cantina d'Isera","s":"cantina-d-isera","c":"Isera","d":["Trentino"]},{"n":"Cantina Delaiti","s":"cantina-delaiti","c":"Aldeno","d":["Trentino"]},{"n":"Cantina Romanese","s":"cantina-romanese","c":"Levico Terme","d":["Trentino"]},{"n":"Cantina Rotaliana di Mezzolombardo","s":"cantina-rotaliana-di-mezzolombardo","c":"Mezzolombardo","d":["Trentino"]},{"n":"Cantina Sociale di Ala","s":"cantina-sociale-di-ala","c":"Ala","d":["Trentino"]},{"n":"Cantina Sociale di Trento","s":"cantina-sociale-di-trento","c":"Trento","d":["Trentino"]},{"n":"Cantina Toblino","s":"cantina-toblino","c":"Madruzzo","d":["Trentino"]},{"n":"Cantina Zehnhof","s":"cantina-zehnhof","c":"Roverè della Luna","d":["Trentino"]},{"n":"Cantine Ferrari","s":"cantine-ferrari","c":"Trento","d":["Trentino"]},{"n":"Cantine Monfort","s":"cantine-monfort","c":"Lavis","d":["Trentino"]},{"n":"Castel Monreale","s":"castel-monreale","c":"Lana","d":["Trentino"]},{"n":"Castel Pietra","s":"castel-pietra","c":"Calliano","d":["Trentino"]},{"n":"Cavit","s":"cavit","c":"Trento","d":["Trentino"]},{"n":"Cembra Cantina di Montagna","s":"cembra-cantina-di-montagna","c":"Cembra Lisignago","d":["Trentino"]},{"n":"Cesarini Sforza Spumanti","s":"cesarini-sforza-spumanti","c":"Trento","d":["Trentino"]},{"n":"Cesconi","s":"cesconi","c":"Lavis","d":["Trentino"]},{"n":"Conti Bossi Fedrigotti - Masi Agricola","s":"conti-bossi-fedrigotti-masi-agricola","c":"Rovereto","d":["Trentino"]},{"n":"Corvée","s":"corvee","c":"Cembra Lisignago","d":["Trentino"]},{"n":"Cà de Vila","s":"ca-de-vila","c":"Villa Lagarina","d":["Trentino"]},{"n":"De Vescovi Ulzbach","s":"de-vescovi-ulzbach","c":"Mezzocorona","d":["Trentino"]},{"n":"Donati Marco","s":"donati-marco","c":"Mezzocorona","d":["Trentino"]},{"n":"Dorigati","s":"dorigati","c":"Mezzocorona","d":["Trentino"]},{"n":"El Zeremia","s":"el-zeremia","c":"Novella","d":["Trentino"]},{"n":"Endrizzi Elio e F.lli","s":"endrizzi-elio-e-f-lli","c":"Mezzocorona","d":["Trentino"]},{"n":"Etyssa","s":"etyssa","c":"Trento","d":["Trentino"]},{"n":"Fontana Graziano","s":"fontana-graziano","c":"San Michele all’Adige","d":["Trentino"]},{"n":"Foradori","s":"foradori","c":"Mezzolombardo","d":["Trentino"]},{"n":"Furletti Gabriele","s":"furletti-gabriele","c":"Riva del Garda","d":["Trentino"]},{"n":"Gino Pedrotti","s":"gino-pedrotti","c":"Cavedine","d":["Trentino"]},{"n":"Giulio & Mauro","s":"giulio-mauro","c":"Vallelaghi","d":["Trentino"]},{"n":"Gorga Renzo","s":"gorga-renzo","c":"Folgaria","d":["Trentino"]},{"n":"Grigoletti","s":"grigoletti","c":"Nomi","d":["Trentino"]},{"n":"La Cadalora","s":"la-cadalora","c":"Santa Margherita d'Ala","d":["Trentino"]},{"n":"Lagertal","s":"lagertal","c":"Villa Lagarina","d":["Trentino"]},{"n":"Letrari","s":"letrari","c":"Rovereto","d":["Trentino"]},{"n":"LeVide","s":"levide","c":"Predaia","d":["Trentino"]},{"n":"LEVII","s":"levii","c":"Bleggio Superiore","d":["Trentino"]},{"n":"Madonna delle Vittorie","s":"madonna-delle-vittorie","c":"Arco","d":["Trentino"]},{"n":"Man","s":"man","c":"Giovo","d":["Trentino"]},{"n":"Martinelli Albino","s":"martinelli-albino","c":"Ala","d":["Trentino"]},{"n":"Mas dei Chini","s":"mas-dei-chini","c":"Trento","d":["Trentino"]},{"n":"Maso Bergamini","s":"maso-bergamini","c":"Trento","d":["Trentino"]},{"n":"Maso Furli","s":"maso-furli","c":"Lavis","d":["Trentino"]},{"n":"Maso Grener","s":"maso-grener","c":"Lavis","d":["Trentino"]},{"n":"Maso Martis","s":"maso-martis","c":"Trento","d":["Trentino"]},{"n":"Maso Poli","s":"maso-poli","c":"Lavis","d":["Trentino"]},{"n":"Maso Roveri","s":"maso-roveri","c":"Avio","d":["Trentino"]},{"n":"Maso Salengo","s":"maso-salengo","c":"Volano","d":["Trentino"]},{"n":"Mattia Filippi","s":"mattia-filippi","c":"Faedo","d":["Trentino"]},{"n":"Maxentia","s":"maxentia","c":"Vallelaghi","d":["Trentino"]},{"n":"Nosio","s":"nosio","c":"Mezzocorona","d":["Trentino"]},{"n":"Oxenreiter","s":"oxenreiter","c":"Brentonico","d":["Trentino"]},{"n":"Paolazzi","s":"paolazzi","c":"Cavalese","d":["Trentino"]},{"n":"Pedrotti Spumanti","s":"pedrotti-spumanti","c":"Nomi","d":["Trentino"]},{"n":"Pelz F.lli","s":"pelz-f-lli","c":"Cembra Lisignago","d":["Trentino"]},{"n":"Pravis","s":"pravis","c":"Lasino","d":["Trentino"]},{"n":"Redondel","s":"redondel","c":"Mezzolombardo","d":["Trentino"]},{"n":"Revì","s":"revi","c":"Aldeno","d":["Trentino"]},{"n":"Salizzoni","s":"salizzoni","c":"Calliano","d":["Trentino"]},{"n":"Salvetta","s":"salvetta","c":"Madruzzo","d":["Trentino"]},{"n":"San Leonardo","s":"san-leonardo","c":"Avio","d":["Trentino"]},{"n":"San Michael","s":"san-michael","c":"San Michele all’Adige","d":["Trentino"]},{"n":"Sandri Arcangelo","s":"sandri-arcangelo","c":"Faedo","d":["Trentino"]},{"n":"Simoncelli Armando","s":"simoncelli-armando","c":"Rovereto","d":["Trentino"]},{"n":"Tarter","s":"tarter","c":"Lavis","d":["Trentino"]},{"n":"Tenuta Maso Corno","s":"tenuta-maso-corno","c":"Rovereto","d":["Trentino"]},{"n":"Tenuta Volpare","s":"tenuta-volpare","c":"Trento","d":["Trentino"]},{"n":"Terre del Lagorai","s":"terre-del-lagorai","c":"Castel Ivano","d":["Trentino"]},{"n":"Tonini Viticoltore in Isera","s":"tonini-viticoltore-in-isera","c":"Isera","d":["Trentino"]},{"n":"Vallarom","s":"vallarom","c":"Avio","d":["Trentino"]},{"n":"Vicentini Giovanni","s":"vicentini-giovanni","c":"Nago-Torbole","d":["Trentino"]},{"n":"Villa Corniole","s":"villa-corniole","c":"Giovo","d":["Trentino"]},{"n":"Villa Persani","s":"villa-persani","c":"Lavis","d":["Trentino"]},{"n":"Villa Piccola","s":"villa-piccola","c":"San Michele all’Adige","d":["Trentino"]},{"n":"Visentin Ilaria","s":"visentin-ilaria","c":"San Michele all’Adige","d":["Trentino"]},{"n":"Vivallis","s":"vivallis","c":"Nogaredo","d":["Trentino"]},{"n":"Wolf","s":"wolf","c":"Castelnuovo","d":["Trentino"]},{"n":"Zanini Luigi","s":"zanini-luigi","c":"Mezzolombardo","d":["Trentino"]},{"n":"Zanotelli","s":"zanotelli","c":"Cembra Lisignago","d":["Trentino"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
