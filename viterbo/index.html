<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Viterbo, Montefiascone e Tuscia — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Viterbo, Montefiascone e Tuscia</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Viterbo, Montefiascone e Tuscia</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Antica Cantina Leonardi","s":"antica-cantina-leonardi","c":"Montefiascone","d":["Viterbo, Montefiascone e Tuscia"]},{"n":"Azienda Agricola Debora Castelli","s":"azienda-agricola-debora-castelli","c":"Marta","d":["Viterbo, Montefiascone e Tuscia"]},{"n":"Cantina di Montefiascone","s":"cantina-di-montefiascone","c":"Montefiascone","d":["Viterbo, Montefiascone e Tuscia"]},{"n":"Cristina Menicocci","s":"cristina-menicocci","c":"Fabrica di Roma","d":["Viterbo, Montefiascone e Tuscia"]},{"n":"Il Marrugio","s":"il-marrugio","c":"Viterbo","d":["Viterbo, Montefiascone e Tuscia"]},{"n":"Le Coste di Gradoli","s":"le-coste-di-gradoli","c":"Gradoli","d":["Viterbo, Montefiascone e Tuscia"]},{"n":"Podere Grecchi","s":"podere-grecchi","c":"Viterbo","d":["Viterbo, Montefiascone e Tuscia"]},{"n":"Podere Orto","s":"podere-orto","c":"Acquapendente","d":["Viterbo, Montefiascone e Tuscia"]},{"n":"Poggio Bbaranèllo","s":"poggio-bbaranello","c":"Montefiascone","d":["Viterbo, Montefiascone e Tuscia"]},{"n":"Ronci di Nepi","s":"ronci-di-nepi","c":"Nepi","d":["Viterbo, Montefiascone e Tuscia"]},{"n":"San Giovenale","s":"san-giovenale","c":"Blera","d":["Viterbo, Montefiascone e Tuscia"]},{"n":"Stefanoni","s":"stefanoni","c":"Montefiascone","d":["Viterbo, Montefiascone e Tuscia"]},{"n":"Tenuta Casciani","s":"tenuta-casciani","c":"Civitella d'Agliano","d":["Viterbo, Montefiascone e Tuscia"]},{"n":"Terre d'Aquesia","s":"terre-d-aquesia","c":"Acquapendente","d":["Viterbo, Montefiascone e Tuscia"]},{"n":"Terre di Marfisa","s":"terre-di-marfisa","c":"Farnese","d":["Viterbo, Montefiascone e Tuscia"]},{"n":"Vigne del Patrimonio","s":"vigne-del-patrimonio","c":"Farnese","d":["Viterbo, Montefiascone e Tuscia"]},{"n":"Villa Caviciana","s":"villa-caviciana","c":"Gradoli","d":["Viterbo, Montefiascone e Tuscia"]},{"n":"Villa Puri","s":"villa-puri","c":"Bolsena","d":["Viterbo, Montefiascone e Tuscia"]},{"n":"Viticoltori dei Colli Cimini","s":"viticoltori-dei-colli-cimini","c":"Vignanello","d":["Viterbo, Montefiascone e Tuscia"]},{"n":"Vulci di Simoncini","s":"vulci-di-simoncini","c":"Cellere","d":["Viterbo, Montefiascone e Tuscia"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
