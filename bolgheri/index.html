<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Bolgheri — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Bolgheri</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Bolgheri</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Aia Vecchia","s":"aia-vecchia","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Aldrovandi","s":"aldrovandi","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Argentiera","s":"argentiera","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Banfi","s":"banfi","c":"Montalcino","d":["Bolgheri"]},{"n":"Batzella","s":"batzella","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Bell Aja","s":"bell-aja","c":"Castelnuovo Berardenga","d":["Bolgheri"]},{"n":"Bonacchi","s":"bonacchi","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Bosco Alle Vigne","s":"bosco-alle-vigne","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Bruniolo","s":"bruniolo","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Ca Marcanda","s":"ca-marcanda","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Caccia Al Piano","s":"caccia-al-piano","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Campastrello I Socci","s":"campastrello-i-socci","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Campo Al Mare","s":"campo-al-mare","c":"Greve in Chianti","d":["Bolgheri"]},{"n":"Campo Al Noce","s":"campo-al-noce","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Campo Al Pero","s":"campo-al-pero","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Campo Alla Sughera","s":"campo-alla-sughera","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Campo Alle Comete","s":"campo-alle-comete","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Cantine Arioldi","s":"cantine-arioldi","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Castellaccio","s":"castellaccio","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Castello Di Bolgheri","s":"castello-di-bolgheri","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Ceralti","s":"ceralti","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Chiappini","s":"chiappini","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Cipriana","s":"cipriana","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Dario Di Vaira","s":"dario-di-vaira","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Donna Olimpia 1898","s":"donna-olimpia-1898","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Donne Fittipaldi","s":"donne-fittipaldi","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Emiliano Falsini","s":"emiliano-falsini","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Fabio Motta","s":"fabio-motta","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Fattoria Casa Di Terra Podere Roseto","s":"fattoria-casa-di-terra-podere-roseto","c":"","d":["Bolgheri"]},{"n":"Ferrari Iris Figli","s":"ferrari-iris-figli","c":"Cecina","d":["Bolgheri"]},{"n":"Fornacelle","s":"fornacelle","c":"San Gimignano","d":["Bolgheri"]},{"n":"Fratini","s":"fratini","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Giorgio Meletti Cavallari","s":"giorgio-meletti-cavallari","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Grattamacco","s":"grattamacco","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Guado Al Melo","s":"guado-al-melo","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"I Greppi","s":"i-greppi","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"I Luoghi","s":"i-luoghi","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"I Tirreni","s":"i-tirreni","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Il Fauno","s":"il-fauno","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Imperiale","s":"imperiale","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"La Bolgherese","s":"la-bolgherese","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"La Madonnina","s":"la-madonnina","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Lasorgiva","s":"lasorgiva","c":"","d":["Bolgheri"]},{"n":"Le Crocine","s":"le-crocine","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Le Grascete","s":"le-grascete","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Le Macchiole","s":"le-macchiole","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Le Novelire","s":"le-novelire","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Le Vigne Di Silvia","s":"le-vigne-di-silvia","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Michele Satta","s":"michele-satta","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Micheletti","s":"micheletti","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Mulini Di Segalari","s":"mulini-di-segalari","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Orma","s":"orma","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Ornellaia Masseto","s":"ornellaia-masseto","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Pietranova","s":"pietranova","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Podere 7","s":"podere-7","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Podere Arundineto","s":"podere-arundineto","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Podere Conca","s":"podere-conca","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Podere Dei Musi","s":"podere-dei-musi","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Podere Le Scuderie","s":"podere-le-scuderie","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Podere Prospero","s":"podere-prospero","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Podere Sapaio","s":"podere-sapaio","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Poggio Al Grillo","s":"poggio-al-grillo","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Poggio Al Tesoro","s":"poggio-al-tesoro","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Ruffino","s":"ruffino","c":"Pontassieve","d":["Bolgheri"]},{"n":"Santini Enrico","s":"santini-enrico","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Sensi","s":"sensi","c":"","d":["Bolgheri"]},{"n":"Serni Fulvio Luigi","s":"serni-fulvio-luigi","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Tenuta Campo Al Signore","s":"tenuta-campo-al-signore","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Tenuta Di Vaira","s":"tenuta-di-vaira","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Tenuta Guado Al Tasso","s":"tenuta-guado-al-tasso","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Tenuta Le Colonne","s":"tenuta-le-colonne","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Tenuta Meraviglia","s":"tenuta-meraviglia","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Tenuta San Guido","s":"tenuta-san-guido","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Tenuta Sant Agata","s":"tenuta-sant-agata","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Tenuta Sette Cieli","s":"tenuta-sette-cieli","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Terre Dei Ghelfi","s":"terre-dei-ghelfi","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Terre Del Marchesato","s":"terre-del-marchesato","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Terre Del Poeta","s":"terre-del-poeta","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Tripolaia","s":"tripolaia","c":"Castagneto Carducci","d":["Bolgheri"]},{"n":"Villanoviana","s":"villanoviana","c":"Castagneto Carducci","d":["Bolgheri"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
