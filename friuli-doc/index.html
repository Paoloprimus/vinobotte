<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Friuli DOC — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Friuli DOC</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Friuli DOC</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Antonutti","s":"antonutti","c":"Pasian di Prato","d":["Friuli DOC"]},{"n":"Attems","s":"attems","c":"Capriva del Friuli","d":["Friuli DOC"]},{"n":"Azienda Agricola Borgo delle Rose","s":"azienda-agricola-borgo-delle-rose","c":"Pordenone","d":["Friuli DOC"]},{"n":"Azienda Agricola Foffani","s":"azienda-agricola-foffani","c":"Trivignano Udinese","d":["Friuli DOC"]},{"n":"Azienda Agricola Midolini","s":"azienda-agricola-midolini","c":"Manzano","d":["Friuli DOC"]},{"n":"Baccichetto Vittorino","s":"baccichetto-vittorino","c":"Precenicco","d":["Friuli DOC"]},{"n":"Bagnarol Franco","s":"bagnarol-franco","c":"San Vito al Tagliamento","d":["Friuli DOC"]},{"n":"Bernava","s":"bernava","c":"Sesto al Reghena","d":["Friuli DOC"]},{"n":"Bollacasa Screm","s":"bollacasa-screm","c":"Azzano Decimo","d":["Friuli DOC"]},{"n":"Borgo Claudius","s":"borgo-claudius","c":"Trivignano Udinese","d":["Friuli DOC"]},{"n":"Bosco Albano","s":"bosco-albano","c":"Pasiano di Pordenone","d":["Friuli DOC"]},{"n":"Cabert","s":"cabert","c":"Bertiolo","d":["Friuli DOC"]},{"n":"Cantina Produttori Cormons","s":"cantina-produttori-cormons","c":"Cormons","d":["Friuli DOC"]},{"n":"Cantina Produttori di Ramuscello e San Vito","s":"cantina-produttori-di-ramuscello-e-san-vito","c":"Sesto al Reghena","d":["Friuli DOC"]},{"n":"Cantina Rauscedo","s":"cantina-rauscedo","c":"San Giorgio della Richinvelda","d":["Friuli DOC"]},{"n":"Casali Aurelia","s":"casali-aurelia","c":"Castions di Strada","d":["Friuli DOC"]},{"n":"Casato Bertoia","s":"bertoia-cesare","c":"Valvasone Arzene","d":["Friuli DOC"]},{"n":"Cason","s":"cason","c":"San Vito al Tagliamento","d":["Friuli DOC"]},{"n":"Ca’ Bolani","s":"ca-bolani","c":"Cervignano del Friuli","d":["Friuli DOC"]},{"n":"Ca’ di Volpe","s":"ca-di-volpe","c":"Ruda","d":["Friuli DOC"]},{"n":"Ca’ Selva","s":"ca-selva","c":"Sequals","d":["Friuli DOC"]},{"n":"Colutta Giorgio","s":"colutta-giorgio","c":"Manzano","d":["Friuli DOC"]},{"n":"De Lorenzi","s":"de-lorenzi","c":"Pravisdomini","d":["Friuli DOC"]},{"n":"De Munari","s":"de-munari","c":"San Vito al Tagliamento","d":["Friuli DOC"]},{"n":"De Puppi","s":"de-puppi","c":"Moimacco","d":["Friuli DOC"]},{"n":"Del Poggio","s":"del-poggio","c":"Fagagna","d":["Friuli DOC"]},{"n":"Della Valentina","s":"della-valentina","c":"Polcenigo","d":["Friuli DOC"]},{"n":"Di Lenardo","s":"di-lenardo","c":"Gonars","d":["Friuli DOC"]},{"n":"Eliso","s":"eliso","c":"Pocenia","d":["Friuli DOC"]},{"n":"Esedra","s":"esedra","c":"Bertiolo","d":["Friuli DOC"]},{"n":"Eudora","s":"eudora","c":"Udine","d":["Friuli DOC"]},{"n":"Fantinel","s":"fantinel","c":"Tauriano di Spilimbergo","d":["Friuli DOC"]},{"n":"Forchir","s":"forchir","c":"Camino al Tagliamento","d":["Friuli DOC"]},{"n":"Giavedoni Stroili","s":"giavedoni-stroili","c":"Camino al Tagliamento","d":["Friuli DOC"]},{"n":"Gigante","s":"gigante","c":"Corno di Rosazzo","d":["Friuli DOC"]},{"n":"Grossutti","s":"grossutti","c":"Bertiolo","d":["Friuli DOC"]},{"n":"I Magredi","s":"i-magredi","c":"San Giorgio della Richinvelda","d":["Friuli DOC"]},{"n":"Isola Augusta","s":"isola-augusta","c":"Palazzolo dello Stella","d":["Friuli DOC"]},{"n":"Jermann","s":"jermann","c":"Dolegna del Collio","d":["Friuli DOC"]},{"n":"Kurtin","s":"kurtin","c":"Cormons","d":["Friuli DOC"]},{"n":"La Fervida","s":"la-fervida","c":"Castions di Strada","d":["Friuli DOC"]},{"n":"La Sclusa","s":"la-sclusa","c":"Cividale del Friuli","d":["Friuli DOC"]},{"n":"La Selce","s":"la-selce","c":"Palazzolo dello Stella","d":["Friuli DOC"]},{"n":"Le Monde","s":"le-monde","c":"Prata di Pordenone","d":["Friuli DOC"]},{"n":"Lea","s":"lea","c":"San Vito al Tagliamento","d":["Friuli DOC"]},{"n":"Lorenzonetto Cav. Guido","s":"lorenzonetto","c":"Latisana","d":["Friuli DOC"]},{"n":"Marina","s":"marina","c":"San Giorgio della Richinvelda","d":["Friuli DOC"]},{"n":"Martellozzo","s":"martellozzo","c":"San Quirino","d":["Friuli DOC"]},{"n":"Miss Bio","s":"miss-bio","c":"San Vito al Tagliamento","d":["Friuli DOC"]},{"n":"Mister Bio","s":"mister-bio","c":"Latisana","d":["Friuli DOC"]},{"n":"Mulino delle Tolle","s":"mulino-delle-tolle","c":"Bagnaria Arsa","d":["Friuli DOC"]},{"n":"Obiz","s":"obiz","c":"Cervignano del Friuli","d":["Friuli DOC"]},{"n":"Pecol Boin","s":"pecol-boin","c":"Spilimbergo","d":["Friuli DOC"]},{"n":"Pighin","s":"pighin","c":"Pavia di Udine","d":["Friuli DOC"]},{"n":"Pitars","s":"pitars","c":"San Martino al Tagliamento","d":["Friuli DOC"]},{"n":"Pizzuto Gianpaolo","s":"pizzuto-gianpaolo","c":"San Vito al Tagliamento","d":["Friuli DOC"]},{"n":"Pradio","s":"pradio","c":"Bicinicco","d":["Friuli DOC"]},{"n":"Principi di Porcia","s":"principi-di-porcia","c":"Azzano Decimo","d":["Friuli DOC"]},{"n":"Puiatti","s":"puiatti","c":"Romans d'Isonzo","d":["Friuli DOC"]},{"n":"Reguta","s":"reguta","c":"Pocenia","d":["Friuli DOC"]},{"n":"Rosselli Verbi Rain","s":"rosselli-verbi-rain","c":"Ruda","d":["Friuli DOC"]},{"n":"Salvador Luca","s":"salvador-luca","c":"Valvasone Arzene","d":["Friuli DOC"]},{"n":"Sassonia","s":"sassonia","c":"San Martino al Tagliamento","d":["Friuli DOC"]},{"n":"Tenimenti Civa","s":"tenimenti-civa","c":"Povoletto","d":["Friuli DOC"]},{"n":"Tenuta Pribus","s":"tenuta-pribus","c":"Bagnaria Arsa","d":["Friuli DOC"]},{"n":"Terre dei Vignaj","s":"terre-dei-vignaj","c":"Talmassons","d":["Friuli DOC"]},{"n":"Terre di Ger","s":"terre-di-ger","c":"Pravisdomini","d":["Friuli DOC"]},{"n":"Valle","s":"valle","c":"Buttrio","d":["Friuli DOC"]},{"n":"Valpanera","s":"valpanera","c":"Villa Vicentina","d":["Friuli DOC"]},{"n":"Vendrame Vignis del Doge","s":"vendrame-vignis-del-doge","c":"Codroipo","d":["Friuli DOC"]},{"n":"Vignai da Duline","s":"vignai-da-duline","c":"San Giovanni al Natisone","d":["Friuli DOC"]},{"n":"Vigne Alsa","s":"vigne-alsa","c":"Talmassons","d":["Friuli DOC"]},{"n":"Vigneti Durandi","s":"vigneti-durandi","c":"Pasian di Prato","d":["Friuli DOC"]},{"n":"Vigneti Pietro Pittaro","s":"vigneti-pietro-pittaro","c":"Codroipo","d":["Friuli DOC"]},{"n":"Vini San Giorgio","s":"vini-san-giorgio","c":"San Giorgio della Richinvelda","d":["Friuli DOC"]},{"n":"Weldan","s":"weldan","c":"San Vito al Tagliamento","d":["Friuli DOC"]},{"n":"Zaglia Giorgio","s":"zaglia-giorgio","c":"Precenicco","d":["Friuli DOC"]},{"n":"Zamparo Renato","s":"zamparo-renato","c":"Premariacco","d":["Friuli DOC"]},{"n":"Zorzettig","s":"zorzettig","c":"Cividale del Friuli","d":["Friuli DOC"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
