<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Friuli DOC — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Friuli DOC</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Friuli DOC</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>

:"grossutti-friuli-doc","c":"Bertiolo","d":["Friuli DOC"]},{"n":"I Magredi","s":"i-magredi-friuli-doc","c":"San Giorgio della Richinvelda","d":["Friuli DOC"]},{"n":"Isola Augusta","s":"isola-augusta-friuli-doc","c":"Palazzolo dello Stella","d":["Friuli DOC"]},{"n":"Jermann","s":"jermann-friuli-doc","c":"Dolegna del Collio","d":["Friuli DOC"]},{"n":"Kurtin","s":"kurtin-friuli-doc","c":"Cormons","d":["Friuli DOC"]},{"n":"La Fervida","s":"la-fervida-friuli-doc","c":"Castions di Strada","d":["Friuli DOC"]},{"n":"La Noiosa","s":"la-noiosa-friuli-doc","c":"Portogruaro","d":["Friuli DOC"]},{"n":"La Sclusa","s":"la-sclusa-friuli-doc","c":"Cividale del Friuli","d":["Friuli DOC"]},{"n":"La Selce","s":"la-selce-friuli-doc","c":"Palazzolo dello Stella","d":["Friuli DOC"]},{"n":"Le Monde","s":"le-monde-friuli-doc","c":"Prata di Pordenone","d":["Friuli DOC"]},{"n":"Le Tenute del Leone Alato","s":"le-tenute-del-leone-alato-friuli-doc","c":"Annone Veneto","d":["Friuli DOC"]},{"n":"Lea","s":"lea-friuli-doc","c":"San Vito al Tagliamento","d":["Friuli DOC"]},{"n":"Levorato","s":"levorato-friuli-doc","c":"Dolo","d":["Friuli DOC"]},{"n":"Lorenzonetto Cav. Guido","s":"lorenzonetto-friuli-doc","c":"Latisana","d":["Friuli DOC"]},{"n":"Marina","s":"marina-friuli-doc","c":"San Giorgio della Richinvelda","d":["Friuli DOC"]},{"n":"Martellozzo","s":"martellozzo-friuli-doc","c":"San Quirino","d":["Friuli DOC"]},{"n":"Miss Bio","s":"miss-bio-friuli-doc","c":"San Vito al Tagliamento","d":["Friuli DOC"]},{"n":"Mister Bio","s":"mister-bio-friuli-doc","c":"Latisana","d":["Friuli DOC"]},{"n":"Mulino delle Tolle","s":"mulino-delle-tolle-friuli-doc","c":"Bagnaria Arsa","d":["Friuli DOC"]},{"n":"Obiz","s":"obiz-friuli-doc","c":"Cervignano del Friuli","d":["Friuli DOC"]},{"n":"Opitergium Vini","s":"opitergium-friuli-doc","c":"Oderzo","d":["Friuli DOC"]},{"n":"Paladin Giovanni","s":"paladin-friuli-doc","c":"Ormelle","d":["Friuli DOC"]},{"n":"Pecol Boin","s":"pecol-boin-friuli-doc","c":"Spilimbergo","d":["F s","d":["Friuli DOC"]},{"n":"Vigneti Durandi","s":"vigneti-durandi-friuli-doc","c":"Pasian di Prato","d":["Friuli DOC"]},{"n":"Vigneti Pittaro","s":"vigneti-pittaro-friuli-doc","c":"Codroipo","d":["Friuli DOC"]},{"n":"Villa Sandi","s":"villa-sandi-friuli-doc","c":"Crocetta del Montello","d":["Friuli DOC"]},{"n":"Vini San Giorgio","s":"vini-san-giorgio-friuli-doc","c":"San Giorgio della Richinvelda","d":["Friuli DOC"]},{"n":"Weldan","s":"weldan-friuli-doc","c":"San Vito al Tagliamento","d":["Friuli DOC"]},{"n":"Zaglia Giorgio","s":"zaglia-giorgio-friuli-doc","c":"Precenicco","d":["Friuli DOC"]},{"n":"Zamparo Renato","s":"zamparo-renato-friuli-doc","c":"Premariacco","d":["Friuli DOC"]},{"n":"Zonin","s":"zonin-friuli-doc","c":"Gambellara","d":["Friuli DOC"]},{"n":"Zorzettig","s":"zorzettig-friuli-doc","c":"Cividale del Friuli","d":["Friuli DOC"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
