<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Colli Tortonesi — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Colli Tortonesi</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Colli Tortonesi</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Alvio Pestarino","s":"alvio-pestarino","c":"Capriata D’Orba","d":["Colli Tortonesi"]},{"n":"Antichi Poderi La Boidina","s":"antichi-poderi-la-boidina-s-a-s-agr","c":"Fontanile","d":["Colli Tortonesi"]},{"n":"Borgo di Castellania","s":"borgo-di-castellania","c":"Castellania","d":["Colli Tortonesi"]},{"n":"Boveri Luigi","s":"boveri-luigi","c":"Costa Vescovato","d":["Colli Tortonesi"]},{"n":"Broglia","s":"broglia","c":"Gavi","d":["Colli Tortonesi"]},{"n":"Bruno Maurizio","s":"bruno-maurizio","c":"Monleale","d":["Colli Tortonesi"]},{"n":"Cantina di Tortona","s":"cantina-di-tortona","c":"Tortona","d":["Colli Tortonesi"]},{"n":"Cascina Bandiera","s":"cascina-bandiera","c":"San Sebastiano Curone","d":["Colli Tortonesi"]},{"n":"Cascina Giambolino","s":"cascina-giambolino","c":"Carbonara Scrivia -","d":["Colli Tortonesi"]},{"n":"Cascina La Ghersa","s":"cascina-la-ghersa","c":"Moasca","d":["Colli Tortonesi"]},{"n":"Cascina Montagnola","s":"cascina-montagnola","c":"Viguzzolo","d":["Colli Tortonesi"]},{"n":"Cascina Salicetti","s":"cascina-salicetti","c":"Montegioco","d":["Colli Tortonesi"]},{"n":"Davico Stefano Wines","s":"davico-stefano-wines","c":"Montemarzino","d":["Colli Tortonesi"]},{"n":"De Marco Giovanni","s":"de-marco-giovanni","c":"Carpeneto","d":["Colli Tortonesi"]},{"n":"Ezio Poggio Winery","s":"ezio-poggio-winery","c":"Vignole Borbera","d":["Colli Tortonesi"]},{"n":"Fiordaliso","s":"fiordaliso","c":"Volpeglino","d":["Colli Tortonesi"]},{"n":"Fontanalbina","s":"fontanalbina","c":"Sarezzano","d":["Colli Tortonesi"]},{"n":"Guasti Clemente & Figli","s":"guasti-clemente-figli","c":"Nizza Monferrato","d":["Colli Tortonesi"]},{"n":"I Carpini","s":"i-carpini","c":"Pozzol Groppo","d":["Colli Tortonesi"]},{"n":"La Mesma","s":"la-mesma","c":"Novi Ligure","d":["Colli Tortonesi"]},{"n":"La Morella","s":"la-morella","c":"Carezzano","d":["Colli Tortonesi"]},{"n":"La Sparsa","s":"la-sparsa","c":"Sant’Agata Fossili","d":["Colli Tortonesi"]},{"n":"La Stellara","s":"la-stellara","c":"Volpedo","d":["Colli Tortonesi"]},{"n":"La Vecchia Posta","s":"la-vecchia-posta","c":"Avolasca","d":["Colli Tortonesi"]},{"n":"Le Praie","s":"le-praie","c":"Casasco","d":["Colli Tortonesi"]},{"n":"Luca Canevaro","s":"luca-canevaro","c":"Avolasca","d":["Colli Tortonesi"]},{"n":"Marchesi Alfieri","s":"marchesi-alfieri","c":"San Martino Alfieri","d":["Colli Tortonesi"]},{"n":"Marina Coppi","s":"marina-coppi","c":"Castelania","d":["Colli Tortonesi"]},{"n":"Mariotto Claudio","s":"mariotto-claudio","c":"Tortona","d":["Colli Tortonesi"]},{"n":"Mombisaggio","s":"az-agr-mombisaggio","c":"Tortona","d":["Colli Tortonesi"]},{"n":"Nebraie","s":"nebraie","c":"Rocchetta Ligure","d":["Colli Tortonesi"]},{"n":"Oltretorrente","s":"oltretorrente","c":"Paderna","d":["Colli Tortonesi"]},{"n":"Poderi Cusmano","s":"poderi-cusmano","c":"San Marzano Oliveto","d":["Colli Tortonesi"]},{"n":"Pomodolce","s":"pomodolce","c":"Montemarzino","d":["Colli Tortonesi"]},{"n":"Renato Boveri Vignaiolo","s":"renato-boveri-vignaiolo","c":"Monleale","d":["Colli Tortonesi"]},{"n":"Sassaia","s":"sassaia","c":"Capriata d’Orba","d":["Colli Tortonesi"]},{"n":"Sassobraglia","s":"sassobraglia","c":"Rocchetta Ligure","d":["Colli Tortonesi"]},{"n":"Spaccapietra","s":"spaccapietra","c":"Avolasca","d":["Colli Tortonesi"]},{"n":"Tenuta della Cascinassa","s":"tenuta-della-cascinassa","c":"Alessandria","d":["Colli Tortonesi"]},{"n":"Tenuta Garetto","s":"tenuta-garetto","c":"Agliano Terme","d":["Colli Tortonesi"]},{"n":"Terre di Sarizzola","s":"terre-di-sarizzola","c":"Costa Vescovato","d":["Colli Tortonesi"]},{"n":"Tirelli Andrea","s":"tirelli-andrea","c":"Costa Vescovato","d":["Colli Tortonesi"]},{"n":"Valli Unite","s":"valli-unite","c":"Costa Vescovato","d":["Colli Tortonesi"]},{"n":"Vigneti Boveri Giacomo","s":"vigneti-boveri-giacomo","c":"Costa Vescovato","d":["Colli Tortonesi"]},{"n":"Vigneti Repetto","s":"vigneti-repetto","c":"Sarezzano","d":["Colli Tortonesi"]},{"n":"Villa Cerruti","s":"villa-cerruti","c":"Avolasca","d":["Colli Tortonesi"]},{"n":"Vite Colte","s":"vite-colte","c":"Barolo","d":["Colli Tortonesi"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
