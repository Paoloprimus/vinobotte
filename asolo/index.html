<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Asolo Montello — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Asolo Montello</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Asolo Montello</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Ager Patris","s":"ager-patris-asolo","c":"Montebelluna","d":["Asolo Montello"]},{"n":"Agnoletti Ida","s":"agnoletti-ida-asolo","c":"Volpago del Montello","d":["Asolo Montello"]},{"n":"Al Pioggio","s":"al-pioggio-asolo","c":"Castelcucco","d":["Asolo Montello"]},{"n":"Altea","s":"altea-asolo","c":"Montebelluna","d":["Asolo Montello"]},{"n":"Andreola","s":"andreola-asolo","c":"Farra di Soligo","d":["Asolo Montello"]},{"n":"Asolo Manor","s":"asolo-manor-asolo","c":"Asolo","d":["Asolo Montello"]},{"n":"Astoria Vini","s":"astoria-vini-asolo","c":"Refrontolo","d":["Asolo Montello"]},{"n":"Barchessa Loredan","s":"barchessa-loredan-asolo","c":"Volpago del Montello","d":["Asolo Montello"]},{"n":"Bedin – Colli Asolani","s":"bedin-colli-asolani-asolo","c":"Cornuda","d":["Asolo Montello"]},{"n":"Bele Casel","s":"bele-casel-asolo","c":"Caerano San Marco","d":["Asolo Montello"]},{"n":"Bianchin","s":"bianchin-asolo","c":"Montebelluna","d":["Asolo Montello"]},{"n":"Bogana Vini","s":"bogana-vini-asolo","c":"Pederobba","d":["Asolo Montello"]},{"n":"Borgo Molino Vigne & Vini","s":"borgo-molino-vigne-vini-asolo","c":"Ormelle","d":["Asolo Montello"]},{"n":"Botter","s":"botter-asolo","c":"Fossalta di Piave","d":["Asolo Montello"]},{"n":"Bresolin-bio","s":"bresolin-bio-asolo","c":"Maser","d":["Asolo Montello"]},{"n":"Ca' del Bolé","s":"ca-del-bole-asolo","c":"Giavera del Montello","d":["Asolo Montello"]},{"n":"Ca' Zen","s":"ca-zen-asolo","c":"Asolo","d":["Asolo Montello"]},{"n":"Callegari Roberto","s":"callegari-roberto-asolo","c":"Nervesa della Battaglia","d":["Asolo Montello"]},{"n":"Cantina Colli del Soligo","s":"cantina-colli-del-soligo-asolo","c":"Pieve di Soligo","d":["Asolo Montello"]},{"n":"Cantina Sociale Gambellara","s":"cantina-sociale-gambellara-asolo","c":"Gambellara","d":["Asolo Montello"]},{"n":"Cantina Sociale Montelliana e dei Colli Asolani","s":"cantina-sociale-montelliana-e-dei-colli-asolani-asolo","c":"Montebelluna","d":["Asolo Montello"]},{"n":"Cantina Valbreda","s":"cantina-valbreda-asolo","c":"Asolo","d":["Asolo Montello"]},{"n":"Casa Bianca Spumanti","s":"casa-bianca-spumanti-asolo","c":"Volpago del Montello","d":["Asolo Montello"]},{"n":"Case Paolin","s":"case-paolin-asolo","c":"Volpago del Montello","d":["Asolo Montello"]},{"n":"Cavaliere Damiano","s":"cavaliere-damiano-asolo","c":"Asolo","d":["Asolo Montello"]},{"n":"Cima del Pomer","s":"cima-del-pomer-asolo","c":"Monfumo","d":["Asolo Montello"]},{"n":"Cirotto","s":"cirotto-asolo","c":"Asolo","d":["Asolo Montello"]},{"n":"Colmello – Pat del Colmèl","s":"colmello-pat-del-colmel-asolo","c":"Castelcucco","d":["Asolo Montello"]},{"n":"Commendator Pozzobon","s":"commendator-pozzobon-asolo","c":"Volpago del Montello","d":["Asolo Montello"]},{"n":"Conte Loredan Gasparini","s":"conte-loredan-gasparini-asolo","c":"Volpago del Montello","d":["Asolo Montello"]},{"n":"Dal Bello Antonio","s":"dal-bello-antonio-asolo","c":"Fonte","d":["Asolo Montello"]},{"n":"Domus Vini","s":"domus-vini-asolo","c":"Trebaseleghe","d":["Asolo Montello"]},{"n":"Durante Mauro","s":"durante-mauro-asolo","c":"Pederobba","d":["Asolo Montello"]},{"n":"Elis","s":"elis-asolo","c":"Segusino","d":["Asolo Montello"]},{"n":"Fiorotto 1934","s":"fiorotto-1934-asolo","c":"Nervesa della Battaglia","d":["Asolo Montello"]},{"n":"Ghisolana","s":"ghisolana-asolo","c":"Monfumo","d":["Asolo Montello"]},{"n":"Giusti Wine","s":"giusti-wine-asolo","c":"Nervesa della Battaglia","d":["Asolo Montello"]},{"n":"I 5inque","s":"i-5inque-asolo","c":"Maser","d":["Asolo Montello"]},{"n":"La Caneva dei Biasio di V. Porcellato & C","s":"la-caneva-dei-biasio-di-v-porcellato-c-asolo","c":"Riese Pio X","d":["Asolo Montello"]},{"n":"La Tordera","s":"la-tordera-asolo","c":"Vidor","d":["Asolo Montello"]},{"n":"Le Risere","s":"le-risere-asolo","c":"Borso del Grappa","d":["Asolo Montello"]},{"n":"Le Rive","s":"le-rive-asolo","c":"Vidor","d":["Asolo Montello"]},{"n":"Luvit & Lumoè","s":"luvit-e-lumoe-asolo","c":"Borso del Grappa","d":["Asolo Montello"]},{"n":"Martignago – Vignaioli","s":"martignago-vignaioli-asolo","c":"Maser","d":["Asolo Montello"]},{"n":"Merlo","s":"merlo-asolo","c":"Cavaso del Tomba","d":["Asolo Montello"]},{"n":"Montelvini","s":"montelvini-asolo","c":"Volpago del Montello","d":["Asolo Montello"]},{"n":"Oasi dei Frati","s":"oasi-dei-frati-asolo","c":"Nervesa della Battaglia","d":["Asolo Montello"]},{"n":"Osservatorio del Re","s":"osservatorio-del-re-asolo","c":"","d":["Asolo Montello"]},{"n":"Pari Wine","s":"pari-wine-asolo","c":"Asolo","d":["Asolo Montello"]},{"n":"Perlage","s":"perlage-asolo","c":"Farra di Soligo","d":["Asolo Montello"]},{"n":"Podere Cunial – Riva Beata","s":"podere-cunial-riva-beata-asolo","c":"Cavaso del Tomba","d":["Asolo Montello"]},{"n":"Progress Country Wine","s":"progress-country-wine-asolo","c":"Asolo","d":["Asolo Montello"]},{"n":"Rebuli Angelo & Figli","s":"rebuli-angelo-figli-asolo","c":"Valdobbiadene","d":["Asolo Montello"]},{"n":"Rive della Chiesa","s":"rive-della-chiesa-asolo","c":"Volpago del Montello","d":["Asolo Montello"]},{"n":"San Simone","s":"san-simone-asolo","c":"Porcia","d":["Asolo Montello"]},{"n":"San Vettor","s":"san-vettor-asolo","c":"Cavaso del Tomba","d":["Asolo Montello"]},{"n":"Sandrin","s":"sandrin-asolo","c":"Valdobbiadene","d":["Asolo Montello"]},{"n":"Sartor Emilio","s":"sartor-emilio-asolo","c":"Volpago del Montello","d":["Asolo Montello"]},{"n":"Sorelle Ghirardello","s":"sorelle-ghirardello-asolo","c":"San Zenone degli Ezzelini","d":["Asolo Montello"]},{"n":"Tenuta Amadio","s":"tenuta-amadio-asolo","c":"Monfumo","d":["Asolo Montello"]},{"n":"Tenuta Baron Winery","s":"tenuta-baron-winery-asolo","c":"Fonte","d":["Asolo Montello"]},{"n":"Tenuta Castaldo","s":"tenuta-castaldo-asolo","c":"Cornuda","d":["Asolo Montello"]},{"n":"Tenuta Costeselle","s":"tenuta-costeselle-asolo","c":"Castelcucco","d":["Asolo Montello"]},{"n":"Tenuta Dalla Francesca","s":"tenuta-dalla-francesca-asolo","c":"Valdobbiadene","d":["Asolo Montello"]},{"n":"Tenuta La Carpena","s":"tenuta-la-carpena-asolo","c":"Castelcucco","d":["Asolo Montello"]},{"n":"Tenute Balzan","s":"tenute-balzan-asolo","c":"Cornuda","d":["Asolo Montello"]},{"n":"Val d’Oca","s":"val-d-oca-asolo","c":"Valdobbiadene","d":["Asolo Montello"]},{"n":"Verdi Terre di Ciane","s":"verdi-terre-di-ciane-asolo","c":"Crocetta del Montello","d":["Asolo Montello"]},{"n":"Vigna del Pendio – Venetian Hills","s":"vigna-del-pendio-venetian-hills-asolo","c":"","d":["Asolo Montello"]},{"n":"Vigna Rampante","s":"vigna-rampante-asolo","c":"Nervesa della Battaglia","d":["Asolo Montello"]},{"n":"Vigna Sinque Majo","s":"vigna-sinque-majo-asolo","c":"Pederobba","d":["Asolo Montello"]},{"n":"Vigneti Mazzarolo","s":"vigneti-mazzarolo-asolo","c":"Maser","d":["Asolo Montello"]},{"n":"Villa di Maser","s":"villa-di-maser-asolo","c":"Maser","d":["Asolo Montello"]},{"n":"Villa Giustiniani","s":"villa-giustiniani-asolo","c":"Spresiano","d":["Asolo Montello"]},{"n":"Villa Luisa Francesca","s":"villa-luisa-francesca-asolo","c":"Montebelluna","d":["Asolo Montello"]},{"n":"Villa Sandi","s":"villa-sandi-asolo","c":"Crocetta del Montello","d":["Asolo Montello"]},{"n":"Vini Costa","s":"vini-costa-asolo","c":"Montebelluna","d":["Asolo Montello"]},{"n":"Vini Leterre","s":"vini-leterre-asolo","c":"Pederobba","d":["Asolo Montello"]},{"n":"Vini Meridiana","s":"vini-meridiana-asolo","c":"Castelfranco Veneto","d":["Asolo Montello"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
