<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Marsala — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Marsala</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Marsala</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Alagna Vini","s":"alagna-vini","c":"Marsala","d":["Marsala"]},{"n":"Anabasis","s":"anabasis","c":"Marsala","d":["Marsala"]},{"n":"Assuli","s":"assuli","c":"Mazara del Vallo","d":["Marsala"]},{"n":"Baglio Aimone","s":"baglio-aimone","c":"Petrosino","d":["Marsala"]},{"n":"Baglio Donnafranca","s":"baglio-donnafranca","c":"Marsala","d":["Marsala"]},{"n":"Baglio Oro","s":"baglio-oro","c":"Marsala","d":["Marsala"]},{"n":"Barraco","s":"barraco","c":"Marsala","d":["Marsala"]},{"n":"Cantina Chitarra","s":"cantina-chitarra","c":"Marsala","d":["Marsala"]},{"n":"Cantine Birgi","s":"cantine-birgi","c":"Marsala","d":["Marsala"]},{"n":"Cantine Florio","s":"cantine-florio","c":"Marsala","d":["Marsala"]},{"n":"Cantine Giglio","s":"cantine-giglio","c":"Mazara del Vallo","d":["Marsala"]},{"n":"Cantine Mothia","s":"cantine-mothia","c":"Marsala","d":["Marsala"]},{"n":"Cantine Paolini","s":"cantine-paolini","c":"Marsala","d":["Marsala"]},{"n":"Cantine Pellegrino","s":"cantine-pellegrino","c":"Marsala","d":["Marsala"]},{"n":"Cantine Rallo","s":"cantine-rallo","c":"Marsala","d":["Marsala"]},{"n":"Caruso & Minini","s":"caruso-minini","c":"Marsala","d":["Marsala"]},{"n":"Caruso e Minini","s":"caruso-e-minini","c":"Marsala","d":["Marsala"]},{"n":"Casa Vinicola Arini","s":"casa-vinicola-arini","c":"Marsala","d":["Marsala"]},{"n":"Casano","s":"casano","c":"Marsala","d":["Marsala"]},{"n":"Colomba Bianca","s":"colomba-bianca","c":"Mazara del Vallo","d":["Marsala"]},{"n":"Curatolo Arini 1875","s":"curatolo-arini-1875","c":"Marsala","d":["Marsala"]},{"n":"Donnafugata","s":"donnafugata","c":"Marsala","d":["Marsala"]},{"n":"Duca di Salaparuta","s":"duca-di-salaparuta","c":"Marsala","d":["Marsala"]},{"n":"Fina Cantine","s":"fina-cantine","c":"Marsala","d":["Marsala"]},{"n":"Flavia","s":"flavia","c":"Marsala","d":["Marsala"]},{"n":"Foraci","s":"foraci","c":"Mazara del Vallo","d":["Marsala"]},{"n":"Frazzitta","s":"frazzitta","c":"Marsala","d":["Marsala"]},{"n":"Gazzerosse","s":"gazzerosse","c":"Mazara del Vallo","d":["Marsala"]},{"n":"Gorghi Tondi","s":"gorghi-tondi","c":"Marsala","d":["Marsala"]},{"n":"Marino Abate","s":"marino-abate","c":"Marsala","d":["Marsala"]},{"n":"Martinez","s":"martinez","c":"Marsala","d":["Marsala"]},{"n":"Pomilia Calamia","s":"pomilia-calamia","c":"Marsala","d":["Marsala"]},{"n":"Rallo Azienda Agricola","s":"rallo-azienda-agricola","c":"Marsala","d":["Marsala"]},{"n":"Sibiliana Vini","s":"sibiliana-vini","c":"Marsala","d":["Marsala"]},{"n":"Sibiliana Vini","s":"sibiliana-vini-marsala","c":"Marsala","d":["Marsala"]},{"n":"Vinci Vini","s":"vinci-vini","c":"Marsala","d":["Marsala"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
