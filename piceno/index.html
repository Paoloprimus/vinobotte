<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Ascoli, Offida e Rosso Piceno — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Ascoli, Offida e Rosso Piceno</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Ascoli, Offida e Rosso Piceno</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Agricola Lanciani","s":"agricola-lanciani","c":"Montefiore dell'Aso","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Aurora","s":"aurora","c":"Offida","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Azienda Agricola Fiorano","s":"azienda-agricola-fiorano","c":"Cossignano","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Cameli Irene","s":"cameli-irene","c":"Castorano","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Cantina Corrado","s":"cantina-corrado","c":"Acquaviva Picena","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Cantina d'Angelo","s":"cantina-d-angelo","c":"Offida","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Cantina il Sapore Della Luna","s":"cantina-il-sapore-della-luna","c":"Monteprandone","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Cantina Numa","s":"cantina-numa","c":"Ripatransone","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Cantina Valdaso","s":"cantina-valdaso","c":"Montalto delle Marche","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Cantine Capecci","s":"cantine-capecci","c":"Acquaviva Picena","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Cantine d'Ercoli","s":"cantine-d-ercoli","c":"Cossignano","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Cantine di Castignano","s":"cantine-di-castignano","c":"Castignano","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Cardocchia","s":"cardocchia","c":"Montedinove","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Centanni","s":"centanni","c":"Montefiore dell'Aso","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Cherri d'Acquaviva","s":"cherri-d-acquaviva","c":"Acquaviva Picena","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Cocci Grifoni","s":"cocci-grifoni","c":"Ripatransone","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Colli Ripani","s":"colli-ripani","c":"Ripatransone","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Damiani","s":"damiani","c":"Ripatransone","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"De Angelis","s":"de-angelis","c":"Castel di Lama","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Dianetti","s":"dianetti","c":"Carassai","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Domodimonti","s":"domodimonti","c":"Montefiore dell'Aso","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Il Conte Villa Prandone","s":"il-conte-villa-prandone","c":"Monteprandone","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"La Fontursia","s":"la-fontursia","c":"Ripatransone","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"La Torre del Nano","s":"la-torre-del-nano","c":"Offida","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"La Valle del Sole","s":"la-valle-del-sole","c":"Offida","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"La Vite Maritata","s":"la-vite-maritata","c":"Ripatransone","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Le Caniette","s":"le-caniette","c":"Ripatransone","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Le Cantine di Figaro","s":"le-cantine-di-figaro","c":"Ripatransone","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Le Casette","s":"le-casette","c":"Rotella","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Pantaleone","s":"pantaleone","c":"Ascoli Piceno","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Poderi San Lazzaro","s":"poderi-san-lazzaro","c":"Offida","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"RipaWine","s":"ripawine","c":"Ripatransone","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Rocca di Castiglioni","s":"rocca-di-castiglioni","c":"Castignano","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Saladini Pilastri","s":"saladini-pilastri","c":"Spinetoli","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"San Michele a Ripa","s":"san-michele-a-ripa","c":"Ripatransone","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Sangiovanni","s":"sangiovanni","c":"Offida","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Seghetti Panichi","s":"seghetti-panichi","c":"Castel di Lama","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Società Agricola Maroni","s":"societa-agricola-maroni","c":"Acquaviva Picena","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Tenuta Colle del Giglio","s":"tenuta-colle-del-giglio","c":"Ripatransone","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Tenuta Santori","s":"tenuta-santori","c":"Ripatransone","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Tenute del Borgo","s":"tenute-del-borgo","c":"Cossignano","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Tenute Polini","s":"tenute-polini","c":"Carassai","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Terra Argillosa","s":"terra-argillosa","c":"Offida","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Terre d'Arengo","s":"terre-d-arengo","c":"Appignano del Tronto","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Valter Mattoni","s":"valter-mattoni","c":"Castorano","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Velenosi","s":"velenosi","c":"Ascoli Piceno","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Vigneti Vallorani","s":"vigneti-vallorani","c":"Colli del Tronto","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Villa Imperium","s":"villa-imperium","c":"Ripatransone","d":["Ascoli, Offida e Rosso Piceno"]},{"n":"Villa Pigna","s":"villa-pigna","c":"Offida","d":["Ascoli, Offida e Rosso Piceno"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
