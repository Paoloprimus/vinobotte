<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Lessini Durello — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <div class="top"><a href="/">VinoBotte</a></div>
    <h1>Produttori vini Lessini Durello</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Lessini Durello</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Bellaguardia","s":"bellaguardia-durello","c":"Montecchio Maggiore","d":[]},{"n":"Cadis 1898","s":"cadis-1898-durello","c":"Soave","d":["Lessini Durello"]},{"n":"Cantina Danese","s":"cantina-danese-durello","c":"Roncà","d":["Lessini Durello"]},{"n":"Cantina di Monteforte","s":"cantina-di-monteforte-durello","c":"Monteforte d’Alpone","d":["Lessini Durello"]},{"n":"Cantina Marti","s":"cantina-marti-durello","c":"Montecchia di Crosara","d":[]},{"n":"Cantine Riondo","s":"cantine-riondo-durello","c":"Monteforte d’Alpone","d":[]},{"n":"Casa Cecchin","s":"casa-cecchin-durello","c":"Montebello Vicentino","d":[]},{"n":"Casa Vinicola Bennati","s":"casa-vinicola-bennati-durello","c":"Cazzano di Tramigna","d":["Lessini Durello"]},{"n":"Casarotto","s":"casarotto-durello","c":"Montecchia di Crosara","d":["Lessini Durello"]},{"n":"Cavazza","s":"cavazza-durello","c":"Montebello Vicentino","d":["Lessini Durello"]},{"n":"Collis Veneto Wine Group","s":"collis-veneto-wine-group-durello","c":"Monteforte d’Alpone","d":[]},{"n":"Corte Moschina","s":"corte-moschina-durello","c":"Roncà","d":["Lessini Durello"]},{"n":"Dal Cero Family","s":"dal-cero-family-durello","c":"Roncà","d":["Lessini Durello"]},{"n":"Dal Maso","s":"dal-maso-durello","c":"","d":[]},{"n":"Enoitalia","s":"enoitalia-durello","c":"San Martino Buon Albergo","d":[]},{"n":"Family of Wine","s":"family-of-wine-durello","c":"Roncà","d":[]},{"n":"Fattori","s":"fattori-durello","c":"Roncà","d":["Lessini Durello"]},{"n":"Fongaro","s":"fongaro-durello","c":"","d":[]},{"n":"Franchetto","s":"franchetto-durello","c":"Roncà","d":["Lessini Durello"]},{"n":"Giannitessari","s":"giannitessari-durello","c":"Roncà","d":["Lessini Durello"]},{"n":"Maltraversi","s":"maltraversi-durello","c":"San Giovanni Ilarione","d":["Lessini Durello"]},{"n":"Marcazzan Fabio","s":"marcazzan-fabio-durello","c":"","d":[]},{"n":"Masari","s":"masari-durello","c":"","d":[]},{"n":"Monte Zovo","s":"monte-zovo-durello","c":"Caprino Veronese","d":["Lessini Durello"]},{"n":"Montecrocetta","s":"montecrocetta-durello","c":"","d":[]},{"n":"Sacramundi","s":"sacramundi-durello","c":"","d":[]},{"n":"Sandro De Bruno","s":"sandro-de-bruno-durello","c":"Montecchia di Crosara","d":["Lessini Durello"]},{"n":"Tamaduoli","s":"tamaduoli-durello","c":"Gambellara","d":[]},{"n":"Tenuta Maule","s":"tenuta-maule-durello","c":"","d":[]},{"n":"Tenuta Natalina Grandi","s":"tenuta-natalina-grandi-durello","c":"Gambellara","d":["Lessini Durello"]},{"n":"Tirapelle Nicola (Vini SCIC)","s":"tirapelle-nicola-durello","c":"Roncà","d":[]},{"n":"Tonello","s":"tonello-durello","c":"","d":[]},{"n":"Valpantena Wines","s":"valpantena-wines-durello","c":"Verona","d":[]},{"n":"Vitevis","s":"vitevis-durello","c":"Montecchio Maggiore","d":["Lessini Durello"]},{"n":"Zambon","s":"zambon-durello","c":"","d":[]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    </body>
    </html>
