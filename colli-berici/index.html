<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Colli Berici — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Colli Berici</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Colli Berici</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"Azienda Agricola Costalunga","s":"azienda-agricola-costalunga","c":"Castegnero","d":["Colli Berici"]},{"n":"Bericanto","s":"bericanto","c":"Montorso Vicentino","d":["Colli Berici"]},{"n":"Cadis 1898","s":"cadis-1898","c":"Soave","d":["Colli Berici"]},{"n":"Cantina Mattiello","s":"cantina-mattiello","c":"Longare","d":["Colli Berici"]},{"n":"Cantina Sociale Gambellara","s":"cantina-sociale-gambellara","c":"Gambellara","d":["Colli Berici"]},{"n":"Cantine dei Colli Berici","s":"cantine-dei-colli-berici","c":"Lonigo","d":["Colli Berici"]},{"n":"Cavazza","s":"cavazza","c":"Montebello Vicentino","d":["Colli Berici"]},{"n":"Cielo e Terra","s":"cielo-e-terra","c":"Montorso Vicentino","d":["Colli Berici"]},{"n":"Corte De Pieri","s":"corte-de-pieri","c":"Lonigo","d":["Colli Berici"]},{"n":"Corte Moschina","s":"corte-moschina","c":"Roncà","d":["Colli Berici"]},{"n":"Cà Basso","s":"ca-basso","c":"Longare","d":["Colli Berici"]},{"n":"Cà Duso","s":"ca-duso","c":"Costabissara","d":["Colli Berici"]},{"n":"da Sagraro","s":"da-sagraro","c":"Barbarano Mossano","d":["Colli Berici"]},{"n":"Dal Maso","s":"dal-maso","c":"","d":["Colli Berici"]},{"n":"del Rèbene","s":"del-rebene","c":"Zovencedo","d":["Colli Berici"]},{"n":"Faltracco Vini","s":"faltracco-vini","c":"Lerino di Torri di Quartesolo","d":["Colli Berici"]},{"n":"Family of Wine","s":"family-of-wine","c":"Roncà","d":["Colli Berici"]},{"n":"Fattoria Le Vegra","s":"fattoria-le-vegra","c":"Arcugnano","d":["Colli Berici"]},{"n":"Giannitessari","s":"giannitessari","c":"Roncà","d":["Colli Berici"]},{"n":"Inama","s":"inama","c":"San Bonifacio","d":["Colli Berici"]},{"n":"Indomiti Vini","s":"indomiti-vini","c":"Vicenza","d":["Colli Berici"]},{"n":"L'Albara","s":"l-albara","c":"Castegnero","d":["Colli Berici"]},{"n":"Le Pignole","s":"le-pignole","c":"Brendola","d":["Colli Berici"]},{"n":"Muraro 952","s":"muraro-952","c":"Longare","d":["Colli Berici"]},{"n":"Murassi","s":"murassi","c":"Lonigo","d":["Colli Berici"]},{"n":"Pegoraro","s":"pegoraro","c":"Barbarano Mossano","d":["Colli Berici"]},{"n":"Pialli Vini","s":"pialli-vini","c":"Barbarano Vicentino","d":["Colli Berici"]},{"n":"Piovene Porto Godi","s":"piovene-porto-godi","c":"Toara Di Villaga","d":["Colli Berici"]},{"n":"PuntoZero","s":"puntozero","c":"Lonigo","d":["Colli Berici"]},{"n":"Revini","s":"revini","c":"Cervarese Santa Croce","d":["Colli Berici"]},{"n":"Tenuta Maule","s":"tenuta-maule","c":"","d":["Colli Berici"]},{"n":"Tenuta Zai","s":"tenuta-zai","c":"Alonte","d":["Colli Berici"]},{"n":"Villa Montruglio","s":"villa-montruglio","c":"Barbarano Mossano","d":["Colli Berici"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>
    </body>
    </html>
