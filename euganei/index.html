<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Colli Euganei — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <h1>Produttori vini Colli Euganei</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Colli Euganei</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"A.R.A. dei F.lli Trentin","s":"a-r-a-dei-f-lli-trentin","c":"Arquà Petrarca","d":["Colli Euganei"]},{"n":"Abbazia di Praglia","s":"abbazia-di-praglia","c":"Teolo","d":["Colli Euganei"]},{"n":"Acino Rosso","s":"acino-rosso","c":"Vo'","d":["Colli Euganei"]},{"n":"Ai Molini","s":"ai-molini","c":"Vo'","d":["Colli Euganei"]},{"n":"Alla Campagnola","s":"alla-campagnola","c":"Vo'","d":["Colli Euganei"]},{"n":"Alla Fonte","s":"alla-fonte","c":"Este","d":["Colli Euganei"]},{"n":"Ambrosi Francesco","s":"ambrosi-francesco","c":"Vo'","d":["Colli Euganei"]},{"n":"Ambrosi Sergio","s":"ambrosi-sergio","c":"Vo'","d":["Colli Euganei"]},{"n":"Azienda Agricola Ca’ Lustra","s":"azienda-agricola-ca-lustra","c":"Cinto Euganeo","d":["Colli Euganei"]},{"n":"Azienda Agricola Strazzacappa Gianni","s":"azienda-agricola-strazzacappa-gianni","c":"Vò","d":["Colli Euganei"]},{"n":"Azienda Le Forche","s":"azienda-le-forche","c":"Arquà Petrarca","d":["Colli Euganei"]},{"n":"Bacco e Arianna","s":"bacco-e-arianna","c":"Vo'","d":["Colli Euganei"]},{"n":"Beldomando delle Boschette","s":"beldomando-delle-boschette","c":"Torreglia","d":["Colli Euganei"]},{"n":"Belvedere","s":"belvedere","c":"Rovolon","d":["Colli Euganei"]},{"n":"Borin “Vini & Vigne”","s":"borin-vini-vigne","c":"Monselice","d":["Colli Euganei"]},{"n":"Bressan Lucio","s":"bressan-lucio","c":"Vo'","d":["Colli Euganei"]},{"n":"Bressanin Loris","s":"bressanin-loris","c":"Arquà Petrarca","d":["Colli Euganei"]},{"n":"Ca' Bianca","s":"ca-bianca","c":"Cinto Euganeo","d":["Colli Euganei"]},{"n":"Ca' del Colle","s":"ca-del-colle","c":"Vo'","d":["Colli Euganei"]},{"n":"Ca' della Vigna","s":"ca-della-vigna","c":"Selvazzano Dentro","d":["Colli Euganei"]},{"n":"Ca' Ferri","s":"ca-ferri","c":"Padova","d":["Colli Euganei"]},{"n":"Ca' Ferro","s":"ca-ferro","c":"Vo'","d":["Colli Euganei"]},{"n":"Ca' Manin","s":"ca-manin","c":"Vo'","d":["Colli Euganei"]},{"n":"Ca' Orologio","s":"ca-orologio","c":"Baone","d":["Colli Euganei"]},{"n":"Ca' Paruta","s":"ca-paruta","c":"Vo'","d":["Colli Euganei"]},{"n":"Calaon Paolo","s":"calaon-paolo","c":"Vo'","d":["Colli Euganei"]},{"n":"Cantina Benato","s":"cantina-benato","c":"Vo'","d":["Colli Euganei"]},{"n":"Cantina Colli Euganei","s":"cantina-colli-euganei","c":"Vo’ Euganeo","d":["Colli Euganei"]},{"n":"Cazzaro Alessandro","s":"cazzaro-alessandro","c":"Rovolon","d":["Colli Euganei"]},{"n":"Colle Mattara","s":"colle-mattara","c":"Rovolon","d":["Colli Euganei"]},{"n":"Conselve Vigneti e Cantine","s":"conselve-vigneti-e-cantine","c":"Conselve","d":["Colli Euganei"]},{"n":"Conte Emo Capodilista","s":"conte-emo-capodilista","c":"Selvazzano Dentro","d":["Colli Euganei"]},{"n":"Dal Santo Antonio","s":"dal-santo-antonio","c":"Cinto Euganeo","d":["Colli Euganei"]},{"n":"Dalla Montà Enzo","s":"dalla-monta-enzo","c":"Vo'","d":["Colli Euganei"]},{"n":"De Giusti","s":"de-giusti","c":"San Vendemiano","d":["Colli Euganei"]},{"n":"De Santi Andrea","s":"de-santi-andrea","c":"Vo'","d":["Colli Euganei"]},{"n":"Dotto Lidio","s":"dotto-lidio","c":"Vo'","d":["Colli Euganei"]},{"n":"Facchin","s":"facchin","c":"Vo'","d":["Colli Euganei"]},{"n":"Farasin Armando","s":"farasin-armando","c":"Vo'","d":["Colli Euganei"]},{"n":"Fasolo Paolo","s":"fasolo-paolo","c":"Rovolon","d":["Colli Euganei"]},{"n":"Fattoria Danieletto","s":"fattoria-danieletto","c":"Teolo","d":["Colli Euganei"]},{"n":"Fattoria Eolia","s":"fattoria-eolia","c":"Rovolon","d":["Colli Euganei"]},{"n":"Fontana","s":"fontana","c":"Vo'","d":["Colli Euganei"]},{"n":"Gallo Lamberto","s":"gallo-lamberto","c":"Vo'","d":["Colli Euganei"]},{"n":"Gambalonga Emanuele","s":"gambalonga-emanuele","c":"Cinto Euganeo","d":["Colli Euganei"]},{"n":"Giacomin Franco","s":"giacomin-franco","c":"Galzignano Terme","d":["Colli Euganei"]},{"n":"Gomiero Pietro","s":"gomiero-pietro","c":"Rovolon","d":["Colli Euganei"]},{"n":"Il Filo' delle Vigne","s":"il-filo-delle-vigne","c":"Baone","d":["Colli Euganei"]},{"n":"Il Mottolo","s":"il-mottolo","c":"Baone","d":["Colli Euganei"]},{"n":"Il Pianzio","s":"il-pianzio","c":"Galzignano Terme","d":["Colli Euganei"]},{"n":"Immobiliare San Giorgio","s":"immobiliare-san-giorgio","c":"Rovolon","d":["Colli Euganei"]},{"n":"L'Alveare","s":"l-alveare","c":"Vo'","d":["Colli Euganei"]},{"n":"La Costa","s":"la-costa","c":"Vo'","d":["Colli Euganei"]},{"n":"La Palazzina","s":"la-palazzina","c":"Rovolon","d":["Colli Euganei"]},{"n":"La Pioppa","s":"la-pioppa","c":"Vo'","d":["Colli Euganei"]},{"n":"La Rocca","s":"la-rocca","c":"Vo'","d":["Colli Euganei"]},{"n":"La Scagliara","s":"la-scagliara","c":"Galzignano Terme","d":["Colli Euganei"]},{"n":"Le Abane","s":"le-abane","c":"Vo'","d":["Colli Euganei"]},{"n":"Le Forche","s":"le-forche","c":"Teolo","d":["Colli Euganei"]},{"n":"Le Ginestre di Riolfatto Maurizio","s":"le-ginestre-di-riolfatto-maurizio","c":"Cinto Euganeo","d":["Colli Euganei"]},{"n":"Le Volpi","s":"le-volpi","c":"Baone","d":["Colli Euganei"]},{"n":"Lispida","s":"lispida","c":"Monselice","d":["Colli Euganei"]},{"n":"Lubian","s":"lubian","c":"Cinto Euganeo","d":["Colli Euganei"]},{"n":"Lunardi Francesco","s":"lunardi-francesco","c":"Galzignano Terme","d":["Colli Euganei"]},{"n":"Luvit & Lumoè","s":"luvit-e-lumoe","c":"Borso del Grappa","d":["Colli Euganei"]},{"n":"Maeli","s":"maeli","c":"Torreglia","d":["Colli Euganei"]},{"n":"Maeli","s":"maeli-2","c":"Baone","d":["Colli Euganei"]},{"n":"Marsilio Fortunato","s":"marsilio-fortunato","c":"Cinto Euganeo","d":["Colli Euganei"]},{"n":"Mercurio Lidio","s":"mercurio-lidio","c":"Vo'","d":["Colli Euganei"]},{"n":"Mirabello","s":"mirabello","c":"Torreglia","d":["Colli Euganei"]},{"n":"Monte Altore","s":"monte-altore","c":"Vo'","d":["Colli Euganei"]},{"n":"Monte Forche","s":"monte-forche","c":"Vo'","d":["Colli Euganei"]},{"n":"Montegrande","s":"montegrande","c":"Rovolon","d":["Colli Euganei"]},{"n":"Munari Bruno","s":"munari-bruno","c":"Arquà Petrarca","d":["Colli Euganei"]},{"n":"Olivato Ivo","s":"olivato-ivo","c":"Cinto Euganeo","d":["Colli Euganei"]},{"n":"Pegoraro Mario","s":"pegoraro-mario","c":"Vo'","d":["Colli Euganei"]},{"n":"Pigafetta Vini","s":"pigafetta-vini","c":"Rovolon","d":["Colli Euganei"]},{"n":"Rappo Ennio","s":"rappo-ennio","c":"Vo'","d":["Colli Euganei"]},{"n":"Ravarotto Lino","s":"ravarotto-lino","c":"Cinto Euganeo","d":["Colli Euganei"]},{"n":"Salmazza Antonio","s":"salmazza-antonio","c":"Vo'","d":["Colli Euganei"]},{"n":"Salvan - Vigne del Pigozzo","s":"salvan-vigne-del-pigozzo","c":"Due Carrare","d":["Colli Euganei"]},{"n":"Santimaria Simone","s":"santimaria-simone","c":"Vo'","d":["Colli Euganei"]},{"n":"Sengiari","s":"sengiari","c":"Teolo","d":["Colli Euganei"]},{"n":"Serraglio","s":"serraglio","c":"Vo'","d":["Colli Euganei"]},{"n":"Sinigaglia Antonio","s":"sinigaglia-antonio","c":"Cinto Euganeo","d":["Colli Euganei"]},{"n":"Sinigaglia F.lli","s":"sinigaglia-f-lli","c":"Cinto Euganeo","d":["Colli Euganei"]},{"n":"Sinigaglia Pasqualino","s":"sinigaglia-pasqualino","c":"Cinto Euganeo","d":["Colli Euganei"]},{"n":"Società Agricola Gamba","s":"societa-agricola-gamba","c":"Vo'","d":["Colli Euganei"]},{"n":"Tenuta San Basilio","s":"tenuta-san-basilio","c":"Vo'","d":["Colli Euganei"]},{"n":"Terre del Pirio","s":"terre-del-pirio","c":"Torreglia","d":["Colli Euganei"]},{"n":"Terre Gaie","s":"terre-gaie","c":"Vo'","d":["Colli Euganei"]},{"n":"Toniolo Vigneti e Cantina","s":"toniolo-vigneti-e-cantina","c":"Galzignano Terme","d":["Colli Euganei"]},{"n":"Valle Madonnina","s":"valle-madonnina","c":"Rovolon","d":["Colli Euganei"]},{"n":"Veronese","s":"veronese","c":"Cinto Euganeo","d":["Colli Euganei"]},{"n":"Vezzù Gianfranco","s":"vezzu-gianfranco","c":"Vo'","d":["Colli Euganei"]},{"n":"Vicentini Angelo e Luigi","s":"vicentini-angelo-e-luigi","c":"Vo'","d":["Colli Euganei"]},{"n":"Vigna Vecchia","s":"vigna-vecchia","c":"Cinto Euganeo","d":["Colli Euganei"]},{"n":"Vignalta","s":"vignalta","c":"Arquà Petrarca","d":["Colli Euganei"]},{"n":"Vigne al Colle","s":"vigne-al-colle","c":"Rovolon","d":["Colli Euganei"]},{"n":"Vigne delle Rose","s":"vigne-delle-rose","c":"Albignasego","d":["Colli Euganei"]},{"n":"Villa Albertini","s":"villa-albertini","c":"Vo'","d":["Colli Euganei"]},{"n":"Villa Egizia","s":"villa-egizia","c":"Battaglia Terme","d":["Colli Euganei"]},{"n":"Vini De Santi","s":"vini-de-santi","c":"Vo'","d":["Colli Euganei"]},{"n":"Zanuso","s":"zanuso","c":"Vo'","d":["Colli Euganei"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
    <script src="/shell.js" defer></script>

    </html>
