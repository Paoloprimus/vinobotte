<!doctype html>
    <html lang="it">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produttori vini Colli Euganei — VinoBotte</title>
    <style>
    :root{--bg:#faf8f4;--ink:#1d1b19;--line:#d9d3c8;--acc:#7a1f2b}
    @media (prefers-color-scheme:dark){:root{--bg:#171513;--ink:#f1ece4;--line:#3a352f;--acc:#e08a96}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
    main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    a{color:var(--acc)}
    .top a{text-decoration:none;font-weight:700}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:14px 0 14px}
    .filtri{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
    input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%}
    #n{color:var(--ink);margin:6px 0;font-size:14px}
    ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    li{border-bottom:1px solid var(--line)}
    li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;text-decoration:none;color:inherit}
    li a:hover .nm,li a:focus-visible .nm{text-decoration:underline}
    .nm{color:var(--acc);font-weight:700}
    .sub{font-size:14px;grid-column:1 / -1}
    @media (max-width:560px){.filtri{grid-template-columns:1fr}}
    </style>
    </head>
    <body>
    <main>
    <div class="top"><a href="/">VinoBotte</a></div>
    <h1>Produttori vini Colli Euganei</h1>
    <div class="filtri">
    <input id="q" type="search" placeholder="Nome cantina" aria-label="Nome cantina">
    <select id="c" aria-label="Comune"><option value="">Tutti i comuni</option></select>
    <select id="d" aria-label="Denominazione"><option value="">Tutte le denominazioni</option><option>Colli Euganei</option></select>
    </div>
    <div id="n" role="status"></div>
    <ul id="l"></ul>
    </main>
    <script>
    const D=[{"n":"A.R.A. dei F.lli Trentin","s":"a-r-a-dei-f-lli-trentin-euganei","c":"Arquà Petrarca","d":["Colli Euganei"]},{"n":"Acino Rosso","s":"acino-rosso-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Ai Molini","s":"ai-molini-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Alla Campagnola","s":"alla-campagnola-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Alla Fonte","s":"alla-fonte-euganei","c":"Este","d":["Colli Euganei"]},{"n":"Ambrosi Francesco","s":"ambrosi-francesco-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Ambrosi Sergio","s":"ambrosi-sergio-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Azienda Le Forche","s":"azienda-le-forche-euganei","c":"Arquà Petrarca","d":["Colli Euganei"]},{"n":"Bacco e Arianna","s":"bacco-e-arianna-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Beldomando delle Boschette","s":"beldomando-delle-boschette-euganei","c":"Torreglia","d":["Colli Euganei"]},{"n":"Belvedere","s":"belvedere-euganei","c":"Rovolon","d":["Colli Euganei"]},{"n":"Bressan Lucio","s":"bressan-lucio-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Bressanin Loris","s":"bressanin-loris-euganei","c":"Arquà Petrarca","d":["Colli Euganei"]},{"n":"Ca' Bianca","s":"ca-bianca-euganei","c":"Cinto Euganeo","d":["Colli Euganei"]},{"n":"Ca' del Colle","s":"ca-del-colle-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Ca' della Vigna","s":"ca-della-vigna-euganei","c":"Selvazzano Dentro","d":["Colli Euganei"]},{"n":"Ca' Ferri","s":"ca-ferri-euganei","c":"Padova","d":["Colli Euganei"]},{"n":"Ca' Ferro","s":"ca-ferro-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Ca' Manin","s":"ca-manin-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Ca' Orologio","s":"ca-orologio-euganei","c":"Baone","d":["Colli Euganei"]},{"n":"Ca' Paruta","s":"ca-paruta-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Calaon Paolo","s":"calaon-paolo-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Cantina Benato","s":"cantina-benato-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Cantina Colli anei"]},{"n":"Rappo Ennio","s":"rappo-ennio-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Ravarotto Lino","s":"ravarotto-lino-euganei","c":"Cinto Euganeo","d":["Colli Euganei"]},{"n":"Salmazza Antonio","s":"salmazza-antonio-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Salvan - Vigne del Pigozzo","s":"salvan-vigne-del-pigozzo-euganei","c":"Due Carrare","d":["Colli Euganei"]},{"n":"Santimaria Simone","s":"santimaria-simone-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Sengiari","s":"sengiari-euganei","c":"Teolo","d":["Colli Euganei"]},{"n":"Serraglio","s":"serraglio-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Sinigaglia Antonio","s":"sinigaglia-antonio-euganei","c":"Cinto Euganeo","d":["Colli Euganei"]},{"n":"Sinigaglia F.lli","s":"sinigaglia-f-lli-euganei","c":"Cinto Euganeo","d":["Colli Euganei"]},{"n":"Sinigaglia Pasqualino","s":"sinigaglia-pasqualino-euganei","c":"Cinto Euganeo","d":["Colli Euganei"]},{"n":"Società Agricola Gamba","s":"societa-agricola-gamba-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Tenuta San Basilio","s":"tenuta-san-basilio-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Terre del Pirio","s":"terre-del-pirio-euganei","c":"Torreglia","d":["Colli Euganei"]},{"n":"Terre Gaie","s":"terre-gaie-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Toniolo Vigneti e Cantina","s":"toniolo-vigneti-e-cantina-euganei","c":"Galzignano Terme","d":["Colli Euganei"]},{"n":"Valle Madonnina","s":"valle-madonnina-euganei","c":"Rovolon","d":["Colli Euganei"]},{"n":"Veronese","s":"veronese-euganei","c":"Cinto Euganeo","d":["Colli Euganei"]},{"n":"Vezzù Gianfranco","s":"vezzu-gianfranco-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Vicentini Angelo e Luigi","s":"vicentini-angelo-e-luigi-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Vigna Vecchia","s":"vigna-vecchia-euganei","c":"Cinto Euganeo","d":["Colli Euganei"]},{"n":"Vigne al Colle","s":"vigne-al-colle-euganei","c":"Rovolon","d":["Colli Euganei"]},{"n":"Vigne delle Rose","s":"vigne-delle-rose-euganei","c":"Albignasego","d":["Colli Euganei"]},{"n":"Villa Albertini","s":"villa-albertini-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Villa Egizia","s":"villa-egizia-euganei","c":"Battaglia Terme","d":["Colli Euganei"]},{"n":"Vini De Santi","s":"vini-de-santi-euganei","c":"Vo'","d":["Colli Euganei"]},{"n":"Zanuso","s":"zanuso-euganei","c":"Vo'","d":["Colli Euganei"]}];
    const q=document.getElementById('q'),c=document.getElementById('c'),d=document.getElementById('d'),l=document.getElementById('l'),n=document.getElementById('n');
    [...new Set(D.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it')).forEach(x=>{const o=document.createElement('option');o.textContent=x;c.appendChild(o)});
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function mostra(){
     const t=norm(q.value.trim());
     const r=D.filter(x=>(!t||norm(x.n).includes(t))&&(!c.value||x.c===c.value)&&(!d.value||x.d.includes(d.value)));
     n.textContent=r.length+(r.length===1?' cantina':' cantine');
     l.innerHTML=r.map(x=>'<li><a href="/pagine/'+x.s+'.html"><span class="nm">'+esc(x.n)+'</span><span>'+esc(x.c)+'</span><span class="sub">'+esc(x.d.join(' · '))+'</span></a></li>').join('');
    }
    [q,c,d].forEach(e=>e.addEventListener('input',mostra));
    mostra();
    </script>
